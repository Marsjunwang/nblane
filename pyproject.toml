[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nblane"
version = "0.2.0"
description = "Human + Agent + Team co-evolution system"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "markdown>=3.6",
    "openai>=1.30",
    "httpx[socks]>=0.28",
    "Pillow>=10",
    "PyMuPDF>=1.24",
    "pypdf>=5",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "pydantic>=2,<3",
    "mcp>=1.0",
]

[project.optional-dependencies]
local-translation = [
    "ctranslate2>=4.5",
    "sentencepiece>=0.2",
    "transformers>=4.45,<5",
    "huggingface_hub>=0.24",
]

[project.scripts]
nblane = "nblane.cli:main"
nblane-mcp = "nblane.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["nblane*", "schemas*"]

[tool.setuptools.package-data]
"nblane.core" = [
    "data/*.csv",
    "data/*.yaml",
]
"nblane.core.ai_blog_prompts" = [
    "en/*.md",
    "zh/*.md",
]
"nblane.i18n" = [
    "en/*.yaml",
    "zh/*.yaml",
]
"nblane.web_reader_api" = [
    "templates/*.html",
    "static/assets/*",
]
"nblane.paper_library_component" = [
    "frontend/static/index.html",
    "frontend/static/assets/*",
]
"nblane.web_ui" = [
    "static/index.html",
    "static/assets/*",
]
"schemas" = [
    "*.yaml",
]
