name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked package and test dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Validate profiles
        run: uv run --no-sync python -m nblane.cli validate

      - name: CLI status smoke
        run: uv run --no-sync python -m nblane.cli status

      - name: Import smoke
        run: >
          uv run --no-sync python -c "import nblane.web_api, nblane.web_reader_api;
          from nblane.core.profile_ingest import merge_ingest_patch;
          print('imports ok')"

  # Freshness check for the bundled frontends: rebuild every
  # src/nblane/*_component/frontend (today only the Paper Library frontend
  # served by the Reader API) plus the SPA frontend src/nblane/web_ui/frontend,
  # and fail when the committed artifacts (frontend/static, web_ui/static for
  # the SPA) no longer match the source. We rebuild +
  # diff rather than compare git timestamps: timestamp checks
  # false-positive on source edits that do not change the bundle (tests,
  # comments), while a real build is the ground truth. Total cost is a
  # few minutes on a runner (small Vite apps).
  frontend-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/nblane/*_component/frontend/package-lock.json
            src/nblane/web_ui/frontend/package-lock.json

      - name: Rebuild component and SPA frontends and verify artifacts are fresh
        run: |
          set -euo pipefail
          artifact_dirs=()
          for frontend in src/nblane/*_component/frontend src/nblane/web_ui/frontend; do
            [ -f "$frontend/package.json" ] || { echo "skip $frontend (no package.json)"; continue; }
            [ -d "$frontend/src" ] || { echo "skip $frontend (no src/)"; continue; }
            grep -q '"build"' "$frontend/package.json" || { echo "skip $frontend (no build script)"; continue; }
            echo "== build $frontend"
            # Components without dependencies (plain node build.mjs) need no
            # install; npm ci needs a lockfile, everything else falls back to
            # npm install.
            if grep -qE '"(dev)?dependencies"' "$frontend/package.json"; then
              if [ -f "$frontend/package-lock.json" ]; then
                npm ci --prefix "$frontend" --no-audit --no-fund
              else
                npm install --prefix "$frontend" --no-audit --no-fund
              fi
            fi
            npm run test --prefix "$frontend"
            if [ "$frontend" = src/nblane/web_ui/frontend ]; then
              npm run gen:api --prefix "$frontend"
              git diff --exit-code -- "$frontend/src/api/schema.d.ts"
            fi
            npm run build --prefix "$frontend"
            if [ "$frontend" = src/nblane/web_ui/frontend ]; then
              npm run check:spa-budget
            fi
            for out in static dist; do
              [ -d "$frontend/$out" ] && artifact_dirs+=("$frontend/$out")
            done
            # The SPA builds into ../static (src/nblane/web_ui/static), the
            # in-package dir served by nblane.web_api.spa.
            [ -d "$frontend/../static" ] && artifact_dirs+=("$frontend/../static")
          done
          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "No component artifact dirs found; nothing to check."
            exit 0
          fi
          stale="$(git status --porcelain -- "${artifact_dirs[@]}")"
          if [ -n "$stale" ]; then
            echo "::error::Committed frontend build artifacts are stale:"
            echo "$stale"
            echo
            echo "Rebuild the affected frontends and commit the output:"
            echo "  cd src/nblane/<name>_component/frontend && npm install && npm run build"
            echo "  cd src/nblane/web_ui/frontend && npm install && npm run build"
            git diff -- "${artifact_dirs[@]}" | head -200 || true
            exit 1
          fi
          echo "All component artifacts are fresh: ${artifact_dirs[*]}"

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e:harness
      - run: npx playwright install --with-deps chromium
      - name: Exercise isolated login, navigation and task mutation
        run: npm run test:e2e -- spa_smoke spa_auth.spec spa_mutations --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
