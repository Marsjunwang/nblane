name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Validate profiles
        run: python -m nblane.cli validate

      - name: CLI status smoke
        run: python -m nblane.cli status

      - name: Import smoke
        run: >
          python -c "from nblane.kanban_ui import render_kanban_board;
          from nblane.core.profile_ingest import merge_ingest_patch;
          print('imports ok')"

  # Freshness check for the bundled Streamlit component frontends: rebuild
  # every src/nblane/*_component/frontend that has a build script and fail
  # when the committed artifacts (frontend/static, or frontend/dist for
  # goal_presence) no longer match the source. We rebuild + diff rather than
  # compare git timestamps: timestamp checks false-positive on source edits
  # that do not change the bundle (tests, comments), while a real build is
  # the ground truth. Total cost is a few minutes on a runner (small Vite
  # apps; the heaviest deps are three.js in home_dashboard).
  frontend-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/nblane/*_component/frontend/package-lock.json

      - name: Rebuild component frontends and verify artifacts are fresh
        run: |
          set -euo pipefail
          artifact_dirs=()
          for frontend in src/nblane/*_component/frontend; do
            [ -f "$frontend/package.json" ] || { echo "skip $frontend (no package.json)"; continue; }
            [ -d "$frontend/src" ] || { echo "skip $frontend (no src/)"; continue; }
            grep -q '"build"' "$frontend/package.json" || { echo "skip $frontend (no build script)"; continue; }
            echo "== build $frontend"
            # Components without dependencies (plain node build.mjs) need no
            # install; npm ci needs a lockfile, everything else falls back to
            # npm install.
            if grep -qE '"(dev)?dependencies"' "$frontend/package.json"; then
              if [ -f "$frontend/package-lock.json" ]; then
                npm ci --prefix "$frontend" --no-audit --no-fund
              else
                npm install --prefix "$frontend" --no-audit --no-fund
              fi
            fi
            npm run build --prefix "$frontend"
            for out in static dist; do
              [ -d "$frontend/$out" ] && artifact_dirs+=("$frontend/$out")
            done
          done
          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "No component artifact dirs found; nothing to check."
            exit 0
          fi
          stale="$(git status --porcelain -- "${artifact_dirs[@]}")"
          if [ -n "$stale" ]; then
            echo "::error::Committed component build artifacts are stale:"
            echo "$stale"
            echo
            echo "Rebuild the affected component frontends and commit the output:"
            echo "  cd src/nblane/<name>_component/frontend && npm install && npm run build"
            git diff -- "${artifact_dirs[@]}" | head -200 || true
            exit 1
          fi
          echo "All component artifacts are fresh: ${artifact_dirs[*]}"
