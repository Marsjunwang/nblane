<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #60716e;
      --line: #d8e0dc;
      --paper: #ffffff;
      --soft: #f6f8f7;
      --soft-strong: #edf3f0;
      --accent: #21685b;
      --accent-strong: #174d43;
      --accent-soft: #e3f2ee;
      --warn: #8a5b12;
      --danger: #9f1d1d;
      --info: #295b82;
      --shadow: 0 10px 28px rgba(23, 33, 31, .08);
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .kb-shell { display: grid; gap: 12px; padding: 2px 0 16px; }
    .kb-topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 8px 10px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 2px 10px rgba(23, 33, 31, .05);
    }
    .kb-toolbar-controls {
      grid-column: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .kb-toolbar-status {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kb-toolbar-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .kb-toolbar-toggle:hover { border-color: rgba(33, 104, 91, .55); color: var(--accent-strong); }
    .kb-toolbar-toggle input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .kb-quick { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(140px, 190px) 38px 38px; gap: 8px; }
    .kb-quick-more { grid-column: 1 / -1; display: grid; gap: 8px; }
    .kb-quick-more textarea {
      width: 100%;
      min-height: 52px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      resize: vertical;
    }
    .kb-quick-more textarea:focus { border-color: rgba(33, 104, 91, .55); }
    .kb-quick input,
    .kb-quick select,
    .kb-field input,
    .kb-field select,
    .kb-field textarea,
    .kb-move-control select {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      background: var(--paper);
      color: var(--ink);
    }
    .kb-quick input:focus,
    .kb-quick select:focus,
    .kb-field input:focus,
    .kb-field select:focus,
    .kb-field textarea:focus,
    .kb-move-control select:focus {
      border-color: rgba(33, 104, 91, .65);
      box-shadow: 0 0 0 3px rgba(33, 104, 91, .11);
    }
    .kb-button, .kb-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: .86rem;
      font-weight: 750;
      line-height: 1;
      white-space: nowrap;
    }
    .kb-button.primary, .kb-icon-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .kb-button:hover, .kb-icon-button:hover { border-color: rgba(33, 104, 91, .55); background: var(--accent-soft); }
    .kb-button.primary:hover, .kb-icon-button.primary:hover { background: var(--accent-strong); }
    .kb-icon-button { width: 38px; padding: 0; font-size: 1.15rem; }
    .kb-status { color: var(--muted); font-size: .84rem; }
    .kb-workspace { display: grid; gap: 12px; align-items: start; }
    .kb-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(210px, 1fr)) minmax(150px, .7fr);
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .kb-column {
      min-width: 210px;
      min-height: 120px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .kb-column.is-over { outline: 2px dashed rgba(33, 104, 91, .45); outline-offset: -5px; }
    .kb-column.is-stage-queue { border-left: 3px solid var(--info); }
    .kb-column.is-stage-doing { border-left: 3px solid var(--accent); background: var(--soft-strong); }
    .kb-column.is-stage-done { border-left: 3px solid #9fcabc; }
    .kb-column.is-stage-side { min-width: 150px; opacity: .82; border-left: 3px solid var(--line); }
    .kb-column.is-stage-side .kb-column-head strong { color: var(--muted); }
    .kb-stage-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      margin-right: 6px;
      border-radius: 999px;
      background: var(--muted);
      color: #fff;
      font-size: .68rem;
      font-weight: 850;
      flex: 0 0 auto;
      vertical-align: middle;
    }
    .kb-column.is-stage-doing .kb-stage-step { background: var(--accent); }
    .kb-head-meta { display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .kb-pill.warn { border-color: #ead5ab; background: #fff7e8; color: var(--warn); }
    .kb-column-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
    .kb-column-head strong { min-width: 0; overflow: hidden; font-size: .92rem; font-weight: 850; text-overflow: ellipsis; white-space: nowrap; }
    .kb-count, .kb-pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: .74rem;
      font-weight: 780;
      line-height: 1;
    }
    .kb-card-list { display: grid; align-content: start; gap: 8px; min-height: 60px; }
    .kb-card {
      display: grid;
      gap: 7px;
      width: 100%;
      min-height: 92px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 1px 2px rgba(23, 33, 31, .04);
      cursor: grab;
    }
    .kb-card:active { cursor: grabbing; }
    .kb-card.is-selected { border-color: rgba(33, 104, 91, .75); box-shadow: 0 0 0 3px rgba(33, 104, 91, .12); }
    .kb-card.is-editing { cursor: default; }
    .kb-card.is-crystallized { background: #f2f7f5; }
    .kb-card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
      min-height: 30px;
    }
    .kb-card-title { overflow-wrap: anywhere; font-size: .9rem; font-weight: 820; line-height: 1.25; }
    .kb-title-input {
      width: 100%;
      min-height: 32px;
      padding: 5px 7px;
      border: 1px solid rgba(33, 104, 91, .45);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: .9rem;
      font-weight: 820;
      line-height: 1.2;
    }
    .kb-head-actions, .kb-quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: flex-end;
      align-items: center;
    }
    .kb-head-button, .kb-action-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }
    .kb-head-button { min-width: 28px; padding: 0 7px; }
    .kb-action-chip { padding: 0 7px; }
    .kb-head-button:hover, .kb-action-chip:hover {
      border-color: rgba(33, 104, 91, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .kb-head-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .kb-head-button.danger {
      border-color: rgba(159, 29, 29, .35);
      color: var(--danger);
    }
    .kb-head-button.danger:hover {
      border-color: rgba(159, 29, 29, .65);
      background: #fff0f0;
    }
    .kb-quick-actions { justify-content: flex-start; min-height: 28px; }
    .kb-menu {
      display: grid;
      gap: 2px;
      margin-top: 2px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .kb-menu button {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      min-height: 30px;
      padding: 5px 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: .8rem;
      font-weight: 750;
      text-align: left;
    }
    .kb-menu button:hover { background: var(--accent-soft); color: var(--accent-strong); }
    .kb-menu button.danger { color: var(--danger); }
    .kb-menu button.danger:hover { background: #fff0f0; color: var(--danger); }
    .kb-move-control {
      display: inline-grid;
      grid-template-columns: minmax(90px, 150px) 32px;
      gap: 4px;
      min-width: 128px;
    }
    .kb-move-control select {
      min-height: 28px;
      padding: 3px 7px;
      border-radius: 8px;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
    }
    .kb-move-control .kb-head-button {
      min-height: 28px;
      min-width: 32px;
      padding: 0;
    }
    .kb-card-context { color: var(--muted); display: -webkit-box; overflow: hidden; font-size: .78rem; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
    .kb-card-meta, .kb-chips, .kb-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .kb-read-body { display: grid; gap: 5px; }
    .kb-read-extra { display: grid; gap: 8px; }
    .kb-read-line {
      color: var(--muted);
      display: -webkit-box;
      overflow: hidden;
      font-size: .78rem;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
    }
    .kb-read-line strong { color: var(--ink); font-weight: 780; }
    .kb-read-subtasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 5px 12px; margin-top: 1px; }
    .kb-check-row.is-compact { font-size: .78rem; min-height: 22px; }
    .kb-check-row.is-compact input { height: 15px; width: 15px; }
    .kb-empty { color: var(--muted); font-size: .84rem; padding: 10px 2px; }
    .kb-detail {
      display: grid;
      gap: 10px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      cursor: default;
    }
    .kb-detail-empty {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }
    .kb-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; }
    .kb-detail-head strong { font-size: .94rem; font-weight: 850; }
    .kb-field { display: grid; gap: 6px; }
    .kb-field span, .kb-section-title { color: var(--muted); font-size: .74rem; font-weight: 800; text-transform: uppercase; }
    .kb-field textarea { min-height: 64px; resize: vertical; line-height: 1.4; }
    .kb-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .kb-detail details { display: block; }
    .kb-detail details > *:not(summary) { margin-top: 10px; }
    .kb-detail details > summary {
      cursor: pointer;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 0;
      list-style: revert;
    }
    .kb-detail details[open] > summary { margin-bottom: 10px; }
    .kb-subtasks { display: grid; gap: 7px; }
    .kb-check-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; min-height: 26px; color: var(--ink); font-size: .84rem; line-height: 1.35; overflow-wrap: anywhere; }
    .kb-check-row input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--accent); }
    .kb-new-subtask { display: grid; grid-template-columns: minmax(0, 1fr) 38px; gap: 7px; }
    .kb-subtask-edit-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 32px; gap: 7px; align-items: center; }
    .kb-subtask-edit-row input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .kb-subtask-edit-row input[type="text"] {
      min-height: 32px;
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    .kb-delete-mini {
      width: 32px;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--danger);
      font-weight: 850;
    }
    .kb-proposals { display: grid; gap: 7px; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
    .kb-proposal-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 32px; gap: 8px; align-items: start; min-height: 34px; }
    .kb-proposal-body { display: grid; gap: 5px; min-width: 0; }
    .kb-proposal-row input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .kb-proposal-row input[type="text"] {
      width: 100%;
      min-height: 32px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    .kb-proposal-meta { color: var(--muted); font-size: .76rem; line-height: 1.35; overflow-wrap: anywhere; }
    .kb-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      max-width: 100%;
      padding: 4px 9px;
      border: 1px solid #c6dad3;
      border-radius: 999px;
      background: #eef7f4;
      color: #174d43;
      font-size: .76rem;
      font-weight: 750;
      line-height: 1.15;
      overflow-wrap: anywhere;
      text-decoration: none;
    }
    .kb-chip.warn { border-color: #ead5ab; background: #fff7e8; color: var(--warn); }
    .kb-chip.action { cursor: pointer; }
    .kb-chip-muted {
      border-color: #d6dcda;
      background: #f1f4f3;
      color: #4a5a55;
      font-weight: 650;
    }
    .kb-read-provenance { display: flex; flex-wrap: wrap; gap: 6px; }
    .kb-alignment { display: grid; gap: 8px; padding: 9px; border: 1px solid #d8d0e8; border-radius: 8px; background: #f6f3fb; }
    .kb-alignment-row { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; }
    .kb-alignment-row input[type="radio"],
    .kb-alignment-row input[type="checkbox"] { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); }
    .kb-alignment-row strong { display: block; font-size: .82rem; line-height: 1.25; }
    .kb-alignment-body { display: grid; gap: 6px; min-width: 0; }
    .kb-alignment-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .kb-alignment input[type="text"],
    .kb-alignment select,
    .kb-alignment textarea {
      min-height: 58px;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      resize: vertical;
    }
    .kb-alignment input[type="text"],
    .kb-alignment select { min-height: 32px; resize: none; }
    .kb-gap { display: grid; gap: 6px; padding: 9px; border: 1px solid #c8d7e3; border-radius: 8px; background: #f1f6fa; }
    .kb-gap .kb-section-title { color: var(--info); }
    .kb-alert { padding: 9px 10px; border-radius: 8px; background: var(--soft); color: var(--muted); font-size: .84rem; line-height: 1.4; }
    .kb-uncrystallized { display: grid; gap: 8px; padding: 10px 12px; border: 1px solid #ead5ab; border-radius: 8px; background: #fff9ed; }
    .kb-focus-layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(220px, 1fr); gap: 12px; align-items: start; }
    .kb-focus-main, .kb-focus-side { min-width: 0; }
    .kb-focus-main .kb-column { min-height: 200px; }
    .kb-focus-main .kb-card-list { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    .kb-focus-main .kb-card.is-editing { grid-column: 1 / -1; }
    .kb-focus-side { display: grid; gap: 8px; min-width: 0; }
    .kb-focus-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .kb-tab {
      min-height: 32px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
      color: var(--muted);
      font-size: .8rem;
      font-weight: 780;
    }
    .kb-tab.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); }
    .kb-focus-side .kb-column { min-width: 0; min-height: 200px; }
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) {
      min-height: 72px;
      gap: 7px;
      padding: 12px;
      cursor: pointer;
    }
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) .kb-card-head {
      grid-template-columns: minmax(0, 1fr);
      min-height: 0;
    }
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) .kb-head-actions,
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) .kb-quick-actions {
      display: none;
    }
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) .kb-card-title {
      display: -webkit-box;
      overflow: hidden;
      font-size: 1rem;
      line-height: 1.25;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) .kb-card-meta {
      gap: 4px;
    }
    .kb-card.is-focus-tag:not(.is-selected):not(.is-editing) .kb-pill {
      min-height: 23px;
      padding: 2px 8px;
      font-size: .76rem;
    }
    .kb-focus-task-hint {
      color: var(--muted);
      display: -webkit-box;
      overflow: hidden;
      font-size: .84rem;
      line-height: 1.3;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow-wrap: anywhere;
    }
    @media (max-width: 760px) {
      .kb-topbar { grid-template-columns: 1fr; }
      .kb-quick { grid-template-columns: 1fr; }
      .kb-icon-button { width: 100%; }
      .kb-toolbar-controls { grid-column: 1; justify-content: flex-start; }
      .kb-toolbar-status { max-width: 100%; }
      .kb-board { grid-template-columns: repeat(4, minmax(230px, 82vw)); }
      .kb-focus-layout { grid-template-columns: 1fr; }
      .kb-focus-main .kb-card-list { grid-template-columns: 1fr; }
      .kb-read-subtasks { grid-template-columns: 1fr; }
      .kb-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const READY = "streamlit:componentReady";
    const SET_VALUE = "streamlit:setComponentValue";
    const SET_HEIGHT = "streamlit:setFrameHeight";
    const RENDER = "streamlit:render";
    const DEFAULT_ORDER = ["Doing", "Queue", "Done", "Someday / Maybe"];
    const STAGE_META = {
      "Queue": { step: "①", cls: "is-stage-queue" },
      "Doing": { step: "②", cls: "is-stage-doing" },
      "Done": { step: "③", cls: "is-stage-done" },
      "Someday / Maybe": { step: "", cls: "is-stage-side" },
    };
    const WIP_LIMIT = 5;
    const DEFAULT_LABELS = {
      add: "Add",
      archive_confirm: "Archive this Done task?",
      archive_done: "Archive",
      archive_short: "Archive",
      ai_done: "Done -> evidence",
      ai_done_short: "Evd",
      ai_gap: "Analyze gap",
      ai_gap_short: "Gap",
      ai_subtasks: "Draft subtasks",
      ai_subtasks_short: "Sub",
      auto_dates: "Auto dates",
      auto_dates_short: "Auto dates",
      auto_dates_help: "Auto-set started / completed dates on column move",
      focus_mode: "Focus mode",
      focus_mode_short: "Focus",
      focus_mode_help: "Doing full width; other columns in tabs",
      metric_total: "Total",

          if (event.key !== "Enter" && event.key !== " ") return;
          if (isInteractive(event.target)) return;
          event.preventDefault();
          selectedId = card.dataset.taskId;
          render();
        });
        card.addEventListener("dragover", (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
        card.addEventListener("drop", (event) => {
          event.preventDefault();
          event.stopPropagation();
          const draggedId = event.dataTransfer.getData("text/plain");
          const column = card.closest(".kb-column");
          moveTask(draggedId, column ? column.dataset.section : "", card.dataset.taskId);
        });
        card.addEventListener("dragstart", (event) => {
          if (isInteractive(event.target)) {
            event.preventDefault();
            return;
          }
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", card.dataset.taskId);
        });
      });
      document.querySelectorAll(".kb-column").forEach((column) => {
        column.addEventListener("dragover", (event) => {
          event.preventDefault();
          column.classList.add("is-over");
        });
        column.addEventListener("dragleave", () => column.classList.remove("is-over"));
        column.addEventListener("drop", (event) => {
          event.preventDefault();
          column.classList.remove("is-over");
          moveTask(event.dataTransfer.getData("text/plain"), column.dataset.section);
        });
      });
      document.querySelectorAll("[data-crystallize-id]").forEach((button) => {
        button.addEventListener("click", () => emit("crystallize_card", { card_id: button.dataset.crystallizeId }));
      });
      document.querySelectorAll("[data-subtask-task] [data-subtask-index]").forEach((box) => {
        box.addEventListener("change", () => {
          const wrap = box.closest("[data-subtask-task]");
          const taskId = wrap ? wrap.dataset.subtaskTask : "";
          if (!taskId) return;
          const subtaskIndex = Number(box.dataset.subtaskIndex);
          const subtaskTitle = text(box.dataset.subtaskTitle || "");
          const done = Boolean(box.checked);
          updateLocalSubtaskDone(taskId, subtaskIndex, subtaskTitle, done);
          emit("toggle_subtask", {
            card_id: taskId,
            subtask_index: subtaskIndex,
            subtask_title: subtaskTitle,
            done,
          });
        });
      });
      document.querySelectorAll("[data-selected-task]").forEach((panel) => {
        const taskId = panel.dataset.selectedTask;
        const projectSelect = panel.querySelector('[data-field="project_id"]');
        if (projectSelect) {
          projectSelect.addEventListener("change", () => refreshMilestoneSelect(panel));
        }
        panel.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.action;
            if (button.closest(".kb-menu")) openMenuId = "";
            if (action === "save") {
              const card = collectEditCard(panel);
              editingId = "";
              emit("edit_card", { card_id: taskId, card });
            } else if (action === "edit") {
              selectedId = taskId;
              editingId = taskId;
              render();
            } else if (action === "cancel_edit") {
              editingId = "";
              render();
            } else if (action === "add_subtask") {
              const input = panel.querySelector("[data-new-subtask]");
              const title = input ? input.value.trim() : "";
              if (title) {
                const card = collectEditCard(panel, { title, done: false });
                editingId = taskId;
                emit("edit_card", { card_id: taskId, card });
              }
            } else if (action === "delete_subtask") {
              const row = button.closest("[data-subtask-row]");
              const card = collectEditCard(panel, null, row);
              editingId = taskId;
              emit("edit_card", { card_id: taskId, card });
            } else if (action === "discard_subtask_draft") {
              const index = Number(button.dataset.proposalIndex);
              emit("discard_subtask_draft", { card_id: taskId, index });
            } else if (action === "open_activity_item") {
              emit("open_activity_item", {
                card_id: taskId,
                activity_item_id: text(button.dataset.activityItemId || ""),
              });
            } else if (action === "discard_subtask_drafts") {
              emit("discard_subtask_drafts", { card_id: taskId });
            } else if (action === "apply_subtasks") {
              const proposals = normalizeProposals(taskId);
              const drafts = Array.from(panel.querySelectorAll("[data-proposal-title]"))
                .map((input) => {
                  const index = Number(input.dataset.proposalTitle);
                  const check = panel.querySelector(`[data-proposal-check="${input.dataset.proposalTitle}"]`);
                  const proposal = proposals[index] || {};
                  return {
                    index,
                    title: input.value.trim(),
                    selected: !check || check.checked,
                    artifact: text(proposal.artifact || ""),
                    verification: text(proposal.verification || ""),
                    gap_node_id: text(proposal.gap_node_id || ""),
                    reason: text(proposal.reason || ""),
                  };
                });
              const titles = drafts
                .filter((draft) => draft.selected && draft.title)
                .map((draft) => draft.title);
              if (!titles.length) {
                window.alert(label("no_selected_drafts"));
                return;
              }
              const cardEl = panel.closest(".kb-card");
              const card = panel.querySelector("[data-field]")
                ? collectEditCard(panel)
                : collectReadCard(cardEl);
              emit("apply_subtasks", { card_id: taskId, drafts, titles, card });
            } else if (action === "confirm_alignment") {
              const selectedAlignments = Array.from(panel.querySelectorAll("[data-alignment-card]"))
                .filter((row) => Boolean(row.querySelector("[data-alignment-index]")?.checked))
                .map((row) => ({
                  label: text(row.querySelector("[data-alignment-label]")?.value || "").trim(),
                  goal: text(row.querySelector("[data-alignment-goal]")?.value || "").trim(),
                  assumptions: text(row.querySelector("[data-alignment-assumptions]")?.value || "")
                    .split(/\n+/)
                    .map((item) => item.trim())
                    .filter(Boolean),
                  subtask_style: text(row.querySelector("[data-alignment-style]")?.value || "").trim(),
                }))
                .filter((item) => item.label || item.goal || item.assumptions.length || item.subtask_style);
              const customOnly = panel.querySelector("[data-alignment-custom-only]");
              const useCustomOnly = Boolean(customOnly && customOnly.checked);
              const custom = panel.querySelector("[data-alignment-custom]");
              const customText = custom ? custom.value.trim() : "";
              if ((useCustomOnly && !customText) || (!useCustomOnly && !selectedAlignments.length && !customText)) {
                window.alert(label("alignment_required"));
                return;
              }
              const granularity = text(panel.querySelector("[data-alignment-granularity]")?.value || "milestone");
              emit("confirm_subtask_alignment", {
                card_id: taskId,
                alignment_mode: useCustomOnly ? "custom_only" : "selected_plus_custom",
                selected_alignments: useCustomOnly ? [] : selectedAlignments,
                custom_context: customText,
                granularity,
              });
            } else if (action === "cancel_alignment") {
              emit("cancel_subtask_alignment", { card_id: taskId });
            } else if (action === "ai_gap") {
              emit("request_gap", withPendingEditCard(panel, { card_id: taskId }));
            } else if (action === "ai_subtasks") {
              emit("request_subtasks", withPendingEditCard(panel, { card_id: taskId }));
            } else if (action === "archive_done") {
              if (!window.confirm(label("archive_confirm"))) return;
              emit("archive_done_card", withPendingEditCard(panel, { card_id: taskId }));
            } else if (action === "crystallize") {
              emit("crystallize_card", withPendingEditCard(panel, { card_id: taskId }));
            } else if (action === "move_to_section") {
              const select = panel.querySelector("[data-move-select]");
              const toSection = select ? select.value : "";
              const current = findTask(taskId);
              if (!toSection || !current || toSection === current.section) return;
              editingId = "";
              moveTask(
                taskId,
                toSection,
                "",
                withPendingEditCard(panel, {}),
              );
            } else if (action === "delete") {
              if (!window.confirm(label("delete_confirm"))) return;
              editingId = "";
              emit("delete_task", { card_id: taskId });
            }
          });
        });
      });
    }
    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type !== RENDER) return;
      args = data.args || {};
      board = normalizeBoard();
      // Drop optimistic view overrides once the server-side settings catch up.
      const liveSettings = settings();
      Object.keys(viewOverride).forEach((name) => {
        if (Boolean(liveSettings[name]) === Boolean(viewOverride[name])) {
          delete viewOverride[name];
        }
      });
      selectedId = text(asObj(args.ui || asObj(args.payload).ui).selected_card_id || selectedId);
      quickSection = quickSection || board.find((s) => s.key === "Queue")?.key || board[0]?.key || "";
      render();
    });
    send(READY, { apiVersion: 1 });
    setHeight();
  </script>
</body>
</html>
