<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #60716e;
      --line: #d8e0dc;
      --paper: #ffffff;
      --soft: #f6f8f7;
      --soft-strong: #edf3f0;
      --accent: #21685b;
      --accent-strong: #174d43;
      --accent-soft: #e3f2ee;
      --warn: #8a5b12;
      --danger: #9f1d1d;
      --mark: rgba(255, 214, 102, .42);
      --select: rgba(33, 104, 91, .18);
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .pr-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      height: 100%;
      min-height: 0;
      padding: 2px 0 6px;
    }
    .pr-shell.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      padding: 8px;
      background: var(--paper);
    }
    .pr-shell:fullscreen {
      padding: 8px;
      background: var(--paper);
    }
    .pr-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto auto minmax(160px, 240px) auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 2px 10px rgba(23, 33, 31, .05);
    }
    .pr-title {
      min-width: 0;
      overflow: hidden;
      font-size: .95rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pr-controls, .pr-actions, .pr-search, .pr-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .pr-search { flex-wrap: nowrap; justify-content: stretch; }
    .pr-mode { justify-content: flex-start; }
    .pr-button, .pr-icon-button, .pr-input, .pr-select, .pr-textarea {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      outline: 0;
    }
    .pr-button, .pr-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: .76rem;
      font-weight: 780;
      line-height: 1;
      white-space: nowrap;
    }
    .pr-icon-button { width: 30px; padding: 0; font-size: .88rem; }
    .pr-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .pr-button:hover, .pr-icon-button:hover {
      border-color: rgba(33, 104, 91, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.primary:hover {
      background: var(--accent-strong);
      color: #fff;
    }
    .pr-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.busy {
      border-color: rgba(33, 104, 91, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-action-status {
      display: none;
      max-width: 360px;
      min-height: 30px;
      align-items: center;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 720;
      line-height: 1.25;
    }
    .pr-action-status.visible { display: inline-flex; }
    .pr-action-status.pending {
      border-color: rgba(33, 104, 91, .35);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-action-status.error {
      border-color: rgba(159, 29, 29, .28);
      background: #fff3f3;
      color: var(--danger);
    }
    .pr-input, .pr-select, .pr-textarea {
      width: 100%;
      padding: 5px 8px;
      font-size: .8rem;
    }
    .pr-input:focus, .pr-select:focus, .pr-textarea:focus {
      border-color: rgba(33, 104, 91, .65);
      box-shadow: 0 0 0 3px rgba(33, 104, 91, .11);
    }
    .pr-page-input { width: 58px; text-align: center; }
    .pr-status {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      white-space: nowrap;
    }
    .pr-workspace {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(260px, 340px);
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .pr-workspace.panel-collapsed { grid-template-columns: minmax(420px, 1fr) 44px; }
    .pr-workspace.reader-mode-compare {
      grid-template-columns: minmax(360px, 1fr) minmax(280px, 380px) minmax(260px, 340px);
    }
    .pr-workspace.reader-mode-compare.panel-collapsed {
      grid-template-columns: minmax(360px, 1fr) minmax(280px, 380px) 44px;
    }
    .pr-workspace.reader-mode-translation {
      grid-template-columns: minmax(420px, 1fr) minmax(260px, 340px);
    }
    .pr-workspace.reader-mode-translation.panel-collapsed {
      grid-template-columns: minmax(420px, 1fr) 44px;
    }
    .pr-workspace.reader-mode-translation .pr-viewer { display: none; }
    .pr-viewer {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: auto;
      padding: 14px 14px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      scroll-behavior: smooth;
    }
    .pr-continuous-document {
      display: grid;
      gap: 18px;
      justify-items: center;
      min-height: 100%;
    }
    .pr-page-container {
      position: relative;
      display: grid;
      gap: 6px;
      justify-items: center;
      width: 100%;
      min-height: 320px;
      scroll-margin-top: 14px;
    }
    .pr-page-spacer {
      width: 1px;
      min-height: 1px;
      pointer-events: none;
    }
    .pr-page-label {
      justify-self: center;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 780;
    }
    .pr-page-wrap {
      position: relative;
      width: max-content;
      background: var(--paper);
      box-shadow: 0 4px 20px rgba(23, 33, 31, .10);
    }
    .pr-page-wrap.loading {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .82rem;
    }
    .pr-canvas {
      position: relative;
      z-index: 0;
      display: block;
    }
    .pr-canvas.pending-fallback { opacity: 0; }
    .pr-page-preview {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    .pr-page-preview.visible { display: block; }
    .pr-text-layer, .pr-highlight-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .pr-text-layer {
      z-index: 2;
      color: transparent;
      user-select: text;
      -webkit-user-select: text;
      line-height: 1;
      pointer-events: auto;
    }
    .pr-text-layer span {
      position: absolute;
      white-space: pre;
      transform-origin: 0 0;
      cursor: text;
    }
    .pr-highlight-layer { pointer-events: none; }
    .pr-highlight-layer { z-index: 3; }
    .pr-text-layer ::selection {
      background: rgba(33, 104, 91, .22);
      color: transparent;
    }
    .pr-highlight {
      position: absolute;
      border-radius: 3px;
      background: var(--mark);
      outline: 1px solid rgba(138, 91, 18, .18);
    }
    .pr-highlight.focus {
      background: rgba(33, 104, 91, .20);
      outline-color: rgba(33, 104, 91, .55);
    }
    .pr-highlight.pending {
      background: rgba(33, 104, 91, .16);
      outline: 1px dashed rgba(33, 104, 91, .55);
    }
    .pr-page-error {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 4;
      padding: 9px;
      border: 1px solid rgba(159, 29, 29, .32);
      border-radius: 8px;
      background: #fff3f3;
      color: var(--danger);
      font-size: .8rem;
      line-height: 1.35;
    }
    .pr-translation-reader {
      display: none;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }
    .pr-workspace.reader-mode-compare .pr-translation-reader,
    .pr-workspace.reader-mode-translation .pr-translation-reader {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .pr-translation-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      font-size: .86rem;
      font-weight: 850;
    }
    .pr-translation-body {
      display: grid;
      gap: 10px;
      align-content: start;
      padding: 10px;
    }
    .pr-translation-row {
      display: grid;
      gap: 5px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .pr-translation-source {
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .pr-translation-text {
      color: var(--ink);
      font-size: .86rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .pr-score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .pr-score {
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      text-align: center;
    }
    .pr-score strong { display: block; font-size: .95rem; }
    .pr-score span { color: var(--muted); font-size: .68rem; }
    .pr-dock {
      position: sticky;
      bottom: 10px;
      z-index: 24;
      display: grid;
      gap: 6px;
      grid-template-columns: minmax(0, 1fr) auto;
      margin: 12px auto 0;
      width: min(100%, 900px);
      padding: 8px;
      border: 1px solid rgba(33, 104, 91, .26);
      border-radius: 8px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 8px 24px rgba(23, 33, 31, .10);
    }
    .pr-dock.idle { display: none; }
    .pr-dock-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .pr-dock-head {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--accent-strong);
      font-size: .78rem;
      font-weight: 850;
      line-height: 1.2;
    }
    .pr-dock-status {
      color: var(--muted);
      font-size: .74rem;
      font-weight: 760;
    }
    .pr-dock-status.pending::before {
      content: "";
      display: inline-block;
      width: .72em;
      height: .72em;
      margin-right: 5px;
      border: 2px solid rgba(33, 104, 91, .25);
      border-top-color: var(--accent);
      border-radius: 999px;
      vertical-align: -.1em;
      animation: pr-spin .8s linear infinite;
    }
    @keyframes pr-spin { to { transform: rotate(360deg); } }
    .pr-dock-text, .pr-dock-result {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .pr-dock-result {
      color: var(--ink);
      -webkit-line-clamp: 3;
    }
    .pr-dock-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: start;
      justify-content: flex-end;
    }
    .pr-debug-line {
      color: var(--muted);
      font-size: .7rem;
      line-height: 1.35;
      word-break: break-word;
    }
    .pr-side {
      display: grid;
      gap: 10px;
      align-content: start;
      height: 100%;
      min-height: 0;
      overflow: auto;
    }
    .pr-side.collapsed {
      display: flex;
      align-items: start;
      justify-content: center;
      overflow: hidden;
    }
    .pr-side.collapsed .pr-panel { display: none; }
    .pr-side.collapsed .pr-side-rail { display: inline-flex; margin-top: 0; }
    .pr-side-rail { display: none; }
    .pr-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      overflow: hidden;
    }
    .pr-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      font-size: .86rem;
      font-weight: 850;
    }
    .pr-panel-body { display: grid; gap: 8px; padding: 10px; }
    .pr-tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
    .pr-tab {
      min-height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: var(--soft);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 780;
    }
    .pr-tab.active { background: var(--paper); color: var(--accent-strong); }
    .pr-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .pr-chip {
      min-width: 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      text-align: center;
    }
    .pr-chip strong {
      display: block;
      font-size: .88rem;
      line-height: 1.1;
    }
    .pr-chip span {
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.1;
    }
    .pr-list { display: grid; gap: 7px; max-height: 292px; overflow: auto; }
    .pr-item {
      display: grid;
      gap: 4px;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    .pr-item:hover { border-color: rgba(33, 104, 91, .45); background: #fbfdfc; }
    .pr-item-title { font-size: .8rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
    .pr-item-meta { color: var(--muted); font-size: .73rem; line-height: 1.25; overflow-wrap: anywhere; }
    .pr-annotation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      gap: 6px;
      align-items: stretch;
    }
    .pr-annotation-row .pr-item { min-width: 0; }
    .pr-danger-button {
      min-height: 30px;
      width: 30px;
      border: 1px solid rgba(159, 29, 29, .24);
      border-radius: 8px;
      background: #fff7f7;
      color: var(--danger);
      font-size: .86rem;
      font-weight: 850;
      line-height: 1;
    }
    .pr-danger-button:hover {
      border-color: rgba(159, 29, 29, .5);
      background: #ffecec;
    }
    .pr-empty {
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.4;
    }
    .pr-error {
      padding: 12px;
      border: 1px solid rgba(159, 29, 29, .32);
      border-radius: 8px;
      background: #fff3f3;
      color: var(--danger);
      font-size: .86rem;
      line-height: 1.4;
    }
    @media (max-width: 1080px) {
      .pr-toolbar { grid-template-columns: 1fr; }
      .pr-controls, .pr-actions { justify-content: flex-start; }
      .pr-workspace,
      .pr-workspace.panel-collapsed,
      .pr-workspace.reader-mode-compare,
      .pr-workspace.reader-mode-compare.panel-collapsed,
      .pr-workspace.reader-mode-translation,
      .pr-workspace.reader-mode-translation.panel-collapsed {
        grid-template-columns: 1fr;
        overflow: auto;
      }
      .pr-workspace.reader-mode-translation .pr-viewer { display: none; }
      .pr-viewer { min-height: 540px; }
      .pr-translation-reader { min-height: 420px; }
      .pr-side, .pr-side.collapsed { height: auto; min-height: 0; overflow: visible; }
      .pr-side.collapsed .pr-panel { display: none; }
      .pr-side.collapsed .pr-side-rail { display: inline-flex; }
      .pr-dock { grid-template-columns: 1fr; }
      .pr-dock-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/reader/assets/pdf.min.js"></script>
  <script>
    const READER_BOOT = {
      sourceId: {{ source_id_json|safe }},
      prefix: {{ reader_prefix_json|safe }},
      token: {{ reader_token_json|safe }},
    };
    const DEFAULT_UI = {
      annotations: "Annotations",
      translation: "Translation",
      ai: "AI",
      claims: "Claims",
      create_annotation: "Highlight",
      create_chunk: "Chunk",
      create_citation: "Cite",
      delete_annotation: "Delete annotation",
      translate_selection: "Translate",
      translate_full_paper: "Full translation",
      translate_visible_pages: "Visible pages",
      explain_selection: "Explain",
      ask_paper: "Ask",
      save_progress: "Save progress",
      review_card: "Review",
      deep_read: "Deep Read",
      fullscreen: "Fullscreen",
      exit_fullscreen: "Exit fullscreen",
      mode_pdf: "PDF",
      mode_compare: "Compare",
      mode_translation: "Translation only",
      search: "Search",
      page: "Page",
      pdf_loading: "Loading PDF...",
      pdf_missing: "No PDF page preview is available.",
      pdf_preview_mode: "Using page preview",
      pdf_error: "PDF.js could not render this paper.",
      selected_text: "Selected text",
      note: "Note",
      question: "Question",
      jump: "Jump",
      empty: "No items yet",
      fit_width: "Fit width",
      fit_page: "Fit page",
      actual_size: "1:1",
      panel: "Panel",
      translated: "Translated",
      translating: "Translating...",
      translating_visible_pages: "Translating visible pages...",
      translating_full_paper: "Translating paper...",
      reviewing_paper: "Reviewing paper...",
      deep_reading: "Running Codex deep read...",
      answering: "Answering...",
      answered: "Answered.",
      missing: "Missing",
      stale: "Stale",
      failed: "Failed",
      saved_pending: "Saved (pending sync)",
      saved: "Saved",
      ask_selection: "Ask about this",
      retry: "Retry",
      selection_single_page: "Multi-page selection is captured from the first page for now.",
    };
    let args = {};
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let scaleMode = "fit-width";
    let customScale = 1.25;
    let textCache = new Map();
    let pageBaseSizes = new Map();
    let pageRenderStates = new Map();
    let observer = null;
    let currentSelection = null;
    let activeTab = "translation";
    let focusedAnnotationId = "";
    let eventSeq = 0;
    let lastFrameHeight = 0;
    let visiblePages = [];
    let lastViewportSignature = "";
    let lastProgressPage = 0;
    let sidePanelCollapsed = true;
    let readerMode = "pdf";
    let fullscreenActive = false;
    let requestedPreviews = new Set();
    let requestedContextPages = new Set();
    let resizeTimer = null;
    let viewportTimer = null;
    let readerStateTimer = null;
    let lastReaderStateEmit = 0;
    let selectingText = false;
    let lastSelectionEndedAt = 0;
    let loadingWatchdogTimer = null;
    let dockState = { mode: "idle", status: "", selected_text: "", result: "", pending: false, selection_hash: "" };
    let actionState = { action: "", phase: "idle", message: "", task_id: "", event_id: "", progress: {} };
    let activeTaskSource = null;
    let activeTaskPollTimer = null;
    let optimisticAnnotations = [];
    let debugState = { lastNeedsLoadReason: "", lastSourceSignature: "", lastLoadMs: 0, fallbackHits: 0, events: [] };
    let cacheDbPromise = null;
    let loadSeq = 0;
    let pdfDocumentLoading = false;
    let payloadLoading = false;
    let pageTextLayerCache = new Map();
    let requestedTextLayers = new Set();
    const CACHE_DB = "nblane_pdf_reader_cache_v1";
    const CACHE_STORE = "pages";

    function apiPath(path) {
      const prefix = text(READER_BOOT.prefix || "/reader").replace(/\/$/, "");
      return withReaderToken(`${prefix}${path}`);
    }
    function readerToken() {
      return text(READER_BOOT.token || "");
    }
    function withReaderToken(url) {
      const token = readerToken();
      const raw = text(url);
      if (!token || !raw) return url;
      let parsed = null;
      try {
        parsed = new URL(raw, window.location.href);
      } catch {
        parsed = null;
      }
      const path = parsed ? parsed.pathname : raw.split("?")[0];
      if (!path.startsWith("/reader/api/")) return url;
      const joiner = raw.includes("?") ? "&" : "?";
      return `${raw}${joiner}reader_token=${encodeURIComponent(token)}`;
    }
    function authHeaders(headers = {}) {
      const token = readerToken();
      return token ? { ...headers, "X-Reader-Token": token } : headers;
    }
    function sourcePath() {
      return encodeURIComponent(text(READER_BOOT.sourceId || sourceId()));
    }
    function setHeight() {
      lastFrameHeight = Math.max(520, Number(args.height || 820) || 820);
    }
    async function emit(value) {
      return postReaderAction(value);
    }
    function asObj(value) {
      return value && typeof value === "object" && !Array.isArray(value) ? value : {};
    }
    function asArr(value) {
      return Array.isArray(value) ? value : [];
    }
    function text(value) {
      return value == null ? "" : String(value);

      if (!pdfDocumentLoading && !applyPagePreview(pageNumber, size) && !requestedPreviews.has(pageNumber)) {
        requestedPreviews.add(pageNumber);
        fetchPagePreview(pageNumber);
      }
      if (state) {
        state.status = pageDomReady(pageNumber, "preview") ? "preview" : "preview_requested";
        state.previewScale = size.scale;
        state.rendering = false;
        pageRenderStates.set(pageNumber, state);
      }
      const pageInput = document.getElementById("pageInput");
      if (pageInput) pageInput.value = String(currentPage);
      ensureBackendTextLayer(pageNumber, size);
      renderHighlights(pageNumber);
    }
    function applyAllKnownHighlights() {
      for (let pageNumber = 1; pageNumber <= (totalPages || knownPageCount(currentPage)); pageNumber += 1) {
        renderHighlights(pageNumber);
      }
    }
    function renderHighlights(pageNumber) {
      const layer = document.getElementById(`highlightLayer-${pageNumber}`);
      if (!layer) return;
      layer.innerHTML = "";
      asArr(args.annotations).forEach((row) => {
        const obj = asObj(row);
        if (obj.status === "deleted") return;
        if (Number(obj.page || 0) !== pageNumber) return;
        const rects = asArr(obj.rects);
        rects.forEach((rect) => {
          const r = asObj(rect);
          const pctReady = r.x_pct != null || r.y_pct != null || r.w_pct != null || r.h_pct != null;
          const x = pctReady ? Number(r.x_pct || 0) * layer.clientWidth : Number(r.x || 0);
          const y = pctReady ? Number(r.y_pct || 0) * layer.clientHeight : Number(r.y || 0);
          const w = pctReady ? Number(r.w_pct || 0) * layer.clientWidth : Number(r.w || 0);
          const h = pctReady ? Number(r.h_pct || 0) * layer.clientHeight : Number(r.h || 0);
          const div = document.createElement("div");
          div.className = `pr-highlight ${text(obj.id) === focusedAnnotationId ? "focus" : ""}`;
          div.style.left = `${x}px`;
          div.style.top = `${y}px`;
          div.style.width = `${Math.max(2, w)}px`;
          div.style.height = `${Math.max(2, h)}px`;
          layer.appendChild(div);
        });
      });
      optimisticAnnotations.forEach((obj) => {
        if (Number(obj.page || 0) !== pageNumber) return;
        asArr(obj.rects).forEach((rect) => {
          const r = asObj(rect);
          const pctReady = r.x_pct != null || r.y_pct != null || r.w_pct != null || r.h_pct != null;
          const x = pctReady ? Number(r.x_pct || 0) * layer.clientWidth : Number(r.x || 0);
          const y = pctReady ? Number(r.y_pct || 0) * layer.clientHeight : Number(r.y || 0);
          const w = pctReady ? Number(r.w_pct || 0) * layer.clientWidth : Number(r.w || 0);
          const h = pctReady ? Number(r.h_pct || 0) * layer.clientHeight : Number(r.h || 0);
          const div = document.createElement("div");
          div.className = "pr-highlight pending";
          div.style.left = `${x}px`;
          div.style.top = `${y}px`;
          div.style.width = `${Math.max(2, w)}px`;
          div.style.height = `${Math.max(2, h)}px`;
          layer.appendChild(div);
        });
      });
    }
    async function handleSelection() {
      selectingText = false;
      lastSelectionEndedAt = Date.now();
      const sel = window.getSelection();
      const selectedRaw = text(sel ? sel.toString() : "").trim();
      if (!selectedRaw || !sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const rectsRaw = Array.from(range.getClientRects()).filter((rect) => rect.width > 1 && rect.height > 1);
      const pageSet = new Set();
      for (const rect of rectsRaw) {
        const page = pageNumberForPoint(rect.left + 1, rect.top + 1);
        if (page) pageSet.add(page);
      }
      const pickedPage = pageSet.size ? Math.min(...Array.from(pageSet)) : currentPage;
      let selectedText = selectedRaw;
      if (pageSet.size > 1) {
        selectedText = selectedTextForPageRange(range, pickedPage) || selectedRaw;
        status(label("selection_single_page"));
      }
      const wrap = pageWrap(pickedPage);
      if (!wrap) return;
      const wrapBox = wrap.getBoundingClientRect();
      const wrapWidth = Math.max(1, wrapBox.width);
      const wrapHeight = Math.max(1, wrapBox.height);
      const rects = rectsRaw
        .filter((rect) => pageNumberForPoint(rect.left + 1, rect.top + 1) === pickedPage)
        .map((rect) => ({
          page: pickedPage,
          x: Math.max(0, rect.left - wrapBox.left),
          y: Math.max(0, rect.top - wrapBox.top),
          w: rect.width,
          h: rect.height,
          x_pct: Math.max(0, rect.left - wrapBox.left) / wrapWidth,
          y_pct: Math.max(0, rect.top - wrapBox.top) / wrapHeight,
          w_pct: rect.width / wrapWidth,
          h_pct: rect.height / wrapHeight,
          page_width: wrapWidth,
          page_height: wrapHeight,
          scale: scaleForPage(pickedPage),
        }));
      const segmentRefs = segmentRefsForSelection(selectedText, pickedPage);
      currentSelection = {
        source_id: sourceId(),
        page: pickedPage,
        selected_text: selectedText,
        selected_text_hash: await sha256(selectedText),
        rects,
        segment_refs: segmentRefs,
        locator: `p. ${pickedPage}`,
      };
      dockState = {
        mode: "selection",
        status: label("selected_text"),
        selected_text: selectedText,
        result: "",
        pending: false,
        selection_hash: text(currentSelection.selected_text_hash),
      };
      renderSelectionBar();
      if (emitPassiveEvents()) emitAction("selection_created", currentSelection);
    }
    function pageNumberForPoint(x, y) {
      const elements = document.elementsFromPoint(x, y);
      for (const el of elements) {
        const container = el.closest ? el.closest(".pr-page-container") : null;
        if (container) return Number(container.dataset.page || 0);
      }
      return 0;
    }
    function selectedTextForPageRange(range, pageNumber) {
      const layer = document.getElementById(`textLayer-${pageNumber}`);
      if (!layer) return "";
      const parts = [];
      layer.querySelectorAll("span").forEach((span) => {
        try {
          if (range.intersectsNode(span)) parts.push(text(span.textContent));
        } catch {}
      });
      return parts.join(" ").replace(/\s+/g, " ").trim();
    }
    function renderSelectionBar() {
      const hasSelection = currentSelection && currentSelection.selected_text;
      if (!hasSelection && dockState.mode === "selection") dockState = { mode: "idle", status: "", selected_text: "", result: "", pending: false, selection_hash: "" };
      refreshDock();
    }
    function segmentRefsForSelection(selectedText, pageNumber) {
      const clean = text(selectedText).trim();
      if (!clean) return [];
      const lowered = clean.toLowerCase();
      return asArr(args.segments)
        .filter((row) => {
          const obj = asObj(row);
          if (Number(obj.page || 0) && Number(obj.page || 0) !== pageNumber) return false;
          const body = text(obj.text).toLowerCase();
          return body.includes(lowered) || lowered.includes(body.slice(0, Math.min(80, body.length)));
        })
        .map((row) => text(asObj(row).segment_id))
        .filter(Boolean)
        .slice(0, 4);
    }
    function segmentRefsForPages(pages) {
      const picked = new Set(pages.map((page) => Number(page || 0)));
      return asArr(args.segments)
        .map((row) => asObj(row))
        .filter((row) => picked.has(Number(row.page || 0)))
        .map((row) => text(row.segment_id))
        .filter(Boolean);
    }
    async function runSearch() {
      const query = text(document.getElementById("searchInput")?.value).trim().toLowerCase();
      if (!query) return;
      for (let page = currentPage; page <= (totalPages || knownPageCount(currentPage)); page += 1) {
        const body = await pageText(page);
        if (body.toLowerCase().includes(query)) return scrollToPage(page);
      }
      for (let page = 1; page < currentPage; page += 1) {
        const body = await pageText(page);
        if (body.toLowerCase().includes(query)) return scrollToPage(page);
      }
      status("No match");
    }
    function shellEl() {
      return document.getElementById("readerShell") || document.querySelector(".pr-shell");
    }
    async function toggleFullscreen() {
      const shell = shellEl();
      if (!shell) return;
      try {
        if (!document.fullscreenElement && shell.requestFullscreen) {
          await shell.requestFullscreen();
          fullscreenActive = true;
        } else if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
          fullscreenActive = false;
        } else {
          fullscreenActive = !fullscreenActive;
        }
      } catch {
        fullscreenActive = !fullscreenActive;
      }
      shell.classList.toggle("fullscreen", fullscreenActive);
      const button = document.querySelector('[data-action="fullscreen"]');
      if (button) button.textContent = fullscreenActive ? label("exit_fullscreen") : label("fullscreen");
      window.setTimeout(() => renderAround(currentPage, { force: true }), 120);
      setHeight();
    }
    document.addEventListener("fullscreenchange", () => {
      fullscreenActive = Boolean(document.fullscreenElement);
      shellEl()?.classList.toggle("fullscreen", fullscreenActive);
      const button = document.querySelector('[data-action="fullscreen"]');
      if (button) button.textContent = fullscreenActive ? label("exit_fullscreen") : label("fullscreen");
      window.setTimeout(() => renderAround(currentPage, { force: true }), 120);
    });
    document.addEventListener("mouseup", () => {
      if (!selectingText) return;
      window.setTimeout(() => {
        selectingText = false;
        lastSelectionEndedAt = Date.now();
      }, 0);
    });
    async function pageText(pageNumber) {
      if (textCache.has(pageNumber)) return textCache.get(pageNumber);
      try {
        const cached = await readPageCache(pageCacheKey(pageNumber, scaleForPage(pageNumber), Math.max(1, window.devicePixelRatio || 1)));
        if (cached && text(cached.textBody)) {
          const body = text(cached.textBody);
          textCache.set(pageNumber, body);
          return body;
        }
      } catch {}
      if (pdfDoc) {
        const page = await pdfDoc.getPage(pageNumber);
        const content = await page.getTextContent();
        const body = content.items.map((item) => text(item.str)).join(" ");
        textCache.set(pageNumber, body);
        return body;
      }
      const pageRow = asArr(args.pages).map((row) => asObj(row)).find((row) => Number(row.page || 0) === pageNumber);
      const body = text(pageRow && pageRow.text);
      textCache.set(pageNumber, body);
      return body;
    }
    function scrollToPage(pageNumber) {
      const count = totalPages || knownPageCount(pageNumber);
      const next = Math.max(1, Math.min(count || 1, Number(pageNumber || 1)));
      currentPage = next;
      currentSelection = null;
      const previousScrollBehavior = document.querySelector(".pr-viewer")?.style.scrollBehavior || "";
      if (!pageElement(next)) {
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.style.scrollBehavior = "auto";
        renderDocumentSkeleton();
        setupIntersectionObserver();
        if (viewer) {
          const spacer = document.querySelector('[data-spacer="before"]');
          viewer.scrollTop = spacer ? Number.parseFloat(spacer.style.height || "0") : viewer.scrollTop;
          window.setTimeout(() => { viewer.style.scrollBehavior = previousScrollBehavior; }, 30);
        }
      }
      const page = pageElement(next);
      if (page) page.scrollIntoView({ block: "start", behavior: "smooth" });
      renderAround(next);
      renderSelectionBar();
      updatePageUi();
      scheduleViewportUpdate();
      requestReaderContext([next - 1, next, next + 1]);
    }
    async function rerenderForScale() {
      const page = currentPage;
      for (const state of pageRenderStates.values()) {
        if (state.renderTask) {
          try { state.renderTask.cancel(); } catch {}
        }
      }
      pageRenderStates = new Map();
      renderDocumentSkeleton();
      setupIntersectionObserver();
      scrollToPage(page);
      renderAround(page, { force: true });
    }
    function scheduleViewportUpdate() {
      if (viewportTimer) window.clearTimeout(viewportTimer);
      viewportTimer = window.setTimeout(updateViewportState, 180);
    }
    function updateViewportState() {
      const viewer = document.getElementById("viewer");
      if (!viewer) return;
      const viewerBox = viewer.getBoundingClientRect();
      const pages = [];
      let primary = currentPage;
      let primaryPixels = -1;
      document.querySelectorAll(".pr-page-container").forEach((container) => {
        const pageNumber = Number(container.dataset.page || 0);
        if (!pageNumber) return;
        const rect = container.getBoundingClientRect();
        const overlap = Math.max(0, Math.min(rect.bottom, viewerBox.bottom) - Math.max(rect.top, viewerBox.top));
        if (overlap > 1) {
          pages.push(pageNumber);
          if (overlap > primaryPixels) {
            primaryPixels = overlap;
            primary = pageNumber;
          }
        }
      });
      if (!pages.length) {
        primary = estimatedPageFromScroll(viewer);
        pages.push(primary);
      }
      visiblePages = pages;
      const pageChanged = primary !== currentPage;
      currentPage = primary;
      updatePageUi();
      if (pageChanged || activeTab === "translation" || activeTab === "ai") refreshSide();
      refreshTranslationReader();
      renderAround(primary);
      const signature = `${primary}:${pages.join(",")}`;
      const changedSignature = signature !== lastViewportSignature;
      if (changedSignature) {
        lastViewportSignature = signature;
        persistLocalState();
      }
      if (changedSignature && (emitPassiveEvents() || autoSaveProgress())) {
        emitAction("viewport_changed", { visible_pages: pages, primary_page: primary, page: primary, locator: `p. ${primary}` });
      }
      if (changedSignature) {
        requestReaderContext(pages);
        if (!selectionIsActive()) scheduleReaderStateChanged(false);
      }
      if (pageChanged && primary !== lastProgressPage && (emitPassiveEvents() || autoSaveProgress())) {
        lastProgressPage = primary;
        emitAction("page_changed", { page: primary, primary_page: primary, visible_pages: pages, locator: `p. ${primary}` });
      }
    }
    function updatePageUi() {
      const pageInput = document.getElementById("pageInput");
      if (pageInput) pageInput.value = String(currentPage);
      status(statusText());
    }
    async function loadPdf() {
      const seq = loadSeq + 1;
      const startedAt = performance.now();
      loadSeq = seq;
      const pdfBase64 = text(args.pdf_base64);
      const pdfUrl = text(args.pdf_url);
      const local = readLocalState();
      scaleMode = text(local.scale_mode || settings().scale_mode || "fit-width") || "fit-width";
      sidePanelCollapsed = typeof local.side_panel_collapsed === "boolean" ? local.side_panel_collapsed : text(settings().side_panel_default || "collapsed") !== "open";
      readerMode = text(local.reader_mode || settings().reader_mode || readerMode || "pdf") || "pdf";
      activeTab = text(local.active_tab || settings().active_tab || activeTab || "translation") || "translation";
      if (!["pdf", "compare", "translation"].includes(readerMode)) readerMode = "pdf";
      requestedPreviews = new Set();
      requestedTextLayers = new Set();
      pageTextLayerCache = new Map();
      currentSelection = null;
      dockState = { mode: "idle", status: "", selected_text: "", result: "", pending: false, selection_hash: "" };
      textCache = new Map();
      pageBaseSizes = new Map();
      pageRenderStates = new Map();
      currentPage = initialPage();
      pdfDoc = null;
      totalPages = knownPageCount(currentPage);
      pdfDocumentLoading = Boolean(pdfBase64 || pdfUrl);
      renderShell("");
      renderDocumentSkeleton();
      setupIntersectionObserver();
      await renderAfterLayout(currentPage, { force: true });
      if (!pdfBase64 && !pdfUrl) {
        return;
      }
      if (!window.pdfjsLib) {
        pdfDocumentLoading = false;
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))} PDF.js CDN failed to load.</div>`;
        return;
      }
      let loadingTask = null;
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = apiPath("/assets/pdf.worker.min.js");
        let source = { url: withReaderToken(pdfUrl) };
        if (pdfBase64) {
          const binary = atob(pdfBase64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          source = { data: bytes };
        }
        loadingTask = window.pdfjsLib.getDocument(source);
        const loadedDoc = await withTimeout(loadingTask.promise, pdfLoadTimeoutMs(), "PDF.js document load timed out; using page preview fallback.");
        if (seq !== loadSeq) return;
        pdfDocumentLoading = false;
        pdfDoc = loadedDoc;
        totalPages = pdfDoc.numPages || 1;
        currentPage = Math.max(1, Math.min(initialPage(), totalPages));
        const firstPage = await pdfDoc.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1 });
        pageBaseSizes.set(1, { width: viewport.width, height: viewport.height });
        renderShell("");
        renderDocumentSkeleton();
        setupIntersectionObserver();
        await renderAfterLayout(currentPage, { force: true });
        debugState.lastLoadMs = performance.now() - startedAt;
      } catch (error) {
        if (seq !== loadSeq) return;
        if (loadingTask && loadingTask.destroy) {
          try { loadingTask.destroy(); } catch {}
        }
        pdfDocumentLoading = false;
        pdfDoc = null;
        totalPages = knownPageCount(currentPage);
        status(label("pdf_preview_mode"));
        debugState.lastLoadMs = performance.now() - startedAt;
        renderDocumentSkeleton();
        setupIntersectionObserver();
        await renderAfterLayout(currentPage, { force: true });
        status(`${label("pdf_preview_mode")} · ${error && error.message ? error.message : error}`);
      }
    }
    function showExpiredSession() {
      const message = "阅读会话过期，刷新页面重新进入阅读器。";
      renderShell(message);
      const viewer = document.querySelector(".pr-viewer");
      if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(message)}</div>`;
      status(message);
    }
    async function fetchPagePreview(pageNumber) {
      try {
        const response = await fetch(apiPath(`/api/${sourcePath()}/page-preview/${pageNumber}`), {
          credentials: "same-origin",
        });
        if (response.status === 401) {
          showExpiredSession();
          return null;
        }
        if (!response.ok) return null;
        const preview = await response.json();
        const existing = asArr(args.page_previews).filter((row) => Number(asObj(row).page || 0) !== Number(pageNumber));
        args.page_previews = [...existing, preview];
        applyPagePreview(pageNumber, pageViewportSize(pageNumber));
        ensureBackendTextLayer(pageNumber, pageViewportSize(pageNumber));
        renderHighlights(pageNumber);
        return preview;
      } catch {
        return null;
      }
    }
    async function loadReaderPayload(options = {}) {
      if (payloadLoading) return;
      payloadLoading = true;
      try {
        const query = currentPage ? `?page=${encodeURIComponent(currentPage)}` : "";
        const response = await fetch(apiPath(`/api/${sourcePath()}/payload${query}`), {
          credentials: "same-origin",
        });
        if (response.status === 401) {
          showExpiredSession();
          return;
        }
        if (!response.ok) {
          const message = await response.text();
          throw new Error(message || response.statusText || "Reader payload failed");
        }
        const payload = await response.json();
        await onRender({ data: { args: payload } });
        if (options.preserveView) {
          updatePageUi();
          refreshSide();
          refreshTranslationReader();
        }
      } finally {
        payloadLoading = false;
      }
    }
    async function sendProgressBeacon() {
      persistLocalState();
      const payload = {
        action: "save_progress",
        page: currentPage,
        primary_page: currentPage,
        visible_pages: visiblePages.slice(),
        locator: currentPage ? `p. ${currentPage}` : "",
        source_id: sourceId(),
      };
      try {
        const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
        navigator.sendBeacon(apiPath(`/api/${sourcePath()}/progress`), blob);
      } catch {}
    }
    async function onRender(event) {
      try {
        args = asObj(event.data.args);
        focusedAnnotationId = text(settings().focus_annotation_id || focusedAnnotationId);
        const sourceSignature = pdfSourceSignature();
        debugState.lastSourceSignature = sourceSignature;
        const expectedPages = Math.max(1, totalPages || knownPageCount(currentPage));
        const realPageNodes = skeletonPageCount();
        const virtualized = realPageNodes > 0 && realPageNodes <= (overscanPages() * 2 + 1);
        const skeletonMismatch = realPageNodes > 0 && !virtualized && realPageNodes !== expectedPages;
        const hasShell = Boolean(document.getElementById("continuousDocument"));
        const needsLoad = !hasShell || sourceSignature !== text(onRender.lastSignature) || skeletonMismatch;
        debugState.lastNeedsLoadReason = !needsLoad ? "none"
          : !hasShell ? "missing_shell"
          : sourceSignature !== text(onRender.lastSignature) ? "source_changed"
          : "skeleton_mismatch";
        if (needsLoad) {
          onRender.lastSignature = sourceSignature;
          await loadPdf();
        } else {
          refreshForArgsUpdate();
        }
      } catch (error) {
        renderShell(label("pdf_error"));
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))}<br>${esc(error && error.message ? error.message : error)}</div>`;
      }
    }
    window.addEventListener("resize", () => {
      if (resizeTimer) window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => rerenderForScale(), 180);
    });
    window.addEventListener("beforeunload", sendProgressBeacon);
    renderShell("Loading PDF...");
    loadReaderPayload().catch((error) => {
      renderShell(label("pdf_error"));
      const viewer = document.querySelector(".pr-viewer");
      if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(error && error.message ? error.message : error)}</div>`;
    });
  </script>
</body>
</html>
