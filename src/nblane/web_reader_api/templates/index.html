<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      /* Interface chrome follows the SPA theme (web_ui/frontend/src/theme.ts
         `chrome`): indigo ground, moon-white type, clay-gold accents. Green is
         reserved for success/health semantics. Reading surfaces (PDF pages,
         translation cards) re-scope these tokens to paper below. */
      color-scheme: dark;
      --ground: #0f1930;
      --ground-soft: #101d30;
      --gutter: #0c1526;
      --card: #16263d;
      --card-hover: #1d3450;
      --ground-line: rgba(220, 174, 85, .22);
      --ink: #f2ede0;
      --muted: #b0a78c;
      --line: #3a4d6e;
      --paper: #16263d;
      --soft: #101d30;
      --soft-strong: #1d3450;
      --accent: #dcae55;
      --accent-strong: #eac57e;
      --accent-soft: rgba(220, 174, 85, .14);
      --gold: #dcae55;
      --warn: #eac57e;
      --warn-soft: rgba(220, 174, 85, .12);
      --danger: #e08a7e;
      --danger-soft: rgba(176, 84, 74, .18);
      --mark: rgba(255, 214, 102, .42);
      --select: rgba(220, 174, 85, .20);
      /* Locator overlays: thin clay-gold frame, near-transparent fill, so the
         PDF glyphs underneath stay fully legible. */
      --locator-fill: rgba(220, 174, 85, .05);
      --locator-fill-focus: rgba(220, 174, 85, .09);
      --locator-line: rgba(166, 122, 44, .82);
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
    }
    /* Paper reading surfaces: PDF pages and translation cards. */
    .pr-page-wrap,
    .pr-translation-page,
    .pr-translation-block,
    .pr-translation-unit {
      --ink: #1b2524;
      --muted: #6b665a;
      --line: #ddd6c4;
      --paper: #fbfaf5;
      --soft: #f3f0e6;
      --accent-strong: #8a6420;
      --accent-soft: rgba(220, 174, 85, .16);
      --warn: #93651a;
      --warn-soft: #fbf3df;
      --danger: #a62b2b;
      --danger-soft: #fff3f3;
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font-ui);
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .pr-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      height: 100%;
      min-height: 0;
      padding: 8px;
      background: var(--ground);
    }
    .pr-shell.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      padding: 8px;
      background: var(--ground);
    }
    .pr-shell:fullscreen {
      padding: 8px;
      background: var(--ground);
    }
    .pr-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(160px, 1fr) auto auto auto;
      grid-template-areas: "title controls mode actions";
      gap: 10px;
      align-items: center;
      padding: 6px 10px;
      border: 1px solid var(--ground-line);
      border-radius: 7px;
      background: var(--ground-soft);
      color: var(--ink);
      box-shadow: 0 8px 22px rgba(3, 10, 19, .2);
    }
    .pr-title-block {
      grid-area: title;
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .pr-title-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
      overflow: hidden;
    }
    .pr-title-meta .pr-prep-status {
      min-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      font-size: .7rem;
      font-weight: 700;
    }
    .pr-title-meta .pr-status { font-size: .7rem; overflow: hidden; text-overflow: ellipsis; }
    .pr-title {
      align-self: center;
      min-width: 0;
      overflow: hidden;
      color: var(--ink);
      font-size: .98rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pr-controls, .pr-actions, .pr-search, .pr-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .pr-controls { grid-area: controls; flex-wrap: nowrap; gap: 4px; justify-content: flex-start; }
    .pr-mode { grid-area: mode; flex-wrap: nowrap; justify-content: flex-end; }
    .pr-actions { grid-area: actions; flex-wrap: nowrap; justify-content: flex-end; }
    .pr-toolbar-sep { width: 1px; height: 18px; margin: 0 4px; background: rgba(242, 237, 224, .14); }
    .pr-zoom-select { width: auto; min-width: 118px; padding: 3px 6px; }
    .pr-toolbar .pr-select {
      border-color: rgba(242, 237, 224, .2);
      background: rgba(255, 255, 255, .06);
      color: var(--ink);
    }
    .pr-toolbar .pr-select option { background: var(--card); color: var(--ink); }
    .pr-segmented {
      display: inline-flex;
      padding: 2px;
      border: 1px solid rgba(242, 237, 224, .16);
      border-radius: 7px;
      background: rgba(3, 10, 19, .25);
    }
    .pr-toolbar .pr-segmented .pr-button {
      min-height: 25px;
      border-color: transparent;
      background: transparent;
    }
    .pr-toolbar .pr-segmented .pr-button.active {
      border-color: transparent;
      background: var(--accent);
      color: #0f1930;
    }
    .pr-shell:not([data-reader-mode="compare"]) .pr-compare-only { display: none; }
    .pr-menu { position: relative; }
    .pr-menu > summary { list-style: none; }
    .pr-menu > summary::-webkit-details-marker { display: none; }
    .pr-menu-trigger { gap: 4px; user-select: none; }
    .pr-menu[open] > .pr-menu-trigger { border-color: rgba(220, 174, 85, .75); background: rgba(220, 174, 85, .14); }
    .pr-menu-trigger.busy::after {
      content: "";
      width: .7em;
      height: .7em;
      margin-left: 4px;
      border: 2px solid rgba(220, 174, 85, .3);
      border-top-color: var(--accent);
      border-radius: 999px;
      animation: pr-spin .8s linear infinite;
    }
    .pr-menu-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 90;
      display: grid;
      gap: 2px;
      width: 260px;
      padding: 5px;
      border: 1px solid var(--ground-line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 16px 36px rgba(3, 10, 19, .55);
    }
    .pr-menu-list.align-right { left: auto; right: 0; }
    .pr-menu-item {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .pr-menu-item strong { font-size: .8rem; font-weight: 780; }
    .pr-menu-item span { color: var(--muted); font-size: .7rem; line-height: 1.35; }
    .pr-menu-item:hover, .pr-menu-item:focus-visible { background: rgba(220, 174, 85, .12); outline: 0; }
    .pr-menu-item.busy strong::after { content: " …"; color: var(--accent); }
    .pr-search-meta { margin: -2px 0 8px; color: var(--muted); font-size: .7rem; }
    .pr-search-group-title { margin: 6px 0 2px; color: var(--accent-strong); font-size: .7rem; font-weight: 800; }
    .pr-search-results .pr-item.active { border-color: rgba(220, 174, 85, .6); }
    .pr-search-mark { padding: 0 1px; border-radius: 2px; background: rgba(220, 174, 85, .35); color: inherit; }
    .pr-search-hit {
      position: absolute;
      border-radius: 2px;
      background: rgba(255, 200, 60, .32);
      mix-blend-mode: multiply;
      pointer-events: none;
    }
    .pr-search-hit.current {
      background: rgba(255, 140, 0, .42);
      outline: 2px solid rgba(201, 120, 20, .9);
      outline-offset: 1px;
    }
    .pr-link-layer { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
    .pr-link {
      position: absolute;
      display: block;
      border-radius: 2px;
      pointer-events: auto;
      cursor: pointer;
    }
    .pr-link:hover, .pr-link:focus-visible {
      background: rgba(220, 174, 85, .16);
      outline: 1px solid rgba(166, 122, 44, .6);
    }
    .pr-link-target {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 5;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(220, 174, 85, .8);
      animation: pr-link-target-fade 1.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes pr-link-target-fade { from { opacity: 1; } to { opacity: 0; } }
    .pr-link-card {
      position: fixed;
      z-index: 120;
      display: grid;
      gap: 8px;
      width: min(440px, calc(100vw - 24px));
      max-height: min(420px, calc(100vh - 24px));
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--ground-line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 18px 40px rgba(3, 10, 19, .6);
    }
    .pr-link-card[hidden] { display: none; }
    .pr-link-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: .72rem; font-weight: 760; }
    .pr-link-card img { display: block; width: 100%; border-radius: 5px; background: #fff; }
    .pr-link-card-ref { display: grid; gap: 3px; padding: 6px 2px 2px; border-top: 1px solid rgba(220, 174, 85, .14); font-size: .76rem; }
    .pr-link-card-ref strong { line-height: 1.35; }
    .pr-link-card-ref span { color: var(--muted); font-size: .7rem; }
    .pr-link-card-ref a { color: var(--accent-strong); font-size: .72rem; }
    .pr-back-pill {
      position: fixed;
      z-index: 70;
      padding: 6px 12px;
      border: 1px solid rgba(220, 174, 85, .55);
      border-radius: 999px;
      background: var(--card);
      color: var(--accent-strong);
      font-size: .76rem;
      font-weight: 780;
      box-shadow: 0 8px 22px rgba(3, 10, 19, .5);
    }
    .pr-back-pill[hidden] { display: none; }
    .pr-fallback-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 6;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 3px 4px 3px 8px;
      border: 1px solid rgba(220, 174, 85, .45);
      border-radius: 999px;
      background: rgba(16, 29, 48, .88);
      color: #eac57e;
      font-size: .68rem;
      font-weight: 760;
    }
    .pr-fallback-badge button {
      padding: 1px 8px;
      border: 1px solid rgba(220, 174, 85, .45);
      border-radius: 999px;
      background: transparent;
      color: #f2ede0;
      font-size: .66rem;
    }
    .pr-review-actions { display: grid; gap: 6px; }
    .pr-review-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .pr-review-action > div { display: grid; gap: 2px; min-width: 0; }
    .pr-review-action strong { font-size: .8rem; }
    .pr-review-action span { color: var(--muted); font-size: .7rem; }
    .pr-shortcuts { position: fixed; right: 18px; bottom: 18px; z-index: 130; }
    .pr-shortcuts:empty { display: none; }
    .pr-shortcuts-card {
      width: min(380px, calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid var(--ground-line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      box-shadow: 0 18px 40px rgba(3, 10, 19, .6);
    }
    .pr-shortcuts-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .pr-shortcuts-card dl { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; font-size: .74rem; }
    .pr-shortcuts-card dt { color: var(--accent-strong); font-family: ui-monospace, SFMono-Regular, monospace; white-space: nowrap; }
    .pr-shortcuts-card dd { margin: 0; color: var(--muted); }
    .pr-action-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .pr-search { flex-wrap: nowrap; justify-content: stretch; }
    .pr-mode { justify-content: flex-end; }
    .pr-button, .pr-icon-button, .pr-input, .pr-select, .pr-textarea {
      min-height: 29px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
      outline: 0;
    }
    .pr-button, .pr-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: .76rem;
      font-weight: 780;
      line-height: 1;
      white-space: nowrap;
    }
    .pr-icon-button { width: 30px; padding: 0; font-size: .88rem; }
    .pr-toolbar .pr-button,
    .pr-toolbar .pr-icon-button {
      border-color: rgba(242, 237, 224, .2);
      background: rgba(255, 255, 255, .06);
      color: #f4f0e6;
    }
    .pr-toolbar .pr-button:hover,
    .pr-toolbar .pr-icon-button:hover {
      border-color: rgba(199, 164, 94, .75);
      background: rgba(199, 164, 94, .14);
      color: var(--ink);
    }
    .pr-toolbar .pr-button.active {
      border-color: rgba(199, 164, 94, .72);
      background: rgba(199, 164, 94, .18);
      color: var(--accent-strong);
    }
    .pr-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #0f1930;
    }
    .pr-toolbar .pr-status { color: rgba(242, 237, 224, .72); }
    .pr-toolbar .pr-prep-status {
      border-color: rgba(242, 237, 224, .2);
      background: rgba(255, 255, 255, .06);
      color: rgba(242, 237, 224, .72);
    }
    .pr-toolbar .pr-prep-status.ready {
      border-color: rgba(242, 237, 224, .14);
      background: transparent;
      color: var(--muted);
    }
    .pr-toolbar .pr-prep-status.pending {
      border-color: rgba(199, 164, 94, .42);
      background: rgba(199, 164, 94, .12);
      color: #f3d99d;
    }
    .pr-toolbar .pr-action-status {
      border-color: rgba(242, 237, 224, .2);
      background: rgba(255, 255, 255, .06);
      color: rgba(242, 237, 224, .78);
    }
    .pr-button:hover, .pr-icon-button:hover {
      border-color: rgba(201, 150, 53, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.primary:hover {
      background: var(--accent-strong);
      color: #0f1930;
    }
    .pr-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.busy {
      border-color: rgba(201, 150, 53, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-action-status {
      display: none;
      max-width: 360px;
      min-height: 30px;
      align-items: center;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 720;
      line-height: 1.25;
    }
    .pr-action-status.visible { display: inline-flex; }
    .pr-action-status.pending {
      border-color: rgba(201, 150, 53, .35);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-action-status.error {
      border-color: rgba(224, 138, 126, .28);
      background: var(--danger-soft);
      color: var(--danger);
    }
    .pr-translation-progress-shell {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      min-width: 180px;
      transition: opacity .55s ease;
      opacity: 1;
    }
    .pr-translation-progress-shell.visible { display: inline-flex; }
    .pr-translation-progress-shell.fading { opacity: 0; }
    .pr-translation-progress-shell .pr-progress-label {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .02em;
    }
    .pr-translation-progress {
      appearance: none;
      -webkit-appearance: none;
      width: 140px;
      height: 5px;
      border: none;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(201, 150, 53, .12);
    }
    .pr-translation-progress::-webkit-progress-bar {
      background: rgba(201, 150, 53, .12);
      border-radius: 999px;
    }
    .pr-translation-progress::-webkit-progress-value {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border-radius: 999px;
      transition: width .25s ease;
    }
    .pr-translation-progress::-moz-progress-bar {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border-radius: 999px;
    }
    .pr-translation-progress-shell.indeterminate .pr-translation-progress {
      animation: pr-progress-indeterminate 1.4s linear infinite;
      background-size: 200% 100%;
      background-image: linear-gradient(90deg, rgba(201, 150, 53, .12) 0%, rgba(201, 150, 53, .12) 35%, rgba(201, 150, 53, .55) 50%, rgba(201, 150, 53, .12) 65%, rgba(201, 150, 53, .12) 100%);
    }
    @keyframes pr-progress-indeterminate {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }
    .pr-input, .pr-select, .pr-textarea {
      width: 100%;
      padding: 5px 8px;
      font-size: .8rem;
    }
    .pr-input:focus, .pr-select:focus, .pr-textarea:focus {
      border-color: rgba(201, 150, 53, .65);
      box-shadow: 0 0 0 3px rgba(201, 150, 53, .11);
    }
    .pr-page-input { width: 58px; text-align: center; }
    .pr-status {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      white-space: nowrap;
    }
    .pr-prep-status {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: .74rem;
      font-weight: 760;
      line-height: 1.2;
      white-space: nowrap;
    }
    .pr-prep-status.ready {
      border-color: rgba(201, 150, 53, .25);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-prep-status.pending {
      border-color: rgba(138, 91, 18, .25);
      background: var(--warn-soft);
      color: var(--warn);
    }
    .pr-prep-status.failed {
      border-color: rgba(224, 138, 126, .28);
      background: var(--danger-soft);
      color: var(--danger);
    }
    .pr-workspace {
      display: grid;
      --pr-compare-left: 50%;
      --pr-panel-width: 340px;
      --pr-panel-min-width: 220px;
      --pr-reader-min-width: 300px;
      --pr-rail-width: 250px;
      --pr-resize-rail-width: 8px;
      grid-template-columns: var(--pr-rail-width) minmax(var(--pr-reader-min-width), 1fr) var(--pr-resize-rail-width) minmax(var(--pr-panel-min-width), var(--pr-panel-width));
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .pr-workspace.left-rail-collapsed { --pr-rail-width: 44px; --pr-reader-min-width: 360px; }
    .pr-workspace.panel-collapsed { grid-template-columns: var(--pr-rail-width) minmax(var(--pr-reader-min-width), 1fr) 44px; }
    .pr-workspace.reader-mode-compare {
      grid-template-columns: var(--pr-rail-width) minmax(260px, var(--pr-compare-left)) var(--pr-resize-rail-width) minmax(260px, 1fr) var(--pr-resize-rail-width) minmax(var(--pr-panel-min-width), var(--pr-panel-width));
    }
    .pr-workspace.reader-mode-compare.panel-collapsed {
      grid-template-columns: var(--pr-rail-width) minmax(260px, var(--pr-compare-left)) var(--pr-resize-rail-width) minmax(260px, 1fr) 44px;
    }
    .pr-workspace.reader-mode-translation {
      grid-template-columns: var(--pr-rail-width) minmax(var(--pr-reader-min-width), 1fr) var(--pr-resize-rail-width) minmax(var(--pr-panel-min-width), var(--pr-panel-width));
    }
    .pr-workspace.reader-mode-translation.panel-collapsed {
      grid-template-columns: var(--pr-rail-width) minmax(var(--pr-reader-min-width), 1fr) 44px;
    }
    .pr-workspace.reader-mode-translation .pr-viewer { display: none; }
    .pr-workspace.reader-mode-pdf .pr-translation-reader,
    .pr-workspace.reader-mode-pdf .pr-compare-divider,
    .pr-workspace.reader-mode-translation .pr-compare-divider { display: none; }
    .pr-compare-divider,
    .pr-panel-resize {
      align-self: stretch;
      min-height: 0;
      cursor: col-resize;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent 2px, rgba(201, 150, 53, .28) 2px, rgba(201, 150, 53, .28) 6px, transparent 6px);
      touch-action: none;
    }
    .pr-compare-divider:hover,
    .pr-compare-divider.resizing,
    .pr-panel-resize:hover,
    .pr-panel-resize.resizing {
      background: linear-gradient(90deg, transparent 1px, rgba(201, 150, 53, .46) 1px, rgba(201, 150, 53, .46) 7px, transparent 7px);
    }
    .pr-workspace.panel-collapsed .pr-panel-resize { display: none; }
    .pr-left-rail {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;

      }
      pdfDoc = null;
      pageLinkCache.clear();
      destPreviewCache.clear();
      navHistory = [];
      refreshBackPill();
      totalPages = knownPageCount(currentPage);
      pdfDocumentLoading = Boolean(pdfBase64 || pdfUrl);
      renderShell("");
      renderDocumentSkeleton();
      setupIntersectionObserver();
      await renderAfterLayout(currentPage, { force: true });
      if (!pdfBase64 && !pdfUrl) {
        if (readerMode === "translation" && !hasFullTranslationContext()) {
          schedulePayloadRefresh(20, { fullTranslation: true });
        }
        return;
      }
      if (!window.pdfjsLib) {
        pdfDocumentLoading = false;
        status(`${label("pdf_preview_mode")} · ${label("pdf_error")}`);
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) {
          const errorBox = document.createElement("div");
          errorBox.className = "pr-error";
          errorBox.innerHTML = `${esc(label("pdf_error"))} ${esc(label("pdfjs_missing"))} <button type="button" class="pr-page-error-btn">${esc(label("pdf_retry"))}</button>`;
          errorBox.querySelector("button")?.addEventListener("click", () => loadPdf().catch(() => {}));
          viewer.replaceChildren(errorBox);
        }
        return;
      }
      let loadingTask = null;
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = apiPath("/assets/pdf.worker.min.js");
        let source = { url: withReaderToken(pdfUrl) };
        if (pdfBase64) {
          const binary = atob(pdfBase64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          source = { data: bytes };
        }
        if (!pdfBase64) {
          // Default 64KB range chunks turn a 25MB paper into hundreds of
          // round trips; 1MB chunks keep range loading but cut the count.
          source.rangeChunkSize = 1024 * 1024;
        }
        pdfLoadError = "";
        loadingTask = window.pdfjsLib.getDocument(source);
        const loadedDoc = await withStallTimeout(
          loadingTask,
          pdfLoadTimeoutMs(),
          "PDF.js document load stalled; using page preview fallback.",
          (loaded, total) => {
            if (seq !== loadSeq || !total) return;
            const percent = Math.min(99, Math.round((loaded / total) * 100));
            status(`${label("pdf_loading_progress")} ${percent}%`);
          },
        );
        if (seq !== loadSeq) return;
        pdfDocumentLoading = false;
        pdfDoc = loadedDoc;
        totalPages = pdfDoc.numPages || 1;
        onRender.lastSignature = pdfSourceSignature();
        currentPage = Math.max(1, Math.min(initialPage(), totalPages));
        const preserveViewState = (stickyUserAnchor || userAnchorLocked()) && document.getElementById("continuousDocument")
          ? {
            page: currentPage,
            anchor: activeTranslationAnchor,
            viewerTop: Number(document.getElementById("viewer")?.scrollTop || 0),
            translationTop: Number(translationScrollElement()?.scrollTop || 0),
          }
          : null;
        const firstPage = await pdfDoc.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1 });
        pageBaseSizes.set(1, { width: viewport.width, height: viewport.height });
        renderShell("");
        renderDocumentSkeleton();
        setupIntersectionObserver();
        await renderAfterLayout(currentPage, { force: true });
        if (readerMode === "translation" && !hasFullTranslationContext()) {
          schedulePayloadRefresh(20, { fullTranslation: true });
        }
        if (preserveViewState) {
          currentPage = preserveViewState.page || currentPage;
          updatePageUi();
          if (preserveViewState.anchor) setActiveAnchor(preserveViewState.anchor, { jumpToPage: false, scrollTranslation: false, refresh: false });
          const unit = preserveViewState.anchor ? buildAnchorIndex().get(preserveViewState.anchor) : null;
          if (unit) {
            await scrollToUnit(unit, { page: preserveViewState.page, targetPage: preserveViewState.page, smooth: false, timeoutMs: 1200 });
          } else {
            const viewer = document.getElementById("viewer");
            if (viewer) viewer.scrollTop = preserveViewState.viewerTop;
          }
          const scroller = translationScrollElement();
          if (scroller) scroller.scrollTop = preserveViewState.translationTop;
          renderAround(currentPage, { force: true });
        }
        debugState.lastLoadMs = performance.now() - startedAt;
      } catch (error) {
        if (seq !== loadSeq) return;
        if (loadingTask && loadingTask.destroy) {
          try { loadingTask.destroy(); } catch {}
        }
        pdfDocumentLoading = false;
        pdfDoc = null;
        pdfLoadError = error && error.message ? error.message : text(error);
        try { console.error("PDF.js document load failed", error); } catch {}
        totalPages = knownPageCount(currentPage);
        status(`${label("pdf_preview_mode")} · ${label("pdf_error")}`);
        debugState.lastLoadMs = performance.now() - startedAt;
        renderDocumentSkeleton();
        setupIntersectionObserver();
        await renderAfterLayout(currentPage, { force: true });
        if (readerMode === "translation" && !hasFullTranslationContext()) {
          schedulePayloadRefresh(20, { fullTranslation: true });
        }
        status(`${label("pdf_preview_mode")} · ${error && error.message ? error.message : error}`);
      }
    }
    function showExpiredSession() {
      const message = "阅读会话过期，刷新页面重新进入阅读器。";
      renderShell(message);
      const viewer = document.querySelector(".pr-viewer");
      if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(message)}</div>`;
      status(message);
    }
    async function fetchPagePreview(pageNumber) {
      try {
        const previewWidth = Math.round(pageViewportSize(pageNumber).width * Math.max(1, window.devicePixelRatio || 1) * 1.5);
        const response = await fetch(apiPath(`/api/${sourcePath()}/page-preview/${pageNumber}?max_width=${Math.max(800, Math.min(2200, previewWidth))}`), {
          credentials: "same-origin",
        });
        if (response.status === 401) {
          showExpiredSession();
          return null;
        }
        if (!response.ok) {
          requestedPreviews.delete(Number(pageNumber || 0));
          return null;
        }
        const preview = await response.json();
        if (!text(asObj(preview).data_url)) {
          requestedPreviews.delete(Number(pageNumber || 0));
          return null;
        }
        const existing = asArr(args.page_previews).filter((row) => Number(asObj(row).page || 0) !== Number(pageNumber));
        args.page_previews = [...existing, preview];
        applyPagePreview(pageNumber, pageViewportSize(pageNumber));
        ensureBackendTextLayer(pageNumber, pageViewportSize(pageNumber));
        renderHighlights(pageNumber);
        if (activeLeftTab === "pages") refreshLeftRail();
        if (readerMode !== "pdf") refreshTranslationReader();
        return preview;
      } catch {
        requestedPreviews.delete(Number(pageNumber || 0));
        return null;
      }
    }
    function schedulePayloadRefresh(wait = 240, options = {}) {
      if (payloadRefreshTimer) window.clearTimeout(payloadRefreshTimer);
      payloadRefreshTimer = window.setTimeout(() => {
        payloadRefreshTimer = null;
        if (payloadLoading) {
          schedulePayloadRefresh(wait, options);
          return;
        }
        loadReaderPayload({ preserveView: true, ...asObj(options) }).catch((error) => {
          status(error && error.message ? error.message : text(error));
        });
      }, wait);
    }
    async function loadReaderPayload(options = {}) {
      if (payloadLoading) {
        // Mutations can finish while the initial/context payload is still in flight.
        // Keep the newest refresh request so the write is visible without a reload.
        payloadRefreshQueued = { ...(payloadRefreshQueued || {}), ...asObj(options) };
        return;
      }
      payloadLoading = true;
      const requestedPages = Array.from(requestedContextPages)
        .map((page) => Number(page || 0))
        .filter((page) => page > 0)
        .slice(0, 20);
      try {
        const params = new URLSearchParams();
        if (currentPage) params.set("page", String(currentPage));
        if (READER_BOOT.uiLang) params.set("ui_lang", READER_BOOT.uiLang);
        if (requestedPages.length) params.set("pages", requestedPages.join(","));
        if (wantsFullTranslationContext(options)) params.set("full_translation", "1");
        // The first PDF view should become usable with the current page only.
        // Full-document payloads include every segment, translation and
        // analysis row and can make the reader look frozen before PDF.js has
        // rendered anything. Translation mode and explicit full-paper actions
        // still request the complete context through full_translation.
        if (options.initial === true || !wantsFullDocumentPayload()) params.set("full_document", "0");
        const query = params.toString() ? `?${params.toString()}` : "";
        const headers = authHeaders({});
        if (payloadEtag && options.preserveView !== false && options.force !== true) {
          headers["If-None-Match"] = payloadEtag;
        }
        const response = await fetch(apiPath(`/api/${sourcePath()}/payload${query}`), {
          credentials: "same-origin",
          headers,
        });
        if (response.status === 401) {
          showExpiredSession();
          return;
        }
        if (response.status === 304) {
          // payload unchanged — keep current args, do nothing.
          requestedPages.forEach((page) => requestedContextPages.delete(page));
          return;
        }
        if (!response.ok) {
          const message = await response.text();
          throw new Error(message || response.statusText || "Reader payload failed");
        }
        const newEtag = response.headers.get("ETag") || "";
        if (newEtag) payloadEtag = newEtag;
        const payload = await response.json();
        await onRender({ data: { args: payload }, preserveView: options.preserveView === true });
        requestedPages.forEach((page) => requestedContextPages.delete(page));
        if (options.preserveView) {
          updatePageUi();
        }
        scheduleBulkTranslationsFetch(40, { force: Boolean(options.fullTranslation) });
      } finally {
        payloadLoading = false;
        if (payloadRefreshQueued) {
          const queued = payloadRefreshQueued;
          payloadRefreshQueued = null;
          schedulePayloadRefresh(0, queued);
        }
      }
    }
    async function sendProgressBeacon() {
      persistLocalState();
      const payload = readerStatePayload({
        action: "save_progress",
        page: currentPage,
        primary_page: currentPage,
        visible_pages: visiblePages.slice(),
        locator: currentPage ? `p. ${currentPage}` : "",
        source_id: sourceId(),
      });
      try {
        const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
        navigator.sendBeacon(apiPath(`/api/${sourcePath()}/progress`), blob);
      } catch {}
    }
    function maybeStartQueryAction() {
      if (queryActionStarted) return;
      const requested = readerQueryParam("action");
      if (!["analyze_paper", "codex_deep_read"].includes(requested)) return;
      queryActionStarted = true;
      window.setTimeout(() => {
        handleAction(requested === "codex_deep_read" ? "deepRead" : "analyzePaper");
      }, 360);
    }
    async function onRender(event) {
      try {
        const eventObj = asObj(event);
        const dataObj = asObj(eventObj.data);
        const preserveView = eventObj.preserveView === true || dataObj.preserveView === true;
        args = asObj(dataObj.args);
        focusedAnnotationId = text(settings().focus_annotation_id || focusedAnnotationId);
        const sourceSignature = pdfSourceSignature();
        debugState.lastSourceSignature = sourceSignature;
        const expectedPages = Math.max(1, totalPages || knownPageCount(currentPage));
        const realPageNodes = skeletonPageCount();
        const virtualized = realPageNodes > 0 && (
          document.querySelector("[data-spacer]") || realPageNodes <= Math.min(expectedPages, skeletonExtraPages() * 2 + 1)
        );
        const skeletonMismatch = realPageNodes > 0 && !virtualized && realPageNodes !== expectedPages;
        const hasShell = Boolean(document.getElementById("continuousDocument"));
        const needsLoad = !hasShell || sourceSignature !== text(onRender.lastSignature) || skeletonMismatch;
        debugState.lastNeedsLoadReason = !needsLoad ? "none"
          : !hasShell ? "missing_shell"
          : sourceSignature !== text(onRender.lastSignature) ? "source_changed"
          : "skeleton_mismatch";
        if (needsLoad) {
          onRender.lastSignature = sourceSignature;
          await loadPdf();
        } else {
          if (!preserveView && readerMode !== "pdf") deepLinkPageApplied = false;
          refreshForArgsUpdate({ preserveTranslationScroll: preserveView });
        }
        refreshActionStatus();
        maybeStartPreparationTask();
        notifyParentReaderReady();
        maybeStartQueryAction();
      } catch (error) {
        try { console.error("onRender failed", error); } catch {}
        const message = error && error.message ? error.message : text(error);
        try { renderShell(label("pdf_error")); } catch (shellError) {
          try { console.error("renderShell fallback failed", shellError); } catch {}
          const root = document.getElementById("root");
          if (root) {
            root.innerHTML = `<div style="padding:24px;color:var(--danger);line-height:1.5">
              <strong>${esc(label("pdf_error") || "Reader error")}</strong>
              <div style="margin-top:8px;font-size:.85rem;color:var(--muted)">${esc(message || "render failed")}</div>
              <button style="margin-top:16px;padding:6px 12px" onclick="window.location.reload()">Reload</button>
            </div>`;
          }
          return;
        }
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))}<br>${esc(message)}</div>`;
      }
    }
    document.addEventListener("click", (event) => {
      const button = event.target && event.target.closest ? event.target.closest("[data-ref-toggle]") : null;
      if (!button) return;
      const target = document.getElementById(button.dataset.refToggle || "");
      if (!target) return;
      const expanded = target.classList.toggle("expanded");
      button.textContent = expanded ? (button.dataset.lessLabel || label("refs_show_less")) : (button.dataset.moreLabel || label("refs_show_all"));
    });
    window.addEventListener("resize", () => {
      if (resizeTimer) window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        updateWorkspaceSizing();
        rerenderForScale();
        placeSelectionDock();
        if (readerMode !== "pdf") {
          try {
            if (!(translationLayoutMode() === "overlay" && updateTranslationPageScales())) {
              refreshTranslationReader({ preserveScroll: true });
            }
          } catch {}
        }
      }, 180);
    });
    window.addEventListener("beforeunload", sendProgressBeacon);
    window.addEventListener("pagehide", sendProgressBeacon);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") sendProgressBeacon();
      else window.setTimeout(retryFallbackPages, 300);
    });
    window.addEventListener("error", (event) => {
      try { console.error("reader window.error", event && event.error); } catch {}
    });
    // Seed the first payload request from the deep link so translation and
    // compare modes do not briefly load page 1 and then lose the requested page.
    currentPage = initialPage();
    renderShell("Loading PDF...");
    loadReaderPayload({ initial: true }).then(() => {
      // Translation context can arrive in a second payload after the PDF shell.
      // Reapply the URL location while those asynchronous updates settle.
      [250, 900, 2200, 5000, 9000].forEach((delay) => window.setTimeout(retryDeepLinkTranslationPage, delay));
    }).catch((error) => {
      try { console.error("initial loadReaderPayload failed", error); } catch {}
      const message = error && error.message ? error.message : text(error);
      try { renderShell(label("pdf_error")); } catch {
        const root = document.getElementById("root");
        if (root) {
          root.innerHTML = `<div style="padding:24px;color:var(--danger);line-height:1.5">
            <strong>${esc(label("pdf_error") || "Reader error")}</strong>
            <div style="margin-top:8px;font-size:.85rem;color:var(--muted)">${esc(message || "load failed")}</div>
            <button style="margin-top:16px;padding:6px 12px" onclick="window.location.reload()">Reload</button>
          </div>`;
        }
        return;
      }
      const viewer = document.querySelector(".pr-viewer");
      if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(message)}</div>`;
    });
  </script>
</body>
</html>
