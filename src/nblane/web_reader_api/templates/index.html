<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #60716e;
      --line: #d8e0dc;
      --paper: #ffffff;
      --soft: #f6f8f7;
      --soft-strong: #edf3f0;
      --accent: #21685b;
      --accent-strong: #174d43;
      --accent-soft: #e3f2ee;
      --warn: #8a5b12;
      --danger: #9f1d1d;
      --mark: rgba(255, 214, 102, .42);
      --select: rgba(33, 104, 91, .18);
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .pr-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      height: 100%;
      min-height: 0;
      padding: 2px 0 6px;
    }
    .pr-shell.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      padding: 8px;
      background: var(--paper);
    }
    .pr-shell:fullscreen {
      padding: 8px;
      background: var(--paper);
    }
    .pr-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto auto auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 2px 10px rgba(23, 33, 31, .05);
    }
    .pr-title {
      min-width: 0;
      overflow: hidden;
      font-size: .95rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pr-controls, .pr-actions, .pr-search, .pr-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .pr-search { flex-wrap: nowrap; justify-content: stretch; }
    .pr-mode { justify-content: flex-start; }
    .pr-button, .pr-icon-button, .pr-input, .pr-select, .pr-textarea {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      outline: 0;
    }
    .pr-button, .pr-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: .76rem;
      font-weight: 780;
      line-height: 1;
      white-space: nowrap;
    }
    .pr-icon-button { width: 30px; padding: 0; font-size: .88rem; }
    .pr-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .pr-button:hover, .pr-icon-button:hover {
      border-color: rgba(33, 104, 91, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.primary:hover {
      background: var(--accent-strong);
      color: #fff;
    }
    .pr-button.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.busy {
      border-color: rgba(33, 104, 91, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-action-status {
      display: none;
      max-width: 360px;
      min-height: 30px;
      align-items: center;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 720;
      line-height: 1.25;
    }
    .pr-action-status.visible { display: inline-flex; }
    .pr-action-status.pending {
      border-color: rgba(33, 104, 91, .35);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-action-status.error {
      border-color: rgba(159, 29, 29, .28);
      background: #fff3f3;
      color: var(--danger);
    }
    .pr-input, .pr-select, .pr-textarea {
      width: 100%;
      padding: 5px 8px;
      font-size: .8rem;
    }
    .pr-input:focus, .pr-select:focus, .pr-textarea:focus {
      border-color: rgba(33, 104, 91, .65);
      box-shadow: 0 0 0 3px rgba(33, 104, 91, .11);
    }
    .pr-page-input { width: 58px; text-align: center; }
    .pr-status {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      white-space: nowrap;
    }
    .pr-prep-status {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      font-size: .74rem;
      font-weight: 760;
      line-height: 1.2;
      white-space: nowrap;
    }
    .pr-prep-status.ready {
      border-color: rgba(33, 104, 91, .25);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-prep-status.pending {
      border-color: rgba(138, 91, 18, .25);
      background: #fff8e8;
      color: var(--warn);
    }
    .pr-prep-status.failed {
      border-color: rgba(159, 29, 29, .28);
      background: #fff3f3;
      color: var(--danger);
    }
    .pr-workspace {
      display: grid;
      --pr-compare-left: 50%;
      --pr-panel-width: 340px;
      --pr-rail-width: 250px;
      grid-template-columns: var(--pr-rail-width) minmax(420px, 1fr) minmax(280px, var(--pr-panel-width));
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .pr-workspace.left-rail-collapsed { --pr-rail-width: 44px; }
    .pr-workspace.panel-collapsed { grid-template-columns: var(--pr-rail-width) minmax(420px, 1fr) 44px; }
    .pr-workspace.reader-mode-compare {
      grid-template-columns: var(--pr-rail-width) minmax(320px, var(--pr-compare-left)) 8px minmax(320px, 1fr) minmax(280px, var(--pr-panel-width));
    }
    .pr-workspace.reader-mode-compare.panel-collapsed {
      grid-template-columns: var(--pr-rail-width) minmax(320px, var(--pr-compare-left)) 8px minmax(320px, 1fr) 44px;
    }
    .pr-workspace.reader-mode-translation {
      grid-template-columns: var(--pr-rail-width) minmax(420px, 1fr) minmax(280px, var(--pr-panel-width));
    }
    .pr-workspace.reader-mode-translation.panel-collapsed {
      grid-template-columns: var(--pr-rail-width) minmax(420px, 1fr) 44px;
    }
    .pr-workspace.reader-mode-translation .pr-viewer { display: none; }
    .pr-workspace.reader-mode-pdf .pr-translation-reader,
    .pr-workspace.reader-mode-pdf .pr-compare-divider,
    .pr-workspace.reader-mode-translation .pr-compare-divider { display: none; }
    .pr-compare-divider {
      cursor: col-resize;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent 2px, rgba(33, 104, 91, .28) 2px, rgba(33, 104, 91, .28) 6px, transparent 6px);
    }
    .pr-left-rail {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }
    .pr-left-rail.collapsed {
      grid-template-rows: auto;
      align-content: start;
    }
    .pr-left-rail.collapsed .pr-rail-body { display: none; }
    .pr-rail-tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr)) 34px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }
    .pr-left-rail.collapsed .pr-rail-tabs {
      grid-template-columns: 1fr;
      border-bottom: 0;
    }
    .pr-left-rail.collapsed .pr-rail-tab:not(.active) { display: none; }
    .pr-rail-tab {
      min-height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 820;
    }
    .pr-rail-tab.active {
      background: var(--paper);
      color: var(--accent-strong);
    }
    .pr-rail-toggle {
      min-height: 34px;
      width: 34px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-weight: 850;
    }
    .pr-rail-body {
      min-height: 0;
      overflow: auto;
      padding: 8px;
    }
    .pr-outline-list, .pr-page-strip, .pr-search-results {
      display: grid;
      gap: 7px;
      align-content: start;
    }
    .pr-outline-item {
      display: grid;
      gap: 3px;
      width: 100%;
      padding: 7px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    .pr-outline-item:hover, .pr-outline-item.active {
      border-color: rgba(33, 104, 91, .32);
      background: var(--accent-soft);
    }
    .pr-outline-title {
      font-size: .78rem;
      font-weight: 820;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .pr-outline-meta {
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.2;
    }
    .pr-page-thumb {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    .pr-page-thumb.active {
      border-color: rgba(33, 104, 91, .52);
      background: var(--accent-soft);
    }
    .pr-page-thumb img {
      width: 46px;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--soft);
    }
    .pr-search-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-bottom: 8px;
    }
    .pr-viewer {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: auto;
      padding: 14px 14px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      scroll-behavior: smooth;
    }
    .pr-continuous-document {
      display: grid;
      gap: 18px;
      justify-items: center;
      min-height: 100%;
    }
    .pr-page-container {
      position: relative;
      display: grid;
      gap: 6px;
      justify-items: center;
      width: 100%;
      min-height: 320px;
      scroll-margin-top: 14px;
    }
    .pr-page-spacer {
      width: 1px;
      min-height: 1px;
      pointer-events: none;
    }
    .pr-page-label {
      justify-self: center;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 780;
    }
    .pr-page-wrap {
      position: relative;
      width: max-content;
      background: var(--paper);
      box-shadow: 0 4px 20px rgba(23, 33, 31, .10);
    }
    .pr-page-wrap.loading {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .82rem;
    }
    .pr-canvas {
      position: relative;
      z-index: 0;
      display: block;
    }
    .pr-canvas.pending-fallback { opacity: 0; }
    .pr-page-preview {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    .pr-page-preview.visible { display: block; }
    .pr-text-layer, .pr-highlight-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .pr-text-layer {
      z-index: 2;
      color: transparent;
      user-select: text;
      -webkit-user-select: text;
      line-height: 1;
      pointer-events: auto;
    }
    .pr-text-layer span {
      position: absolute;
      white-space: pre;
      transform-origin: 0 0;
      cursor: text;
    }
    .pr-highlight-layer { pointer-events: none; }
    .pr-highlight-layer { z-index: 3; }
    .pr-text-layer ::selection {
      background: rgba(33, 104, 91, .22);
      color: transparent;
    }
    .pr-highlight {
      position: absolute;
      border-radius: 3px;
      background: var(--mark);
      outline: 1px solid rgba(138, 91, 18, .18);
      pointer-events: auto;
      cursor: pointer;
    }
    .pr-highlight.has-note { outline: 2px solid rgba(33, 104, 91, .62); }
    .pr-highlight.segment-anchor {
      background: rgba(33, 104, 91, .16);
      outline-color: rgba(33, 104, 91, .52);
      pointer-events: none;
    }
    .pr-highlight.focus {
      background: rgba(33, 104, 91, .28);
      outline: 2px solid rgba(33, 104, 91, .74);
      box-shadow: 0 0 0 3px rgba(33, 104, 91, .14);
    }
    .pr-highlight.pending {
      background: rgba(33, 104, 91, .16);
      outline: 1px dashed rgba(33, 104, 91, .55);
    }
    .pr-page-error {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 4;
      padding: 9px;
      border: 1px solid rgba(159, 29, 29, .32);
      border-radius: 8px;
      background: #fff3f3;
      color: var(--danger);
      font-size: .8rem;
      line-height: 1.35;
    }
    .pr-translation-reader {
      display: none;
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }
    .pr-workspace.reader-mode-compare .pr-translation-reader,
    .pr-workspace.reader-mode-translation .pr-translation-reader {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .pr-translation-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      font-size: .86rem;
      font-weight: 850;
    }
    .pr-translation-body {
      display: grid;
      gap: 10px;
      align-content: start;
      padding: 10px;
      overflow-x: hidden;
    }
    .pr-translation-pages {
      display: grid;
      gap: 18px;
      justify-items: center;
      min-height: 100%;
      min-width: 0;
      overflow-x: hidden;
    }
    .pr-translation-page-shell {
      display: grid;
      gap: 10px;
      justify-items: center;
      max-width: 100%;
    }
    .pr-translation-page {
      position: relative;
      width: var(--pr-page-width, 760px);
      height: var(--pr-page-height, 980px);
      overflow: hidden;
      border: 1px solid rgba(23, 33, 31, .12);
      background: #fff;
      box-shadow: 0 4px 20px rgba(23, 33, 31, .10);
      contain: layout paint;
    }
    .pr-translation-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .pr-translation-preview-layer { z-index: 0; }
    .pr-translation-overlay-layer { z-index: 1; pointer-events: none; }
    .pr-translation-page-preview {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: .98;
      pointer-events: none;
      user-select: none;
    }
    .pr-translation-page-label {
      position: absolute;
      right: 12px;
      top: 10px;
      z-index: 2;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 780;
    }
    .pr-translation-block {
      position: relative;
      z-index: 1;
      margin: 18px 0;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .94);
      color: var(--ink);
      font-size: .94rem;
      line-height: 1.68;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .pr-translation-page.overlay .pr-translation-block.placed {
      position: absolute;
      margin: 0;
      padding: 2px 3px;
      overflow: hidden;
      font-size: clamp(.72rem, var(--pr-translation-font, .9rem), 1rem);
      line-height: 1.35;
      height: var(--pr-translation-height, auto);
      max-height: var(--pr-translation-height, none);
      cursor: pointer;
      pointer-events: auto;
    }
    .pr-translation-page.overlay .pr-translation-block.layout.placeholder {
      padding: 0;
      border: 1px dashed rgba(33, 104, 91, .18);
      background: transparent;
      color: transparent;
    }
    .pr-translation-page.overlay .pr-translation-block.layout.placeholder:hover,
    .pr-translation-page.overlay .pr-translation-block.layout.placeholder.active {
      border-color: rgba(33, 104, 91, .42);
      background: rgba(227, 242, 238, .16);
    }
    .pr-translation-page.overlay .pr-translation-block.placed.overflowing::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 45%;
      height: 1.7em;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.98) 64%);
      pointer-events: none;
    }
    .pr-translation-fallback {
      display: grid;
      gap: 8px;
      width: min(var(--pr-page-width, 760px), 100%);
    }
    .pr-translation-block.missing {
      color: var(--muted);
      background: rgba(247, 249, 246, .94);
    }
    .pr-translation-block.active {
      outline: 2px solid rgba(33, 104, 91, .32);
      background: rgba(235, 247, 242, .96);
    }
    .pr-translation-flow {
      display: grid;
      gap: 14px;
      align-content: start;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .pr-translation-section {
      display: grid;
      gap: 8px;
      padding: 2px 0 10px;
      border-bottom: 1px solid rgba(216, 224, 220, .72);
    }
    .pr-translation-section:last-child { border-bottom: 0; }
    .pr-translation-section-title {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 7px 2px;
      background: rgba(255, 255, 255, .96);
      color: var(--accent-strong);
      font-size: .82rem;
      font-weight: 850;
      line-height: 1.25;
    }
    .pr-translation-unit {
      display: grid;
      gap: 7px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      scroll-margin-top: 62px;
    }
    .pr-translation-unit:hover {
      border-color: rgba(33, 104, 91, .45);
      background: #fbfdfc;
    }
    .pr-translation-unit.active {
      border-color: rgba(33, 104, 91, .62);
      background: rgba(235, 247, 242, .72);
      box-shadow: 0 0 0 2px rgba(33, 104, 91, .10);
    }
    .pr-translation-unit-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }
    .pr-translation-unit-status {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      padding: 3px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: .68rem;
      font-weight: 820;
      text-transform: uppercase;
    }
    .pr-translation-unit-status.translated {
      border-color: rgba(33, 104, 91, .22);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-translation-unit-status.stale,
    .pr-translation-unit-status.missing {
      border-color: rgba(138, 91, 18, .26);
      background: #fff8e8;
      color: var(--warn);
    }
    .pr-translation-unit-status.failed {
      border-color: rgba(159, 29, 29, .28);
      background: #fff3f3;
      color: var(--danger);
    }
    .pr-translation-locator {
      color: var(--muted);
      font-size: .74rem;
      font-weight: 780;
      line-height: 1.25;
    }
    .pr-translation-unit-text {
      color: var(--ink);
      font-size: .94rem;
      line-height: 1.72;
      overflow-wrap: break-word;
      white-space: pre-line;
    }
    .pr-translation-source-snippet {
      color: var(--muted);
      font-size: .75rem;
      line-height: 1.42;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pr-translation-unit-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pr-translation-row {
      display: grid;
      gap: 5px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .pr-translation-source {
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .pr-translation-text {
      color: var(--ink);
      font-size: .86rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .pr-score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .pr-score {
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      text-align: center;
    }
    .pr-score strong { display: block; font-size: .95rem; }
    .pr-score span { color: var(--muted); font-size: .68rem; }
    .pr-dock {
      position: fixed;

        ? truthySetting(settings().translation_source_visible, true)
        : typeof local.translation_source_visible === "boolean" ? local.translation_source_visible : true;
      activeTranslationAnchor = activeTranslationAnchorFromState(local);
      debugOverlayActive = debugOverlayEnabled() && Boolean(local.debug_overlay_active || text(settings().translation_layout) === "overlay");
      readerMode = text(settings().reader_mode || local.reader_mode || readerMode || "pdf") || "pdf";
      activeTab = text(settings().active_tab || local.active_tab || activeTab || "notes") || "notes";
      if (!["notes", "translation", "review", "claims"].includes(activeTab)) activeTab = "notes";
      notesFilterCurrentPage = typeof local.notes_filter_current_page === "boolean" ? local.notes_filter_current_page : true;
      syncDockUiFromLocal(local);
      compareSplitRatio = Math.max(25, Math.min(75, Number(settings().compare_split_ratio || local.compare_split_ratio || args.compare_split_ratio || 50)));
      panelWidth = Math.max(280, Math.min(560, Number(settings().panel_width || local.panel_width || args.panel_width || 340)));
      if (!["pdf", "compare", "translation"].includes(readerMode)) readerMode = "pdf";
      requestedPreviews = new Set();
      requestedTextLayers = new Set();
      pageTextLayerCache = new Map();
      currentSelection = null;
      dockState = { mode: "idle", status: "", selected_text: "", result: "", pending: false, selection_hash: "" };
      textCache = new Map();
      pageBaseSizes = new Map();
      pageRenderStates = new Map();
      currentPage = initialPage();
      pdfDoc = null;
      totalPages = knownPageCount(currentPage);
      pdfDocumentLoading = Boolean(pdfBase64 || pdfUrl);
      renderShell("");
      renderDocumentSkeleton();
      setupIntersectionObserver();
      await renderAfterLayout(currentPage, { force: true });
      if (!pdfBase64 && !pdfUrl) {
        return;
      }
      if (!window.pdfjsLib) {
        pdfDocumentLoading = false;
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))} PDF.js CDN failed to load.</div>`;
        return;
      }
      let loadingTask = null;
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = apiPath("/assets/pdf.worker.min.js");
        let source = { url: withReaderToken(pdfUrl) };
        if (pdfBase64) {
          const binary = atob(pdfBase64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          source = { data: bytes };
        }
        loadingTask = window.pdfjsLib.getDocument(source);
        const loadedDoc = await withTimeout(loadingTask.promise, pdfLoadTimeoutMs(), "PDF.js document load timed out; using page preview fallback.");
        if (seq !== loadSeq) return;
        pdfDocumentLoading = false;
        pdfDoc = loadedDoc;
        totalPages = pdfDoc.numPages || 1;
        onRender.lastSignature = pdfSourceSignature();
        currentPage = Math.max(1, Math.min(initialPage(), totalPages));
        const preserveViewState = (stickyUserAnchor || userAnchorLocked()) && document.getElementById("continuousDocument")
          ? {
            page: currentPage,
            anchor: activeTranslationAnchor,
            viewerTop: Number(document.getElementById("viewer")?.scrollTop || 0),
            translationTop: Number(translationScrollElement()?.scrollTop || 0),
          }
          : null;
        const firstPage = await pdfDoc.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1 });
        pageBaseSizes.set(1, { width: viewport.width, height: viewport.height });
        renderShell("");
        renderDocumentSkeleton();
        setupIntersectionObserver();
        await renderAfterLayout(currentPage, { force: true });
        if (preserveViewState) {
          currentPage = preserveViewState.page || currentPage;
          updatePageUi();
          if (preserveViewState.anchor) setActiveAnchor(preserveViewState.anchor, { jumpToPage: false, scrollTranslation: false, refresh: false });
          const unit = preserveViewState.anchor ? buildAnchorIndex().get(preserveViewState.anchor) : null;
          if (unit) {
            await scrollToUnit(unit, { page: preserveViewState.page, targetPage: preserveViewState.page, smooth: false, timeoutMs: 1200 });
          } else {
            const viewer = document.getElementById("viewer");
            if (viewer) viewer.scrollTop = preserveViewState.viewerTop;
          }
          const scroller = translationScrollElement();
          if (scroller) scroller.scrollTop = preserveViewState.translationTop;
          renderAround(currentPage, { force: true });
        }
        debugState.lastLoadMs = performance.now() - startedAt;
      } catch (error) {
        if (seq !== loadSeq) return;
        if (loadingTask && loadingTask.destroy) {
          try { loadingTask.destroy(); } catch {}
        }
        pdfDocumentLoading = false;
        pdfDoc = null;
        totalPages = knownPageCount(currentPage);
        status(label("pdf_preview_mode"));
        debugState.lastLoadMs = performance.now() - startedAt;
        renderDocumentSkeleton();
        setupIntersectionObserver();
        await renderAfterLayout(currentPage, { force: true });
        status(`${label("pdf_preview_mode")} · ${error && error.message ? error.message : error}`);
      }
    }
    function showExpiredSession() {
      const message = "阅读会话过期，刷新页面重新进入阅读器。";
      renderShell(message);
      const viewer = document.querySelector(".pr-viewer");
      if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(message)}</div>`;
      status(message);
    }
    async function fetchPagePreview(pageNumber) {
      try {
        const response = await fetch(apiPath(`/api/${sourcePath()}/page-preview/${pageNumber}`), {
          credentials: "same-origin",
        });
        if (response.status === 401) {
          showExpiredSession();
          return null;
        }
        if (!response.ok) {
          requestedPreviews.delete(Number(pageNumber || 0));
          return null;
        }
        const preview = await response.json();
        if (!text(asObj(preview).data_url)) {
          requestedPreviews.delete(Number(pageNumber || 0));
          return null;
        }
        const existing = asArr(args.page_previews).filter((row) => Number(asObj(row).page || 0) !== Number(pageNumber));
        args.page_previews = [...existing, preview];
        applyPagePreview(pageNumber, pageViewportSize(pageNumber));
        ensureBackendTextLayer(pageNumber, pageViewportSize(pageNumber));
        renderHighlights(pageNumber);
        if (activeLeftTab === "pages") refreshLeftRail();
        if (readerMode !== "pdf") refreshTranslationReader();
        return preview;
      } catch {
        requestedPreviews.delete(Number(pageNumber || 0));
        return null;
      }
    }
    function schedulePayloadRefresh(wait = 240) {
      if (payloadRefreshTimer) window.clearTimeout(payloadRefreshTimer);
      payloadRefreshTimer = window.setTimeout(() => {
        payloadRefreshTimer = null;
        if (payloadLoading) {
          schedulePayloadRefresh(wait);
          return;
        }
        loadReaderPayload({ preserveView: true }).catch((error) => {
          status(error && error.message ? error.message : text(error));
        });
      }, wait);
    }
    async function loadReaderPayload(options = {}) {
      if (payloadLoading) return;
      payloadLoading = true;
      const requestedPages = Array.from(requestedContextPages)
        .map((page) => Number(page || 0))
        .filter((page) => page > 0)
        .slice(0, 20);
      try {
        const params = new URLSearchParams();
        if (currentPage) params.set("page", String(currentPage));
        if (requestedPages.length) params.set("pages", requestedPages.join(","));
        const query = params.toString() ? `?${params.toString()}` : "";
        const response = await fetch(apiPath(`/api/${sourcePath()}/payload${query}`), {
          credentials: "same-origin",
        });
        if (response.status === 401) {
          showExpiredSession();
          return;
        }
        if (!response.ok) {
          const message = await response.text();
          throw new Error(message || response.statusText || "Reader payload failed");
        }
        const payload = await response.json();
        await onRender({ data: { args: payload }, preserveView: options.preserveView === true });
        requestedPages.forEach((page) => requestedContextPages.delete(page));
        if (options.preserveView) {
          updatePageUi();
        }
      } finally {
        payloadLoading = false;
      }
    }
    async function sendProgressBeacon() {
      persistLocalState();
      const payload = readerStatePayload({
        action: "save_progress",
        page: currentPage,
        primary_page: currentPage,
        visible_pages: visiblePages.slice(),
        locator: currentPage ? `p. ${currentPage}` : "",
        source_id: sourceId(),
      });
      try {
        const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
        navigator.sendBeacon(apiPath(`/api/${sourcePath()}/progress`), blob);
      } catch {}
    }
    async function onRender(event) {
      try {
        const eventObj = asObj(event);
        const dataObj = asObj(eventObj.data);
        const preserveView = eventObj.preserveView === true || dataObj.preserveView === true;
        args = asObj(dataObj.args);
        focusedAnnotationId = text(settings().focus_annotation_id || focusedAnnotationId);
        const sourceSignature = pdfSourceSignature();
        debugState.lastSourceSignature = sourceSignature;
        const expectedPages = Math.max(1, totalPages || knownPageCount(currentPage));
        const realPageNodes = skeletonPageCount();
        const virtualized = realPageNodes > 0 && realPageNodes <= (overscanPages() * 2 + 1);
        const skeletonMismatch = realPageNodes > 0 && !virtualized && realPageNodes !== expectedPages;
        const hasShell = Boolean(document.getElementById("continuousDocument"));
        const needsLoad = !hasShell || sourceSignature !== text(onRender.lastSignature) || skeletonMismatch;
        debugState.lastNeedsLoadReason = !needsLoad ? "none"
          : !hasShell ? "missing_shell"
          : sourceSignature !== text(onRender.lastSignature) ? "source_changed"
          : "skeleton_mismatch";
        if (needsLoad) {
          onRender.lastSignature = sourceSignature;
          await loadPdf();
        } else {
          refreshForArgsUpdate({ preserveTranslationScroll: preserveView });
        }
        refreshActionStatus();
        maybeStartPreparationTask();
      } catch (error) {
        renderShell(label("pdf_error"));
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))}<br>${esc(error && error.message ? error.message : error)}</div>`;
      }
    }
    window.addEventListener("resize", () => {
      if (resizeTimer) window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        rerenderForScale();
        placeSelectionDock();
      }, 180);
    });
    window.addEventListener("beforeunload", sendProgressBeacon);
    renderShell("Loading PDF...");
    loadReaderPayload().catch((error) => {
      renderShell(label("pdf_error"));
      const viewer = document.querySelector(".pr-viewer");
      if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(error && error.message ? error.message : error)}</div>`;
    });
  </script>
</body>
