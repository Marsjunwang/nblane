<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #60716e;
      --line: #d8e0dc;
      --paper: #ffffff;
      --soft: #f6f8f7;
      --soft-strong: #edf3f0;
      --accent: #21685b;
      --accent-strong: #174d43;
      --accent-soft: #e3f2ee;
      --warn: #8a5b12;
      --danger: #9f1d1d;
      --mark: rgba(255, 214, 102, .42);
      --select: rgba(33, 104, 91, .18);
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: transparent;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, textarea, select { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .pr-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 6px;
      height: 100%;
      min-height: 0;
      padding: 2px 0 6px;
    }
    .pr-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto minmax(160px, 240px) auto;
      gap: 6px;
      align-items: center;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 2px 10px rgba(23, 33, 31, .05);
    }
    .pr-title {
      min-width: 0;
      overflow: hidden;
      font-size: .95rem;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pr-controls, .pr-actions, .pr-search {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .pr-search { flex-wrap: nowrap; justify-content: stretch; }
    .pr-button, .pr-icon-button, .pr-input, .pr-select, .pr-textarea {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      outline: 0;
    }
    .pr-button, .pr-icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: .76rem;
      font-weight: 780;
      line-height: 1;
      white-space: nowrap;
    }
    .pr-icon-button { width: 30px; padding: 0; font-size: .88rem; }
    .pr-button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .pr-button:hover, .pr-icon-button:hover {
      border-color: rgba(33, 104, 91, .55);
      background: var(--accent-soft);
      color: var(--accent-strong);
    }
    .pr-button.primary:hover {
      background: var(--accent-strong);
      color: #fff;
    }
    .pr-input, .pr-select, .pr-textarea {
      width: 100%;
      padding: 5px 8px;
      font-size: .8rem;
    }
    .pr-input:focus, .pr-select:focus, .pr-textarea:focus {
      border-color: rgba(33, 104, 91, .65);
      box-shadow: 0 0 0 3px rgba(33, 104, 91, .11);
    }
    .pr-page-input { width: 58px; text-align: center; }
    .pr-status {
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      white-space: nowrap;
    }
    .pr-workspace {
      display: grid;
      grid-template-columns: minmax(420px, 1fr) minmax(260px, 340px);
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }
    .pr-workspace.panel-collapsed { grid-template-columns: minmax(420px, 1fr) 44px; }
    .pr-viewer {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: auto;
      padding: 14px 14px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      scroll-behavior: smooth;
    }
    .pr-continuous-document {
      display: grid;
      gap: 18px;
      justify-items: center;
      min-height: 100%;
    }
    .pr-page-container {
      position: relative;
      display: grid;
      gap: 6px;
      justify-items: center;
      width: 100%;
      min-height: 320px;
      scroll-margin-top: 14px;
    }
    .pr-page-label {
      justify-self: center;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 780;
    }
    .pr-page-wrap {
      position: relative;
      width: max-content;
      background: var(--paper);
      box-shadow: 0 4px 20px rgba(23, 33, 31, .10);
    }
    .pr-page-wrap.loading {
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .82rem;
    }
    .pr-canvas { display: block; }
    .pr-canvas.pending-fallback { opacity: 0; }
    .pr-page-preview {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    .pr-page-preview.visible { display: block; }
    .pr-text-layer, .pr-highlight-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .pr-text-layer {
      color: transparent;
      user-select: text;
      -webkit-user-select: text;
      line-height: 1;
      pointer-events: auto;
    }
    .pr-text-layer span {
      position: absolute;
      white-space: pre;
      transform-origin: 0 0;
      cursor: text;
    }
    .pr-highlight-layer { pointer-events: none; }
    .pr-highlight {
      position: absolute;
      border-radius: 3px;
      background: var(--mark);
      outline: 1px solid rgba(138, 91, 18, .18);
    }
    .pr-highlight.focus {
      background: rgba(33, 104, 91, .20);
      outline-color: rgba(33, 104, 91, .55);
    }
    .pr-page-error {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 4;
      padding: 9px;
      border: 1px solid rgba(159, 29, 29, .32);
      border-radius: 8px;
      background: #fff3f3;
      color: var(--danger);
      font-size: .8rem;
      line-height: 1.35;
    }
    .pr-dock {
      position: sticky;
      bottom: 10px;
      z-index: 24;
      display: grid;
      gap: 6px;
      grid-template-columns: minmax(0, 1fr) auto;
      margin: 12px auto 0;
      width: min(100%, 900px);
      padding: 8px;
      border: 1px solid rgba(33, 104, 91, .26);
      border-radius: 8px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 8px 24px rgba(23, 33, 31, .10);
    }
    .pr-dock.idle { display: none; }
    .pr-dock-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .pr-dock-head {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--accent-strong);
      font-size: .78rem;
      font-weight: 850;
      line-height: 1.2;
    }
    .pr-dock-status {
      color: var(--muted);
      font-size: .74rem;
      font-weight: 760;
    }
    .pr-dock-text, .pr-dock-result {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .pr-dock-result {
      color: var(--ink);
      -webkit-line-clamp: 3;
    }
    .pr-dock-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: start;
      justify-content: flex-end;
    }
    .pr-side {
      display: grid;
      gap: 10px;
      align-content: start;
      height: 100%;
      min-height: 0;
      overflow: auto;
    }
    .pr-side.collapsed {
      display: flex;
      align-items: start;
      justify-content: center;
      overflow: hidden;
    }
    .pr-side.collapsed .pr-panel { display: none; }
    .pr-side.collapsed .pr-side-rail { display: inline-flex; margin-top: 0; }
    .pr-side-rail { display: none; }
    .pr-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      overflow: hidden;
    }
    .pr-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
      font-size: .86rem;
      font-weight: 850;
    }
    .pr-panel-body { display: grid; gap: 8px; padding: 10px; }
    .pr-tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
    .pr-tab {
      min-height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: var(--soft);
      color: var(--muted);
      font-size: .78rem;
      font-weight: 780;
    }
    .pr-tab.active { background: var(--paper); color: var(--accent-strong); }
    .pr-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .pr-chip {
      min-width: 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      text-align: center;
    }
    .pr-chip strong {
      display: block;
      font-size: .88rem;
      line-height: 1.1;
    }
    .pr-chip span {
      color: var(--muted);
      font-size: .68rem;
      line-height: 1.1;
    }
    .pr-list { display: grid; gap: 7px; max-height: 292px; overflow: auto; }
    .pr-item {
      display: grid;
      gap: 4px;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }
    .pr-item:hover { border-color: rgba(33, 104, 91, .45); background: #fbfdfc; }
    .pr-item-title { font-size: .8rem; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
    .pr-item-meta { color: var(--muted); font-size: .73rem; line-height: 1.25; overflow-wrap: anywhere; }
    .pr-annotation-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 30px;
      gap: 6px;
      align-items: stretch;
    }
    .pr-annotation-row .pr-item { min-width: 0; }
    .pr-danger-button {
      min-height: 30px;
      width: 30px;
      border: 1px solid rgba(159, 29, 29, .24);
      border-radius: 8px;
      background: #fff7f7;
      color: var(--danger);
      font-size: .86rem;
      font-weight: 850;
      line-height: 1;
    }
    .pr-danger-button:hover {
      border-color: rgba(159, 29, 29, .5);
      background: #ffecec;
    }
    .pr-empty {
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.4;
    }
    .pr-error {
      padding: 12px;
      border: 1px solid rgba(159, 29, 29, .32);
      border-radius: 8px;
      background: #fff3f3;
      color: var(--danger);
      font-size: .86rem;
      line-height: 1.4;
    }
    @media (max-width: 1080px) {
      .pr-toolbar { grid-template-columns: 1fr; }
      .pr-controls, .pr-actions { justify-content: flex-start; }
      .pr-workspace, .pr-workspace.panel-collapsed { grid-template-columns: 1fr; overflow: auto; }
      .pr-viewer { min-height: 540px; }
      .pr-side, .pr-side.collapsed { height: auto; min-height: 0; overflow: visible; }
      .pr-side.collapsed .pr-panel { display: none; }
      .pr-side.collapsed .pr-side-rail { display: inline-flex; }
      .pr-dock { grid-template-columns: 1fr; }
      .pr-dock-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./assets/pdf.min.js"></script>
  <script>
    const READY = "streamlit:componentReady";
    const SET_VALUE = "streamlit:setComponentValue";
    const SET_HEIGHT = "streamlit:setFrameHeight";
    const RENDER = "streamlit:render";
    const DEFAULT_UI = {
      annotations: "Annotations",
      translation: "Translation",
      ai: "AI",
      claims: "Claims",
      create_annotation: "Highlight",
      create_chunk: "Chunk",
      create_citation: "Cite",
      delete_annotation: "Delete annotation",
      translate_selection: "Translate",
      translate_full_paper: "Full translation",
      translate_visible_pages: "Visible pages",
      explain_selection: "Explain",
      ask_paper: "Ask",
      search: "Search",
      page: "Page",
      pdf_loading: "Loading PDF...",
      pdf_missing: "No PDF page preview is available.",
      pdf_preview_mode: "Using page preview",
      pdf_error: "PDF.js could not render this paper.",
      selected_text: "Selected text",
      note: "Note",
      question: "Question",
      jump: "Jump",
      empty: "No items yet",
      fit_width: "Fit width",
      fit_page: "Fit page",
      actual_size: "1:1",
      panel: "Panel",
      translated: "Translated",
      translating: "Translating...",
      missing: "Missing",
      stale: "Stale",
      failed: "Failed",
      selection_single_page: "Multi-page selection is captured from the first page for now.",
    };
    let args = {};
    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let scaleMode = "fit-width";
    let customScale = 1.25;
    let textCache = new Map();
    let pageBaseSizes = new Map();
    let pageRenderStates = new Map();
    let observer = null;
    let currentSelection = null;
    let activeTab = "translation";
    let focusedAnnotationId = "";
    let eventSeq = 0;
    let lastFrameHeight = 0;
    let visiblePages = [];
    let lastViewportSignature = "";
    let lastProgressPage = 0;
    let sidePanelCollapsed = true;
    let requestedPreviews = new Set();
    let resizeTimer = null;
    let viewportTimer = null;
    let dockState = { mode: "idle", status: "", selected_text: "", result: "", selection_hash: "" };
    let cacheDbPromise = null;
    const CACHE_DB = "nblane_pdf_reader_cache_v1";
    const CACHE_STORE = "pages";

    function send(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }
    function setHeight() {
      const requested = Number(args.height || 820);
      const real = Math.max(520, requested || 820);
      if (Math.abs(real - lastFrameHeight) < 1) return;
      lastFrameHeight = real;
      send(SET_HEIGHT, { height: real });
    }
    function emit(value) {
      send(SET_VALUE, { dataType: "json", value });
      window.setTimeout(setHeight, 20);
    }
    function asObj(value) {
      return value && typeof value === "object" && !Array.isArray(value) ? value : {};
    }
    function asArr(value) {
      return Array.isArray(value) ? value : [];
    }
    function text(value) {
      return value == null ? "" : String(value);
    }
    function esc(value) {
      return text(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }
    function attr(value) {
      return esc(value).replaceAll("'", "&#39;");
    }
    function label(key, fallback) {
      const ui = asObj(args.ui);
      return text(ui[key] || DEFAULT_UI[key] || fallback || key);
    }
    async function sha256(value) {
      try {
        const data = new TextEncoder().encode(text(value));
        const digest = await crypto.subtle.digest("SHA-256", data);
        return "sha256:" + Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
      } catch {
        let hash = 0;
        const raw = text(value);
        for (let i = 0; i < raw.length; i += 1) {
          hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
        }
        return `sha256:fallback-${Math.abs(hash)}`;
      }
    }
    function sourceId() {
      return text(asObj(args.source).id || asObj(args.source).source_id);
    }
    function sourceMetadata() {
      return asObj(asObj(args.source).metadata);
    }
    function pdfFingerprint() {
      const source = asObj(args.source);
      const meta = sourceMetadata();
      const fromDoc = pdfDoc && pdfDoc.fingerprints && pdfDoc.fingerprints.length ? pdfDoc.fingerprints.join(":") : "";
      return text(source.fingerprint || source.pdf_fingerprint || source.pdf_sha256 || meta.pdf_sha256 || meta.pdf_asset_ref || fromDoc);
    }
    function pdfSourceSignature() {
      const pdfBase64 = text(args.pdf_base64);
      const pdfUrl = text(args.pdf_url);
      const source = asObj(args.source);
      const sourceKey = text(source.id || source.source_id || source.url || "");
      const fingerprint = pdfFingerprint();
      const pdfKey = pdfUrl || (pdfBase64 ? `base64:${pdfBase64.length}:${pdfBase64.slice(0, 80)}:${pdfBase64.slice(-80)}` : "");
      return `${sourceKey}\n${fingerprint}\n${pdfKey}`;
    }
    function pdfCacheIdentity() {
      return text(pdfFingerprint() || args.pdf_url || pdfSourceSignature());
    }
    function pageCacheKey(pageNumber, scale, dpr) {
      const roundedScale = Math.round(Number(scale || 1) * 1000) / 1000;
      const roundedDpr = Math.round(Number(dpr || 1) * 100) / 100;
      return [
        "page",
        sourceId() || "source",
        pdfCacheIdentity() || "pdf",
        pageNumber,
        roundedScale,
        roundedDpr,
      ].map((part) => encodeURIComponent(text(part))).join("|");
    }
    function openCacheDb() {
      if (!("indexedDB" in window)) return Promise.resolve(null);
      if (cacheDbPromise) return cacheDbPromise;
      cacheDbPromise = new Promise((resolve) => {
        try {
          const request = indexedDB.open(CACHE_DB, 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(CACHE_STORE)) db.createObjectStore(CACHE_STORE, { keyPath: "key" });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => resolve(null);
        } catch {
          resolve(null);
        }
      });
      return cacheDbPromise;
    }
    async function readPageCache(key) {
      try {
        const db = await openCacheDb();
        if (!db) return null;
        return await new Promise((resolve) => {
          const tx = db.transaction(CACHE_STORE, "readonly");
          const request = tx.objectStore(CACHE_STORE).get(key);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => resolve(null);
        });
      } catch {
        return null;
      }
    }
    async function writePageCache(row) {
      try {
        const db = await openCacheDb();
        if (!db) return;
        await new Promise((resolve) => {
          const tx = db.transaction(CACHE_STORE, "readwrite");
          tx.objectStore(CACHE_STORE).put({ ...row, updated: Date.now() });
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
        prunePageCache(row.pdf);
      } catch {}
    }
    function renderCacheMaxPages() {
      const raw = Number(settings().render_cache_max_pages);
      return Number.isFinite(raw) ? Math.max(8, Math.min(120, raw)) : 48;
    }
    async function prunePageCache(pdfIdentity) {
      try {
        const db = await openCacheDb();
        if (!db) return;
        const rows = await new Promise((resolve) => {
          const tx = db.transaction(CACHE_STORE, "readonly");
          const request = tx.objectStore(CACHE_STORE).getAll();
          request.onsuccess = () => resolve(Array.isArray(request.result) ? request.result : []);
          request.onerror = () => resolve([]);
        });
        const ownRows = rows
          .filter((row) => row && row.source_id === sourceId() && row.pdf === pdfIdentity)
          .sort((a, b) => Number(b.updated || 0) - Number(a.updated || 0));
        const stale = ownRows.slice(renderCacheMaxPages());
        if (!stale.length) return;
        await new Promise((resolve) => {
          const tx = db.transaction(CACHE_STORE, "readwrite");
          const store = tx.objectStore(CACHE_STORE);
          stale.forEach((row) => row && row.key && store.delete(row.key));
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch {}
    }
    function eventId(action) {
      eventSeq += 1;
      return `${sourceId() || "paper"}:${action}:${Date.now()}:${eventSeq}`;
    }
    function basePayload(extra = {}) {
      const payload = {
        source_id: sourceId(),
        page: currentPage,
        primary_page: currentPage,
        visible_pages: visiblePages.slice(),
        selected_text: "",
        selected_text_hash: "",
        rects: [],
        segment_refs: [],
        locator: currentPage ? `p. ${currentPage}` : "",
        event_id: "",
        ...extra,
      };
      payload.selected_text_hash = payload.selected_text_hash || payload.source_hash || "";
      payload.event_id = payload.event_id || eventId("event");
      return payload;
    }
    function emitAction(action, payload = {}) {
      const cleanPayload = basePayload({ ...payload, event_id: payload.event_id || eventId(action) });
      emit({ action, event_id: cleanPayload.event_id, payload: cleanPayload });
    }
    function settings() {
      return asObj(args.settings);
    }
    function emitPassiveEvents() {
      const value = settings().emit_passive_events;
      return value === true || value === "true";
    }
    function autoSaveProgress() {
      const value = settings().auto_save_progress;
      return value !== false && value !== "false";
    }
    function overscanPages() {
      const raw = Number(settings().overscan_pages);
      return Number.isFinite(raw) ? Math.max(0, Math.min(8, raw)) : 2;
    }
    function targetLang() {
      return text(settings().target_lang || "zh") || "zh";
    }
    function status(message) {
      const el = document.querySelector(".pr-status-main");
      if (el) el.textContent = message;
    }
    function knownPageCount(pageNumber = 1) {
      const source = asObj(args.source);
      const sourceMetadata = asObj(source.metadata);
      return Math.max(
        totalPages,
        Number(sourceMetadata.page_count || 0),
        Number(source.page_count || 0),
        Number(settings().page_count || 0),
        ...asArr(args.pages).map((row) => Number(asObj(row).page || 0)),
        ...asArr(args.page_previews).map((row) => Number(asObj(row).page || 0)),
        Number(pageNumber || 1),
        1
      );
    }
    function initialPage() {
      return Math.max(1, Number(settings().initial_page || settings().page || currentPage || 1));
    }
    function defaultBaseSize() {
      return pageBaseSizes.get(1) || { width: 612, height: 792 };

        const highlightLayer = document.getElementById(`highlightLayer-${pageNumber}`);
        if (canvas) {
          const context = canvas.getContext("2d");
          if (context) context.clearRect(0, 0, canvas.width, canvas.height);
          canvas.width = 1;
          canvas.height = 1;
        }
        if (textLayer) textLayer.innerHTML = "";
        if (highlightLayer) highlightLayer.innerHTML = "";
        pageRenderStates.delete(pageNumber);
      }
    }
    async function ensurePageRendered(pageNumber) {
      if (pageNumber < 1 || pageNumber > (totalPages || knownPageCount(pageNumber))) return;
      const viewportSize = pageViewportSize(pageNumber);
      const currentScale = viewportSize.scale;
      const state = pageRenderStates.get(pageNumber) || {};
      if (state.rendering || Math.abs(Number(state.renderedScale || 0) - currentScale) < .001) return;
      if (!pdfDoc) {
        renderPreviewOnly(pageNumber);
        return;
      }
      state.rendering = true;
      pageRenderStates.set(pageNumber, state);
      try {
        const page = await pdfDoc.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });
        pageBaseSizes.set(pageNumber, { width: baseViewport.width, height: baseViewport.height });
        const pageScale = scaleForPage(pageNumber);
        const viewport = page.getViewport({ scale: pageScale });
        updatePageBox(pageNumber, viewport);
        const canvas = document.getElementById(`pdfCanvas-${pageNumber}`);
        if (!canvas) return;
        const context = canvas.getContext("2d");
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const cacheKey = pageCacheKey(pageNumber, pageScale, dpr);
        const cached = await readPageCache(cacheKey);
        canvas.width = Math.floor(viewport.width * dpr);
        canvas.height = Math.floor(viewport.height * dpr);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        if (cached && text(cached.textBody)) textCache.set(pageNumber, text(cached.textBody));
        const hasPreview = applyCachedPagePreview(pageNumber, viewport, cached) || applyPagePreview(pageNumber, viewport);
        if (state.renderTask) {
          try { state.renderTask.cancel(); } catch {}
        }
        let renderedOk = false;
        state.renderTask = page.render({
          canvasContext: context,
          viewport,
          transform: dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0],
        });
        try {
          await withTimeout(state.renderTask.promise, 3500, "PDF.js render timed out; using image preview fallback.");
          clearPagePreview(pageNumber);
          renderedOk = true;
        } catch (error) {
          if (!hasPreview) showPageError(pageNumber, error && error.message ? error.message : error);
          try { state.renderTask.cancel(); } catch {}
        }
        state.renderTask = null;
        const textBody = await renderTextLayer(pageNumber, page, viewport);
        renderHighlights(pageNumber);
        state.renderedScale = pageScale;
        try {
          if (!renderedOk) return;
          writePageCache({
            key: cacheKey,
            source_id: sourceId(),
            pdf: pdfCacheIdentity(),
            page: pageNumber,
            scale: pageScale,
            dpr,
            bitmap: canvas.toDataURL("image/png"),
            textBody,
          });
        } catch {}
      } catch (error) {
        if (!applyPagePreview(pageNumber, viewportSize)) showPageError(pageNumber, error && error.message ? error.message : error);
      } finally {
        state.rendering = false;
        pageRenderStates.set(pageNumber, state);
        setHeight();
      }
    }
    async function renderTextLayer(pageNumber, page, viewport) {
      const layer = document.getElementById(`textLayer-${pageNumber}`);
      if (!layer) return "";
      layer.innerHTML = "";
      const content = await page.getTextContent();
      const body = content.items.map((item) => text(item.str)).join(" ");
      textCache.set(pageNumber, body);
      for (const item of content.items) {
        const str = text(item.str);
        if (!str.trim()) continue;
        const tx = window.pdfjsLib.Util.transform(viewport.transform, item.transform);
        const style = content.styles[item.fontName] || {};
        const span = document.createElement("span");
        const fontHeight = Math.hypot(tx[2], tx[3]) || Number(item.height || 10) * viewport.scale;
        span.textContent = str;
        span.style.left = `${tx[4]}px`;
        span.style.top = `${tx[5] - fontHeight}px`;
        span.style.fontSize = `${fontHeight}px`;
        span.style.fontFamily = style.fontFamily || "sans-serif";
        span.dataset.page = String(pageNumber);
        layer.appendChild(span);
      }
      return body;
    }
    function applyCachedPagePreview(pageNumber, viewport, cached) {
      const img = document.getElementById(`pagePreview-${pageNumber}`);
      const canvas = document.getElementById(`pdfCanvas-${pageNumber}`);
      if (!img || !canvas || !cached || !text(cached.bitmap)) return false;
      try {
        img.src = text(cached.bitmap);
        img.style.width = `${viewport.width}px`;
        img.style.height = `${viewport.height}px`;
        img.classList.add("visible");
        canvas.classList.add("pending-fallback");
        return true;
      } catch {
        return false;
      }
    }
    function applyPagePreview(pageNumber, viewport) {
      const preview = previewForPage(pageNumber);
      const img = document.getElementById(`pagePreview-${pageNumber}`);
      const canvas = document.getElementById(`pdfCanvas-${pageNumber}`);
      if (!img || !canvas) return false;
      if (!preview) {
        img.removeAttribute("src");
        img.classList.remove("visible");
        canvas.classList.remove("pending-fallback");
        return false;
      }
      img.src = text(preview.data_url);
      img.style.width = `${viewport.width}px`;
      img.style.height = `${viewport.height}px`;
      img.classList.add("visible");
      canvas.classList.add("pending-fallback");
      return true;
    }
    function clearPagePreview(pageNumber) {
      const img = document.getElementById(`pagePreview-${pageNumber}`);
      const canvas = document.getElementById(`pdfCanvas-${pageNumber}`);
      if (img) img.classList.remove("visible");
      if (canvas) canvas.classList.remove("pending-fallback");
    }
    function showPageError(pageNumber, message) {
      const wrap = pageWrap(pageNumber);
      if (!wrap || wrap.querySelector(".pr-page-error")) return;
      wrap.insertAdjacentHTML("afterbegin", `<div class="pr-page-error">${esc(message)}</div>`);
    }
    function withTimeout(promise, ms, message) {
      let timer = null;
      const timeout = new Promise((_, reject) => {
        timer = window.setTimeout(() => reject(new Error(message)), ms);
      });
      return Promise.race([promise, timeout]).finally(() => {
        if (timer !== null) window.clearTimeout(timer);
      });
    }
    function renderPreviewOnly(pageNumber) {
      const size = pageViewportSize(pageNumber);
      updatePageBox(pageNumber, size);
      const canvas = document.getElementById(`pdfCanvas-${pageNumber}`);
      if (canvas) {
        canvas.width = Math.floor(size.width);
        canvas.height = Math.floor(size.height);
        canvas.classList.add("pending-fallback");
      }
      if (!applyPagePreview(pageNumber, size) && !requestedPreviews.has(pageNumber)) {
        requestedPreviews.add(pageNumber);
        emitAction("request_page_preview", { page: pageNumber, locator: `p. ${pageNumber}` });
      }
      const pageInput = document.getElementById("pageInput");
      if (pageInput) pageInput.value = String(currentPage);
      renderHighlights(pageNumber);
    }
    function applyAllKnownHighlights() {
      for (let pageNumber = 1; pageNumber <= (totalPages || knownPageCount(currentPage)); pageNumber += 1) {
        renderHighlights(pageNumber);
      }
    }
    function renderHighlights(pageNumber) {
      const layer = document.getElementById(`highlightLayer-${pageNumber}`);
      if (!layer) return;
      layer.innerHTML = "";
      asArr(args.annotations).forEach((row) => {
        const obj = asObj(row);
        if (obj.status === "deleted") return;
        if (Number(obj.page || 0) !== pageNumber) return;
        const rects = asArr(obj.rects);
        rects.forEach((rect) => {
          const r = asObj(rect);
          const pctReady = r.x_pct != null || r.y_pct != null || r.w_pct != null || r.h_pct != null;
          const x = pctReady ? Number(r.x_pct || 0) * layer.clientWidth : Number(r.x || 0);
          const y = pctReady ? Number(r.y_pct || 0) * layer.clientHeight : Number(r.y || 0);
          const w = pctReady ? Number(r.w_pct || 0) * layer.clientWidth : Number(r.w || 0);
          const h = pctReady ? Number(r.h_pct || 0) * layer.clientHeight : Number(r.h || 0);
          const div = document.createElement("div");
          div.className = `pr-highlight ${text(obj.id) === focusedAnnotationId ? "focus" : ""}`;
          div.style.left = `${x}px`;
          div.style.top = `${y}px`;
          div.style.width = `${Math.max(2, w)}px`;
          div.style.height = `${Math.max(2, h)}px`;
          layer.appendChild(div);
        });
      });
    }
    async function handleSelection() {
      const sel = window.getSelection();
      const selectedRaw = text(sel ? sel.toString() : "").trim();
      if (!selectedRaw || !sel || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      const rectsRaw = Array.from(range.getClientRects()).filter((rect) => rect.width > 1 && rect.height > 1);
      const pageSet = new Set();
      for (const rect of rectsRaw) {
        const page = pageNumberForPoint(rect.left + 1, rect.top + 1);
        if (page) pageSet.add(page);
      }
      const pickedPage = pageSet.size ? Math.min(...Array.from(pageSet)) : currentPage;
      let selectedText = selectedRaw;
      if (pageSet.size > 1) {
        selectedText = selectedTextForPageRange(range, pickedPage) || selectedRaw;
        status(label("selection_single_page"));
      }
      const wrap = pageWrap(pickedPage);
      if (!wrap) return;
      const wrapBox = wrap.getBoundingClientRect();
      const wrapWidth = Math.max(1, wrapBox.width);
      const wrapHeight = Math.max(1, wrapBox.height);
      const rects = rectsRaw
        .filter((rect) => pageNumberForPoint(rect.left + 1, rect.top + 1) === pickedPage)
        .map((rect) => ({
          page: pickedPage,
          x: Math.max(0, rect.left - wrapBox.left),
          y: Math.max(0, rect.top - wrapBox.top),
          w: rect.width,
          h: rect.height,
          x_pct: Math.max(0, rect.left - wrapBox.left) / wrapWidth,
          y_pct: Math.max(0, rect.top - wrapBox.top) / wrapHeight,
          w_pct: rect.width / wrapWidth,
          h_pct: rect.height / wrapHeight,
          page_width: wrapWidth,
          page_height: wrapHeight,
          scale: scaleForPage(pickedPage),
        }));
      const segmentRefs = segmentRefsForSelection(selectedText, pickedPage);
      currentSelection = {
        source_id: sourceId(),
        page: pickedPage,
        selected_text: selectedText,
        selected_text_hash: await sha256(selectedText),
        rects,
        segment_refs: segmentRefs,
        locator: `p. ${pickedPage}`,
      };
      dockState = {
        mode: "selection",
        status: label("selected_text"),
        selected_text: selectedText,
        result: "",
        selection_hash: text(currentSelection.selected_text_hash),
      };
      renderSelectionBar();
      if (emitPassiveEvents()) emitAction("selection_created", currentSelection);
    }
    function pageNumberForPoint(x, y) {
      const elements = document.elementsFromPoint(x, y);
      for (const el of elements) {
        const container = el.closest ? el.closest(".pr-page-container") : null;
        if (container) return Number(container.dataset.page || 0);
      }
      return 0;
    }
    function selectedTextForPageRange(range, pageNumber) {
      const layer = document.getElementById(`textLayer-${pageNumber}`);
      if (!layer) return "";
      const parts = [];
      layer.querySelectorAll("span").forEach((span) => {
        try {
          if (range.intersectsNode(span)) parts.push(text(span.textContent));
        } catch {}
      });
      return parts.join(" ").replace(/\s+/g, " ").trim();
    }
    function renderSelectionBar() {
      const hasSelection = currentSelection && currentSelection.selected_text;
      if (!hasSelection && dockState.mode === "selection") dockState = { mode: "idle", status: "", selected_text: "", result: "", selection_hash: "" };
      refreshDock();
    }
    function segmentRefsForSelection(selectedText, pageNumber) {
      const clean = text(selectedText).trim();
      if (!clean) return [];
      const lowered = clean.toLowerCase();
      return asArr(args.segments)
        .filter((row) => {
          const obj = asObj(row);
          if (Number(obj.page || 0) && Number(obj.page || 0) !== pageNumber) return false;
          const body = text(obj.text).toLowerCase();
          return body.includes(lowered) || lowered.includes(body.slice(0, Math.min(80, body.length)));
        })
        .map((row) => text(asObj(row).segment_id))
        .filter(Boolean)
        .slice(0, 4);
    }
    function segmentRefsForPages(pages) {
      const picked = new Set(pages.map((page) => Number(page || 0)));
      return asArr(args.segments)
        .map((row) => asObj(row))
        .filter((row) => picked.has(Number(row.page || 0)))
        .map((row) => text(row.segment_id))
        .filter(Boolean);
    }
    async function runSearch() {
      const query = text(document.getElementById("searchInput")?.value).trim().toLowerCase();
      if (!query) return;
      for (let page = currentPage; page <= (totalPages || knownPageCount(currentPage)); page += 1) {
        const body = await pageText(page);
        if (body.toLowerCase().includes(query)) return scrollToPage(page);
      }
      for (let page = 1; page < currentPage; page += 1) {
        const body = await pageText(page);
        if (body.toLowerCase().includes(query)) return scrollToPage(page);
      }
      status("No match");
    }
    async function pageText(pageNumber) {
      if (textCache.has(pageNumber)) return textCache.get(pageNumber);
      try {
        const cached = await readPageCache(pageCacheKey(pageNumber, scaleForPage(pageNumber), Math.max(1, window.devicePixelRatio || 1)));
        if (cached && text(cached.textBody)) {
          const body = text(cached.textBody);
          textCache.set(pageNumber, body);
          return body;
        }
      } catch {}
      if (pdfDoc) {
        const page = await pdfDoc.getPage(pageNumber);
        const content = await page.getTextContent();
        const body = content.items.map((item) => text(item.str)).join(" ");
        textCache.set(pageNumber, body);
        return body;
      }
      const pageRow = asArr(args.pages).map((row) => asObj(row)).find((row) => Number(row.page || 0) === pageNumber);
      const body = text(pageRow && pageRow.text);
      textCache.set(pageNumber, body);
      return body;
    }
    function scrollToPage(pageNumber) {
      const count = totalPages || knownPageCount(pageNumber);
      const next = Math.max(1, Math.min(count || 1, Number(pageNumber || 1)));
      currentPage = next;
      currentSelection = null;
      const page = pageElement(next);
      if (page) page.scrollIntoView({ block: "start", behavior: "smooth" });
      renderAround(next);
      renderSelectionBar();
      updatePageUi();
      scheduleViewportUpdate();
    }
    async function rerenderForScale() {
      const page = currentPage;
      for (const state of pageRenderStates.values()) {
        if (state.renderTask) {
          try { state.renderTask.cancel(); } catch {}
        }
      }
      pageRenderStates = new Map();
      renderDocumentSkeleton();
      setupIntersectionObserver();
      scrollToPage(page);
      renderAround(page);
    }
    function scheduleViewportUpdate() {
      if (viewportTimer) window.clearTimeout(viewportTimer);
      viewportTimer = window.setTimeout(updateViewportState, 180);
    }
    function updateViewportState() {
      const viewer = document.getElementById("viewer");
      if (!viewer) return;
      const viewerBox = viewer.getBoundingClientRect();
      const pages = [];
      let primary = currentPage;
      let primaryPixels = -1;
      document.querySelectorAll(".pr-page-container").forEach((container) => {
        const pageNumber = Number(container.dataset.page || 0);
        if (!pageNumber) return;
        const rect = container.getBoundingClientRect();
        const overlap = Math.max(0, Math.min(rect.bottom, viewerBox.bottom) - Math.max(rect.top, viewerBox.top));
        if (overlap > 1) {
          pages.push(pageNumber);
          if (overlap > primaryPixels) {
            primaryPixels = overlap;
            primary = pageNumber;
          }
        }
      });
      if (!pages.length) pages.push(currentPage);
      visiblePages = pages;
      const pageChanged = primary !== currentPage;
      currentPage = primary;
      updatePageUi();
      if (pageChanged || activeTab === "translation" || activeTab === "ai") refreshSide();
      renderAround(primary);
      const signature = `${primary}:${pages.join(",")}`;
      if (signature !== lastViewportSignature && (emitPassiveEvents() || autoSaveProgress())) {
        lastViewportSignature = signature;
        emitAction("viewport_changed", { visible_pages: pages, primary_page: primary, page: primary, locator: `p. ${primary}` });
      }
      if (pageChanged && primary !== lastProgressPage && (emitPassiveEvents() || autoSaveProgress())) {
        lastProgressPage = primary;
        emitAction("page_changed", { page: primary, primary_page: primary, visible_pages: pages, locator: `p. ${primary}` });
      }
    }
    function updatePageUi() {
      const pageInput = document.getElementById("pageInput");
      if (pageInput) pageInput.value = String(currentPage);
      status(statusText());
    }
    async function loadPdf() {
      const pdfBase64 = text(args.pdf_base64);
      const pdfUrl = text(args.pdf_url);
      scaleMode = text(settings().scale_mode || "fit-width") || "fit-width";
      sidePanelCollapsed = text(settings().side_panel_default || "collapsed") !== "open";
      requestedPreviews = new Set();
      currentSelection = null;
      dockState = { mode: "idle", status: "", selected_text: "", result: "", selection_hash: "" };
      textCache = new Map();
      pageBaseSizes = new Map();
      pageRenderStates = new Map();
      currentPage = initialPage();
      if (!pdfBase64 && !pdfUrl) {
        pdfDoc = null;
        totalPages = knownPageCount(currentPage);
        renderShell("");
        renderDocumentSkeleton();
        setupIntersectionObserver();
        scrollToPage(currentPage);
        return;
      }
      if (!window.pdfjsLib) {
        renderShell(label("pdf_error"));
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))} PDF.js CDN failed to load.</div>`;
        return;
      }
      try {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "./assets/pdf.worker.min.js";
        let source = { url: pdfUrl };
        if (pdfBase64) {
          const binary = atob(pdfBase64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          source = { data: bytes };
        }
        pdfDoc = await window.pdfjsLib.getDocument(source).promise;
        totalPages = pdfDoc.numPages || 1;
        currentPage = Math.max(1, Math.min(initialPage(), totalPages));
        const firstPage = await pdfDoc.getPage(1);
        const viewport = firstPage.getViewport({ scale: 1 });
        pageBaseSizes.set(1, { width: viewport.width, height: viewport.height });
        renderShell("");
        renderDocumentSkeleton();
        setupIntersectionObserver();
        scrollToPage(currentPage);
      } catch (error) {
        pdfDoc = null;
        totalPages = knownPageCount(currentPage);
        renderShell(label("pdf_error"));
        renderDocumentSkeleton();
        setupIntersectionObserver();
        scrollToPage(currentPage);
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.insertAdjacentHTML(
          "afterbegin",
          `<div class="pr-error">${esc(label("pdf_error"))}<br>${esc(error && error.message ? error.message : error)}</div>`
        );
      }
    }
    async function onRender(event) {
      try {
        args = asObj(event.data.args);
        focusedAnnotationId = text(settings().focus_annotation_id || focusedAnnotationId);
        const sourceSignature = pdfSourceSignature();
        const expectedPages = Math.max(1, totalPages || knownPageCount(currentPage));
        const skeletonMismatch = skeletonPageCount() > 0 && skeletonPageCount() !== expectedPages;
        const hasShell = Boolean(document.getElementById("continuousDocument"));
        const needsLoad = !hasShell || sourceSignature !== text(onRender.lastSignature) || skeletonMismatch;
        if (needsLoad) {
          onRender.lastSignature = sourceSignature;
          await loadPdf();
        } else {
          refreshForArgsUpdate();
        }
      } catch (error) {
        renderShell(label("pdf_error"));
        const viewer = document.querySelector(".pr-viewer");
        if (viewer) viewer.innerHTML = `<div class="pr-error">${esc(label("pdf_error"))}<br>${esc(error && error.message ? error.message : error)}</div>`;
      }
    }
    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === RENDER) onRender(event);
    });
    window.addEventListener("resize", () => {
      if (resizeTimer) window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => rerenderForScale(), 180);
    });
    send(READY, { apiVersion: 1 });
    send(SET_HEIGHT, { height: 820 });
  </script>
</body>
</html>
