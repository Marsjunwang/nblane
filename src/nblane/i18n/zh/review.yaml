page_title: 复盘 · nblane
title: 复盘
page_context_line: 把周复盘或阶段复盘整理成证据、下一步行动和公开草稿候选。
page_help_short: 使用说明
review_help_body: |-
  ### 复盘使用流程

  1. 选择时间窗口，从活动、已完成任务、学习记录和收件信号生成候选。
  2. 在 **证据候选** 中，可先保存到 Activity 留痕，也可把确认过的条目应用到证据池；来源 Done 已覆盖时保留 crystallized 标记。
  3. 在 **下一步行动候选** 中，只保存或应用你决定继续推进的队列项。
  4. 在 **公开草稿候选** 中创建博客草稿；本页不会发布内容。
  5. 用 **方法说明** 和 **Agent 活动** 审计候选来源和写入记录。

  复盘是候选生成器；所有文件写入都需要显式选择并应用。
