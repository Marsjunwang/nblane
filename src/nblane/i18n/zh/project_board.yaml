field_goal_refs_help: 目标说明这个项目服务于哪条阶段目标，用于首页和差距分析按目标归因。
field_task_refs_help: 看板任务表示执行归属；从看板任务上选择项目后会自动同步回这里。
field_evidence_refs_help: 证据是这个项目承担或产出的已审阅事实。模型可以建议候选，但保存的关联仍是人工确认后的归属。
field_source_refs_help: 研究资料是属于这个项目的论文、URL 或导入材料。
field_experience_refs_help: 支持这个项目叙事的经历案例。
field_output_refs_help: 与这个项目相关的输出或公开草稿。
project_refs_hint: 这里的关联表示项目归属，不会复制目标或证据正文；模型建议的关联也需要保存前确认。
