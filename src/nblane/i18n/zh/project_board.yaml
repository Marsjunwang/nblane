page_title: 项目看板 · nblane
title: 项目看板
page_context_line: 内部项目案例连接目标、任务、资料、证据、里程碑和输出；公开项目仍由 projects.yaml 管理。
page_help_short: 使用说明
page_help_body: |-
  ### 项目看板使用流程

  1. 为需要跨目标、看板任务、证据、研究资料、里程碑和输出追踪的工作创建内部项目案例。
  2. 内部项目默认服务于个人工作流；公开项目页仍由公开输出层管理。
  3. 关联任务和证据后，首页与证据审阅才能识别项目归属缺口。
  4. 项目有阶段节点时添加里程碑；里程碑可以承接看板任务，不必改写任务正文。
  5. 只有准备进入执行流的事项才用「新建看板任务」。

  本页会写入 project-board.yaml，并可能把任务归属同步回 kanban.md。
