dashboard_help_title: 使用说明
dashboard_help_full_doc: 打开完整 Dashboard 使用说明
dashboard_help_body: |-
  ### 如何阅读 Dashboard

  顶部卡片回答当前正在追求什么：长期方向、主目标、活跃目标和当前工作。

  画布遵循成长图谱：**来源** 是原始材料，**证据** 是可审查事实，**断言** 是解释和结论，**技能** 是能力状态，**输出** 是公开或可复用表达。

  用 **捕捉来源** 记录轻量笔记和链接。捕捉内容默认进入研究工作台的私有收件箱；不会自动变成证据，也不会自动改技能状态。

  用 **证据审阅** 处理已完成任务、未链接证据、claim 候选和状态风险。AI 可以生成候选和摘要，但事实确认仍需要人工审阅。

  **本页 AI 设置**只影响首页内的目标-技能匹配和图谱洞察。研究工作台有自己的研究 AI 设置，用于论文搜索、翻译、阅读器和深读。

  8503 负责安全的档案选择与写入；8502 sidecar 启动后可承载更高交互的画布或阅读器界面。
