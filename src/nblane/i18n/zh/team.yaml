page_title: 团队视图 · nblane
title: 团队视图
page_context_line: 团队操作系统：维护 teams/ 下的 team.yaml 与共享产品池。
page_help_short: 使用说明
page_help_body: |-
  ### 团队视图使用流程

  1. 先选择要编辑的团队；团队文件位于 teams/，不会按个人档案过滤。
  2. 团队使命、成员、规则和当前优先级变化时，更新 team.yaml。
  3. 产品池用于沉淀共享问题、项目、证据、方法和决策。
  4. 保存前查看写入范围，确认本次会修改哪些团队文件。
  5. 个人技能、个人证据和个人目标仍应回到当前 profile 的页面维护。

  本页写入所选团队的 team.yaml 和 product-pool.yaml。
