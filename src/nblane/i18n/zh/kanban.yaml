page_title: 看板 · nblane
title: 看板
page_context_line: 私人操作系统 · 执行面：本周任务看板。「已完成」可经 AI 生成摄入草案，请按条审阅后再写入。
page_help_short: 使用说明
page_help_body: |-
  ### 看板使用流程

  1. 不确定的事项先放入队列或收件区；进行中保持足够小，确保本周能收尾。
  2. 任务详情写清结果、背景、阻塞和链接；子任务应是可勾选的执行步骤。
  3. 已完成不等于证据。Done 任务需要进入 Evidence Review，审阅后才支撑技能升级或公开 claim。
  4. 学习和运动记录放在个人工作台，避免污染执行列。
  5. 看板 AI 可以生成子任务或澄清模糊任务，但必须确认候选后才会写入 kanban.md。

  保存或自动保存会写入 kanban.md，并同步项目归属到 project-board.yaml。
