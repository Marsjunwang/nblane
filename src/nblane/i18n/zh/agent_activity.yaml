page_title: Agent 活动 · nblane
title: Agent 活动
page_context_line: 审查跨页面候选、补丁、写回结果和失败状态。
page_help_short: 使用说明
page_help_body: |-
  ### Agent 活动使用流程

  1. 把这里当作全应用 AI / Agent 候选的审计队列。
  2. 通过状态、模块、类型和候选类型筛选待处理或失败项。
  3. 只有 owner 页面支持安全写回的候选才在这里应用；否则打开 owner 页面审阅。
  4. 仍需要留痕的过期候选请标记丢弃，不要直接删除。
  5. 技术详情用于排查失败的 Agent / Codex 调用；产品判断优先看预览和引用。

  Agent 活动是审阅账本，目标是让 AI 写入可追踪，而不是隐形发生。
