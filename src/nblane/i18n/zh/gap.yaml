page_title: 差距分析 · nblane
title: 差距分析
page_context_line: Agent 操作系统：将任务映射到技能树；结合规则与可选 AI，为与编程 Agent 协作准备下一步。
page_help_short: 使用说明
page_help_body: |-
  ### 差距分析使用流程

  1. 尽量具体描述任务：目标系统、约束、期望结果和未知点。
  2. 规则匹配适合可解释的关键词覆盖；当任务语言和技能 schema 不一致时，再开启 AI 首轮匹配。
  3. 任务需要围绕当前阶段目标解释时，勾选 current goal 上下文。
  4. 先看匹配节点和依赖闭包，再参考建议下一步。
  5. 只有任务完成且证据存在后，才应用技能状态更新。

  本页是规划视角，不替代证据审阅。
