page_title: 技能树 · nblane
title: 技能树
page_context_line: 私人操作系统：编辑结构化技能、内联证据与本档案的共享证据池。
page_help_short: 使用说明
page_help_body: |-
  ### 技能树使用流程

  1. 把技能状态当作能力 claim，而不是当天心情或主观感觉。
  2. 轻量记录可写入内联证据；同一证据支撑多个技能时，优先放入共享证据池并用 id 引用。
  3. 证据强度、置信度、项目引用和公开准备度请在证据审阅里处理。
  4. 点击保存会写入 skill-tree.yaml，并刷新 SKILL.md 中的生成块。
  5. 将技能提升到扎实或专家前，先检查证据风险提示。

  技能升级必须能被证据解释。
