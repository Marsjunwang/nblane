evidence_help_body: |-
  ### 证据审阅使用流程

  1. **已完成队列 / 整理**：选择已完成的看板任务，生成可审阅的证据草案，只应用你确认可信的条目。
  2. **断言工作台**：从已审阅证据按项目、目标、技能、全部证据或手动选择生成可复用公开断言。
  3. **证据池**：维护证据条目的强度、置信度、审阅状态、公开准备度和引用。
  4. **技能关联**：把活跃证据绑定到技能节点，避免技能状态没有证据支撑。
  5. **项目 / 经历引用**：把证据关联到项目案例、经历案例和研究资料。
  6. **状态风险**：发布或升级前检查扎实/专家技能是否缺少足够强的证据。

  本页 AI 只生成候选，必须经过预览和人工应用才会写入文件。

  ---

  ### 强度（strength）怎么判断

  强度衡量「这条证据有多硬、多可核验」，由强到弱四级：

  - **高信任 high_trust**：顶级论文（一作 / 会议期刊 / arXiv）且含可核验发表信息。
  - **强 strong**：论文、可复制的开源链接（GitHub/GitLab、org/repo、PR/release），或相对基线的量化指标（如 +X% AP、延迟 A→B）。
  - **中 medium**：真实的交付 / 复现 / 工程事实，但没有上面那些可核验亮点。
  - **弱 weak**：主要靠推断、描述含糊，或缺少可核验细节。

  **强度的用途**：它决定一个技能能声称到什么等级——
  - 技能标 **扎实（solid）** 至少需要 **中（medium）+** 强度的证据；
  - 技能标 **专家（expert）** 至少需要 **强（strong）+** 强度的证据。

  「状态风险」tab 就是按这个规则报警：技能等级声称过高、但证据强度不够时会被标出。

  ### 置信度（confidence）怎么判断

  置信度衡量「你对这条证据的真实性、以及上面那个强度评级有多确定」，三级：

  - **高 high**：证据直接可核验（有链接 / 论文 / 明确数字），强度评级几乎不会错。
  - **中 medium**：基本可信，但需要一点推断，或细节不全。
  - **低 low**：主要靠推测，来源或细节存疑。

  置信度目前不参与自动判断，是给人和后续断言筛选用的参考信号。
