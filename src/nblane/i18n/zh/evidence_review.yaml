evidence_help_body: |-
  ### 证据审阅使用流程

  1. **已完成队列 / 整理**：选择已完成的看板任务，生成可审阅的证据草案，只应用你确认可信的条目。
  2. **断言工作台**：从已审阅证据按项目、目标、技能、全部证据或手动选择生成可复用公开断言。
  3. **证据池**：维护证据条目的强度、置信度、审阅状态、公开准备度和引用。
  4. **技能关联**：把活跃证据绑定到技能节点，避免技能状态没有证据支撑。
  5. **项目 / 经历引用**：把证据关联到项目案例、经历案例和研究资料。
  6. **状态风险**：发布或升级前检查扎实/专家技能是否缺少足够强的证据。

  本页 AI 只生成候选，必须经过预览和人工应用才会写入文件。
