research_help_body: |-
  ### Research 使用流程

  1. **概览**：先看行动队列，处理阅读、解析、引用、隐私和综合导出的阻塞项。
  2. **论文库**：导入论文、补 PDF、打开 Reader、运行解析、翻译、标注，并生成论文 claim。
  3. **断言与引用**：先审阅 research claims 和 citations，再推进到 evidence 或输出。
  4. **综合 / 导出**：把已审阅 claims 组织成综合草稿、博客候选或项目更新。
  5. **收件箱与连接器**：手动捕捉 sources、预览 evidence 候选、配置连接器发现；连接器配置不保存 token、cookie 或 API key。

  Research claim 是带来源的工作断言；进入 Evidence Review 或公开输出前仍然必须走候选和人工确认。
