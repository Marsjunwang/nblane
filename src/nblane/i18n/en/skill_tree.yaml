page_title: Skill Tree · nblane
title: Skill Tree
page_context_line: 'Private OS: edit structured skills, inline evidence, and the shared evidence pool for this profile.'
page_help_short: Guide
page_help_body: |-
  ### Skill Tree workflow

  1. Treat status as a claim about capability, not as a mood marker.
  2. Add inline evidence for quick notes, or attach stable evidence-pool rows when the same proof supports several skills.
  3. Use Evidence Review for stronger review status, confidence, project refs, and publish readiness.
  4. Save writes skill-tree.yaml and refreshes generated SKILL.md blocks.
  5. Check evidence risk warnings before raising a skill to solid or expert.

  Skill status should move only when evidence can explain why.
