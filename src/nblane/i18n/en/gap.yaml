page_title: Gap Analysis · nblane
title: Gap Analysis
page_context_line: 'Agent OS: map a task to your skill tree; use rules and optional AI to plan next steps with your coding agent.'
page_help_short: Guide
page_help_body: |-
  ### Gap Analysis workflow

  1. Describe the task as concretely as possible: target system, constraints, expected result, and unknowns.
  2. Use rule matching for deterministic keyword coverage; enable AI routing when the task language does not match the schema well.
  3. Include current goal context when the task should be interpreted through the active stage goal.
  4. Read matched nodes and dependency closure before trusting the suggested next steps.
  5. Apply skill status updates only after the task is actually completed and evidence exists.

  This page is a planning lens. It should not replace Evidence Review.
