research_help_body: |-
  ### Research workflow

  1. **Overview**: start with the action queue for reading, extraction, citation, privacy, and synthesis blockers.
  2. **Paper Library**: import papers, attach PDFs, open Reader, run extraction, translate, annotate, and create paper claims.
  3. **Claims & Citations**: review research claims and citations before promoting anything to evidence or output.
  4. **Synthesis / Export**: assemble reviewed claims into draft exports, blog candidates, or project updates.
  5. **Inbox & Connectors**: capture manual sources, preview evidence candidates, and configure connector discovery. Connector configs do not store secrets.

  Research claims are source-aware working claims. Promotion to Evidence Review or public output remains candidate-first.
