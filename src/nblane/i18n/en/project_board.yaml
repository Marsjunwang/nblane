page_title: Project Board · nblane
title: Project Board
page_context_line: Internal project cases connect goals, tasks, sources, evidence, milestones, and outputs. Public projects still live in projects.yaml.
page_help_short: Guide
page_help_body: |-
  ### Project Board workflow

  1. Create internal project cases for work that connects goals, Kanban tasks, evidence, research sources, milestones, and outputs.
  2. Keep project status private by default; public project pages still come from the public output layer.
  3. Link tasks and evidence so Dashboard and Evidence Review can show ownership gaps.
  4. Add milestones when a project has visible checkpoints. Milestones can own Kanban tasks without changing the task text.
  5. Use the create-task action only for execution work you intend to track on Kanban.

  This page writes project-board.yaml and may sync task ownership back to kanban.md.
