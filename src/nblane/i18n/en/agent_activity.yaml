page_title: Agent Activity · nblane
title: Agent Activity
page_context_line: Review cross-page candidates, patches, writebacks, and failed apply attempts.
page_help_short: Guide
page_help_body: |-
  ### Agent Activity workflow

  1. Treat this page as the audit queue for AI or agent-generated candidates across the app.
  2. Filter by status, module, kind, or candidate type to find pending and failed work.
  3. Apply only candidates whose owner page supports safe writeback; otherwise open the owner page and review there.
  4. Dismiss stale candidates instead of deleting them when you still need audit history.
  5. Use technical details for debugging failed agent/Codex runs, but use preview and refs for product decisions.

  Activity is the review ledger. It should make AI writes traceable, not invisible.
