dashboard_help_title: Dashboard guide
dashboard_help_full_doc: Open full Dashboard guide
dashboard_help_body: |-
  ### How to read this dashboard

  The top cards answer what you are pursuing now: North Star, primary goal, active goals, and current work.

  The canvas follows the Growth Graph: **Source** is raw material, **Evidence** is reviewable fact, **Claim** is interpretation, **Skill** is capability state, and **Output** is public or reusable expression.

  Use **Capture source** for lightweight notes and links. Captures stay private in Research until reviewed; they do not become evidence or skill status automatically.

  Use **Evidence Review** for Done tasks, unlinked evidence, claim candidates, and status risks. AI can suggest links or summaries, but confirmed facts still require review.

  **Dashboard AI settings** only affect Dashboard actions such as goal-skill matching and graph insights. Research has its own Research AI settings for paper search, translation, Reader, and DeepRead.

  8503 owns safe profile selection and writes. 8502 can host a richer canvas or reader surface when the sidecar is running.
