page_title: Team View · nblane
title: Team View
page_context_line: 'Team OS: edit shared team.yaml and product pool files under teams/.'
page_help_short: Guide
page_help_body: |-
  ### Team View workflow

  1. Pick the team you are editing; team files live under teams/ and are not filtered by the personal profile.
  2. Update mission, members, rules, and priorities in team.yaml when the team operating context changes.
  3. Use product pools to collect shared problems, projects, evidence, methods, and decisions.
  4. Check the write-owner block before saving so you know which team files will change.
  5. Personal skill or evidence claims still belong in the selected profile pages, not team.yaml.

  Team View writes team.yaml and product-pool.yaml for the selected team.
