evidence_help_body: |-
  ### Evidence Review workflow

  1. **Done Queue / Housekeeping**: select completed Kanban tasks, generate a reviewable evidence draft, then apply only the rows you trust.
  2. **Claim Studio**: turn reviewed evidence into reusable public claims by project, goal, skill, all evidence, or manual selection.
  3. **Evidence Pool**: edit evidence rows, strength, confidence, review status, and public readiness.
  4. **Skill Links**: link active evidence to skill nodes so status upgrades stay grounded.
  5. **Project / Experience Refs**: connect evidence to project cases, experience cases, and research sources.
  6. **Status Risks**: check solid/expert skills whose evidence strength is too weak before publishing or upgrading claims.

  AI never writes directly without a preview/apply step on this page.

  ---

  ### How strength is judged

  Strength measures how hard and verifiable a piece of evidence is, from strongest to weakest:

  - **high_trust**: top-venue paper (first author / conference-journal / arXiv) with verifiable publication details.
  - **strong**: a paper, a copyable open-source link (GitHub/GitLab, org/repo, PR/release), or quantitative metrics vs a baseline (e.g. +X% AP, latency A→B).
  - **medium**: real delivery / reproduction / engineering fact, but without the verifiable highlights above.
  - **weak**: mostly inferred, vague, or missing verifiable detail.

  **What strength is for**: it gates how high a skill may claim its status —
  - a **solid** skill needs at least **medium+** strength evidence;
  - an **expert** skill needs at least **strong+** strength evidence.

  The Status Risks tab flags exactly this: a skill claiming a status higher than its linked evidence supports.

  ### How confidence is judged

  Confidence measures how sure you are about the evidence itself and the strength grade above, in three levels:

  - **high**: directly verifiable (link / paper / explicit numbers); the strength grade is almost certainly right.
  - **medium**: largely trustworthy but needs some inference, or details are incomplete.
  - **low**: mostly speculative; source or details are questionable.

  Confidence does not drive any automatic check today — it is a reference signal for humans and downstream claim filtering.
