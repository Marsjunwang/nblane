evidence_help_body: |-
  ### Evidence Review workflow

  1. **Done Queue / Housekeeping**: select completed Kanban tasks, generate a reviewable evidence draft, then apply only the rows you trust.
  2. **Claim Studio**: turn reviewed evidence into reusable public claims by project, goal, skill, all evidence, or manual selection.
  3. **Evidence Pool**: edit evidence rows, strength, confidence, review status, and public readiness.
  4. **Skill Links**: link active evidence to skill nodes so status upgrades stay grounded.
  5. **Project / Experience Refs**: connect evidence to project cases, experience cases, and research sources.
  6. **Status Risks**: check solid/expert skills whose evidence strength is too weak before publishing or upgrading claims.

  AI never writes directly without a preview/apply step on this page.
