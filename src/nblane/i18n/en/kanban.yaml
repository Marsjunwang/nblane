page_title: Kanban · nblane
title: Kanban
page_context_line: 'Private OS: weekly execution board. Done items can be draft-ingested into evidence — review each proposal before apply.'
page_help_short: Guide
page_help_body: |-
  ### Kanban workflow

  1. Capture uncertain work into Queue or Inbox; keep Doing small enough to finish this week.
  2. Use task details for outcome, context, blockers, and links. Subtasks should be checkable execution steps.
  3. Done is not evidence by itself. Send Done tasks through Evidence Review before they upgrade skills or public claims.
  4. Personal check-ins record learning and exercise without cluttering execution columns.
  5. Kanban AI can draft subtasks or clarify vague tasks, but proposals must be accepted before they write to kanban.md.

  Save or autosave writes kanban.md and syncs project-board ownership.
