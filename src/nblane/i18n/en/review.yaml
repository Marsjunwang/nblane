page_title: Review · nblane
title: 复盘
page_context_line: Turn weekly or stage review inputs into evidence, next action, and public draft candidates.
page_help_short: Guide
review_help_body: |-
  ### Review workflow

  1. Pick a time window and generate candidates from activity, Done tasks, learning, and inbox signals.
  2. In **Evidence candidates**, save selected rows to Activity for traceability or apply them into the evidence pool. Leave crystallization on when the source Done tasks are covered.
  3. In **Next action candidates**, save or apply only the queue items you want to carry forward.
  4. In **Public draft candidates**, create draft blog posts; this page never publishes them.
  5. Use **Method notes** and **Agent Activity** to audit how the candidates were derived.

  Review is a candidate generator. File writes are explicit and selected-row based.
