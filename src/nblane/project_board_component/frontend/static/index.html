<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1f2a;
      --muted: #6b7280;
      --line: #dfe1ea;
      --paper: #ffffff;
      --soft: #f6f7fb;
      --soft-strong: #eceefb;
      --accent: #4b4ad6;
      --accent-strong: #3735a8;
      --accent-soft: #e9e9fb;
      --warn: #8a5b12;
      --danger: #9f1d1d;
      --ok: #1f7a52;
      --shadow: 0 10px 28px rgba(27, 31, 42, .08);
    }
    * { box-sizing: border-box; }
    html, body, #root {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .pb-shell { display: grid; gap: 16px; padding: 2px 0 16px; }
    .pb-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px;
    }
    .pb-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .pb-card-head h3 { margin: 0; font-size: 15px; }
    .pb-grid { display: grid; gap: 12px; }
    .pb-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .pb-field { display: grid; gap: 4px; }
    .pb-field label { font-size: 12px; color: var(--muted); font-weight: 600; }
    .pb-field input, .pb-field textarea, .pb-field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      background: var(--paper);
      color: var(--ink);
    }
    .pb-field textarea { min-height: 64px; resize: vertical; }
    .pb-field input:focus, .pb-field textarea:focus, .pb-field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .pb-btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      padding: 8px 14px;
      font-weight: 600;
    }
    .pb-btn:hover { background: var(--soft); }
    .pb-btn.is-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pb-btn.is-primary:hover { background: var(--accent-strong); }
    .pb-btn.is-ghost { border-color: transparent; color: var(--muted); }
    .pb-btn[disabled] { opacity: .5; cursor: default; }
    .pb-card-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    .pb-muted { color: var(--muted); font-size: 12px; }
    .pb-dirty-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: var(--warn); margin-left: 6px; vertical-align: middle;
    }
    /* chip multiselect */
    .pb-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .pb-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 8px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-strong);
      font-size: 12px; font-weight: 600; border: 1px solid transparent;
    }
    .pb-chip.is-missing { background: #fbeaea; color: var(--danger); }
    .pb-chip button {
      border: 0; background: transparent; color: inherit;
      font-size: 13px; line-height: 1; padding: 0; opacity: .7;
    }
    .pb-chip button:hover { opacity: 1; }
    .pb-picker { position: relative; }
    .pb-picker-menu {
      position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0;
      max-height: 220px; overflow: auto;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--paper); box-shadow: var(--shadow); padding: 4px;
    }
    .pb-opt {
      padding: 7px 9px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    .pb-opt:hover, .pb-opt.is-active { background: var(--soft-strong); }
    .pb-opt.is-on { color: var(--accent-strong); font-weight: 600; }
    .pb-empty-opt { padding: 8px 9px; color: var(--muted); font-size: 12px; }
    /* milestone */
    .pb-ms { border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
    .pb-ms + .pb-ms { margin-top: 10px; }
    .pb-ms-head {
      display: flex; align-items: center; gap: 10px; justify-content: space-between;
      padding: 12px 14px; cursor: pointer;
    }
    .pb-ms-title { font-weight: 600; font-size: 14px; }
    .pb-ms-body { padding: 0 14px 14px; display: grid; gap: 12px; }
    .pb-progress { height: 6px; border-radius: 999px; background: var(--soft-strong); overflow: hidden; }
    .pb-progress > span { display: block; height: 100%; background: var(--ok); }
    .pb-pill {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: var(--soft-strong); color: var(--muted); font-weight: 600;
    }
    .pb-toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 8px;
      font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .pb-toast.is-on { opacity: .95; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="pb-toast" id="pb-toast"></div>
  <script>
    const READY = "streamlit:componentReady";
    const SET_VALUE = "streamlit:setComponentValue";
    const SET_HEIGHT = "streamlit:setFrameHeight";
    const RENDER = "streamlit:render";
    const STATUS_OPTS = ["active", "paused", "completed", "archived"];
    const KIND_OPTS = ["internal", "research", "work", "side_project", "learning"];
    const VIS_OPTS = ["private", "public"];
    const MS_STATUS_OPTS = ["planned", "active", "completed", "archived"];
    const REF_FIELDS = ["goal_refs", "task_refs", "evidence_refs", "source_refs", "experience_refs", "output_refs"];
    const MS_REF_FIELDS = ["task_refs", "evidence_refs", "source_refs", "output_refs"];
    const DEFAULT_LABELS = {
      tab_basic: "Basics",
      field_id: "ID",
      field_title: "Title",
      field_status: "Status",
      field_kind: "Kind",
      field_visibility: "Visibility",
      field_time_range: "Time range",
      field_summary: "Summary",
      field_notes: "Notes",
      field_target: "Target date",
      field_goal_refs: "Goals",
      field_task_refs: "Tasks",
      field_evidence_refs: "Evidence",
      field_source_refs: "Sources",
      field_experience_refs: "Experiences",
      field_output_refs: "Outputs",
      links_section: "Links",
      save_project: "Save project",
      save_milestone: "Save milestone",
      add_milestone: "Add milestone",
      archive_project: "Archive project",
      milestones: "Milestones",
      missing_ref: "missing",
      title_required: "Title is required.",
      status_active: "Active",
      status_paused: "Paused",
      status_completed: "Completed",
      status_archived: "Archived",
      status_planned: "Planned",
      no_options: "No matches",
      pick_placeholder: "Search to add…",
      saving: "Saving…",
      saved: "Saved",
      new_milestone: "New milestone",
      milestone_id_help: "Leave blank to auto-generate milestone:<slug>.",
      duplicate_milestone: "Milestone id already exists: {id}",
      completion: "{done}/{total} done ({pct}%)",
    };
    let args = {};
    let labels = {};
    let caseData = {};
    let milestones = [];
    let optionMaps = {};
    let draft = null;        // basics working copy
    let msDrafts = {};       // milestone id -> working copy
    let newMs = null;        // new-milestone working copy
    let openMsId = "";
    let picker = null;       // { scope, field, query, active }
    let eventSeq = 0;
    let toastTimer = 0;

    function send(type, data) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }
    function setHeight() {
      const real = Math.max(360, document.body.scrollHeight + 12);
      send(SET_HEIGHT, { height: real });
    }
    function asObj(v) { return v && typeof v === "object" && !Array.isArray(v) ? v : {}; }
    function asArr(v) { return Array.isArray(v) ? v : []; }
    function text(v) { return v == null ? "" : String(v); }
    function esc(v) {
      return text(v).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }
    function label(key) {
      const v = labels[key];
      return v == null || v === "" ? (DEFAULT_LABELS[key] || key) : v;
    }
    function toast(msg) {
      const el = document.getElementById("pb-toast");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("is-on");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("is-on"), 1600);
    }
    function emit(action, payload) {
      send(SET_VALUE, {
        dataType: "json",
        value: {
          action,
          payload: payload || {},
          event_id: `${Date.now()}-${++eventSeq}`,
        },
      });
    }
    function optionList(field) {
      return asArr(optionMaps[field]).filter((o) => o && o.id);
    }
    function optionLabel(field, id) {
      const hit = optionList(field).find((o) => o.id === id);
      if (hit) return hit.label || id;
      return `${id} (${label("missing_ref")})`;
    }
    function isMissing(field, id) {
      return !optionList(field).some((o) => o.id === id);
    }
    function statusLabel(value) { return label(`status_${value}`) || value; }

    function chipsHtml(scope, msId, field, selected) {
      const sel = asArr(selected);
      const chips = sel.map((id) => {
        const cls = isMissing(field, id) ? "pb-chip is-missing" : "pb-chip";
        return `<span class="${cls}">${esc(optionLabel(field, id))}`
          + `<button type="button" data-act="chip-remove" data-scope="${scope}"`
          + ` data-ms="${esc(msId)}" data-field="${field}" data-id="${esc(id)}"`
          + ` title="x">×</button></span>`;
      }).join("");
      const open = picker && picker.scope === scope && picker.msId === msId && picker.field === field;
      const add = `<button type="button" class="pb-chip" data-act="chip-open"`
        + ` data-scope="${scope}" data-ms="${esc(msId)}" data-field="${field}">+</button>`;
      let menu = "";
      if (open) {
        const q = (picker.query || "").toLowerCase();
        const opts = optionList(field).filter((o) =>
          !sel.includes(o.id) && (o.label || o.id).toLowerCase().includes(q));
        const rows = opts.slice(0, 60).map((o) =>
          `<div class="pb-opt" data-act="chip-pick" data-scope="${scope}"`
          + ` data-ms="${esc(msId)}" data-field="${field}" data-id="${esc(o.id)}">`
          + `${esc(o.label || o.id)}</div>`).join("");
        menu = `<div class="pb-picker-menu">`
          + `<input class="pb-pick-input" data-act="chip-query" data-scope="${scope}"`
          + ` data-ms="${esc(msId)}" data-field="${field}" placeholder="${esc(label("pick_placeholder"))}"`
          + ` value="${esc(picker.query || "")}" />`
          + (rows || `<div class="pb-empty-opt">${esc(label("no_options"))}</div>`)
          + `</div>`;
      }
      return `<div class="pb-picker"><div class="pb-chips">${chips}${add}</div>${menu}</div>`;
    }
    function inputField(scope, msId, field, lblKey, value, type) {
      const id = `f-${scope}-${msId}-${field}`;
      const tag = type === "area"
        ? `<textarea data-act="field" data-scope="${scope}" data-ms="${esc(msId)}" data-field="${field}">${esc(value)}</textarea>`
        : `<input data-act="field" data-scope="${scope}" data-ms="${esc(msId)}" data-field="${field}" value="${esc(value)}" />`;
      return `<div class="pb-field"><label for="${id}">${esc(label(lblKey))}</label>${tag}</div>`;
    }
    function selectField(scope, msId, field, lblKey, value, opts, useStatus) {
      const rows = opts.map((o) => {
        const txt = useStatus ? statusLabel(o) : o;
        return `<option value="${esc(o)}"${o === value ? " selected" : ""}>${esc(txt)}</option>`;
      }).join("");
      return `<div class="pb-field"><label>${esc(label(lblKey))}</label>`
        + `<select data-act="field" data-scope="${scope}" data-ms="${esc(msId)}" data-field="${field}">${rows}</select></div>`;
    }
    function refField(scope, msId, field, lblKey, selected) {
      return `<div class="pb-field"><label>${esc(label(lblKey))}</label>${chipsHtml(scope, msId, field, selected)}</div>`;
    }
    function basicsDirty() {
      if (!draft) return false;
      const simple = ["title", "status", "kind", "visibility", "time_range", "summary", "notes"];
      for (const f of simple) if (text(draft[f]) !== text(caseData[f])) return true;
      for (const f of REF_FIELDS) {
        if (asArr(draft[f]).join("|") !== asArr(caseData[f]).join("|")) return true;
      }
      return false;
    }
    function renderBasics() {
      const d = draft;
      const dirty = basicsDirty() ? '<span class="pb-dirty-dot"></span>' : "";
      const refs = REF_FIELDS.map((f) => refField("basics", "", f, "field_" + f, d[f])).join("");
      return `<section class="pb-card">
        <div class="pb-card-head"><h3>${esc(label("tab_basic"))}${dirty}</h3>
          <span class="pb-muted">${esc(d.id)}</span></div>
        <div class="pb-grid">
          ${inputField("basics", "", "title", "field_title", d.title, "text")}
          <div class="pb-row">
            ${selectField("basics", "", "status", "field_status", d.status, STATUS_OPTS, true)}
            ${selectField("basics", "", "kind", "field_kind", d.kind, KIND_OPTS, false)}
            ${selectField("basics", "", "visibility", "field_visibility", d.visibility, VIS_OPTS, false)}
          </div>
          ${inputField("basics", "", "time_range", "field_time_range", d.time_range, "text")}
          ${inputField("basics", "", "summary", "field_summary", d.summary, "area")}
          ${inputField("basics", "", "notes", "field_notes", d.notes, "area")}
          <div class="pb-muted">${esc(label("links_section"))}</div>
          ${refs}
        </div>
        <div class="pb-card-actions">
          <button type="button" class="pb-btn is-ghost" data-act="archive">${esc(label("archive_project"))}</button>
          <button type="button" class="pb-btn is-primary" data-act="save-basics">${esc(label("save_project"))}</button>
        </div>
      </section>`;
    }
    function msDirty(id) {
      const dr = msDrafts[id];
      const orig = milestones.find((m) => m.id === id);
      if (!dr || !orig) return false;
      for (const f of ["title", "status", "target", "summary"]) {
        if (text(dr[f]) !== text(orig[f])) return true;
      }
      for (const f of MS_REF_FIELDS) {
        if (asArr(dr[f]).join("|") !== asArr(orig[f]).join("|")) return true;
      }
      return false;
    }
    function renderMilestoneCard(m) {
      const dr = msDrafts[m.id] || m;
      const open = openMsId === m.id;
      const done = Number(m.done_count || 0);
      const total = Number(m.total_count || 0);
      const pct = total ? Math.round((done / total) * 100) : 0;
      const dirty = msDirty(m.id) ? '<span class="pb-dirty-dot"></span>' : "";
      let head = `<div class="pb-ms-head" data-act="ms-toggle" data-ms="${esc(m.id)}">
        <span class="pb-ms-title">${esc(dr.title || m.id)}${dirty}</span>
        <span class="pb-pill">${esc(statusLabel(dr.status))}`
        + (total ? ` · ${esc(label("completion").replace("{done}", done).replace("{total}", total).replace("{pct}", pct))}` : "")
        + `</span></div>`;
      if (!open) return `<div class="pb-ms">${head}</div>`;
      const progress = total
        ? `<div class="pb-progress"><span style="width:${pct}%"></span></div>` : "";
      const refs = MS_REF_FIELDS.map((f) => refField("ms", m.id, f, "field_" + f, dr[f])).join("");
      return `<div class="pb-ms">${head}<div class="pb-ms-body">
        ${progress}
        ${inputField("ms", m.id, "title", "field_title", dr.title, "text")}
        <div class="pb-row">
          ${selectField("ms", m.id, "status", "field_status", dr.status, MS_STATUS_OPTS, true)}
          ${inputField("ms", m.id, "target", "field_target", dr.target, "text")}
        </div>
        ${inputField("ms", m.id, "summary", "field_summary", dr.summary, "area")}
        ${refs}
        <div class="pb-card-actions">
          <button type="button" class="pb-btn is-primary" data-act="save-ms" data-ms="${esc(m.id)}">${esc(label("save_milestone"))}</button>
        </div>
      </div></div>`;
    }
    function renderNewMilestone() {
      const n = newMs || { title: "", id: "", target: "", summary: "" };
      return `<div class="pb-ms"><div class="pb-ms-body" style="padding-top:14px">
        ${inputField("new", "", "title", "field_title", n.title, "text")}
        <div class="pb-row">
          ${inputField("new", "", "id", "field_id", n.id, "text")}
          ${inputField("new", "", "target", "field_target", n.target, "text")}
        </div>
        ${inputField("new", "", "summary", "field_summary", n.summary, "area")}
        <div class="pb-card-actions">
          <button type="button" class="pb-btn is-primary" data-act="add-ms">${esc(label("add_milestone"))}</button>
        </div>
      </div></div>`;
    }
    function render() {
      const root = document.getElementById("root");
      const sections = asArr(asObj(args.settings).sections);
      const show = (s) => !sections.length || sections.includes(s);
      const cards = milestones.map(renderMilestoneCard).join("");
      const basics = show("basics") ? renderBasics() : "";
      const ms = show("milestones") ? `<section class="pb-card">
          <div class="pb-card-head"><h3>${esc(label("milestones"))}</h3></div>
          ${cards}
          ${renderNewMilestone()}
        </section>` : "";
      root.innerHTML = `<div class="pb-shell">${basics}${ms}</div>`;
      bind();
      setHeight();
    }
    function syncField(scope, msId, field, value, isRef) {
      let target;
      if (scope === "basics") target = draft;
      else if (scope === "ms") target = (msDrafts[msId] = msDrafts[msId] || {});
      else target = (newMs = newMs || {});
      target[field] = value;
    }
    function bind() {
      document.querySelectorAll('[data-act="field"]').forEach((el) => {
        el.addEventListener("input", () => {
          syncField(el.dataset.scope, el.dataset.ms, el.dataset.field, el.value, false);
          // dirty dot only; avoid full re-render to keep focus
          refreshDirtyDots();
        });
      });
      document.querySelectorAll('[data-act="chip-open"]').forEach((el) => {
        el.addEventListener("click", () => {
          picker = { scope: el.dataset.scope, msId: el.dataset.ms, field: el.dataset.field, query: "" };
          render();
        });
      });
      document.querySelectorAll('[data-act="chip-remove"]').forEach((el) => {
        el.addEventListener("click", () => {
          const cur = currentRefs(el.dataset.scope, el.dataset.ms, el.dataset.field);
          setRefs(el.dataset.scope, el.dataset.ms, el.dataset.field, cur.filter((x) => x !== el.dataset.id));
          render();
        });
      });
      document.querySelectorAll('[data-act="chip-pick"]').forEach((el) => {
        el.addEventListener("click", () => {
          const cur = currentRefs(el.dataset.scope, el.dataset.ms, el.dataset.field);
          if (!cur.includes(el.dataset.id)) cur.push(el.dataset.id);
          setRefs(el.dataset.scope, el.dataset.ms, el.dataset.field, cur);
          render();
        });
      });
      const q = document.querySelector('[data-act="chip-query"]');
      if (q) {
        q.addEventListener("input", () => { if (picker) picker.query = q.value; renderMenuOnly(q); });
        q.focus();
        q.setSelectionRange(q.value.length, q.value.length);
      }
      bindButtons();
    }
    function currentRefs(scope, msId, field) {
      if (scope === "basics") return asArr(draft[field]).slice();
      if (scope === "ms") { msDrafts[msId] = msDrafts[msId] || {}; return asArr(msDrafts[msId][field]).slice(); }
      return [];
    }
    function setRefs(scope, msId, field, values) {
      if (scope === "basics") draft[field] = values;
      else if (scope === "ms") { msDrafts[msId] = msDrafts[msId] || {}; msDrafts[msId][field] = values; }
    }
    function refreshDirtyDots() {
      // lightweight: re-render only if a dot would appear/disappear is complex;
      // recompute head dots without losing focus by toggling classes.
      // Cheap approach: do nothing live; dots refresh on next full render.
    }
    function renderMenuOnly(input) {
      // Re-render whole tree but restore focus to query input afterwards.
      render();
    }
    function bindButtons() {
      const sb = document.querySelector('[data-act="save-basics"]');
      if (sb) sb.addEventListener("click", saveBasics);
      const ar = document.querySelector('[data-act="archive"]');
      if (ar) ar.addEventListener("click", () => emit("archive_project", { id: caseData.id }));
      document.querySelectorAll('[data-act="ms-toggle"]').forEach((el) => {
        el.addEventListener("click", (ev) => {
          if (ev.target.closest('[data-act]') !== el) return;
          openMsId = openMsId === el.dataset.ms ? "" : el.dataset.ms;
          picker = null;
          render();
        });
      });
      document.querySelectorAll('[data-act="save-ms"]').forEach((el) => {
        el.addEventListener("click", () => saveMilestone(el.dataset.ms));
      });
      const am = document.querySelector('[data-act="add-ms"]');
      if (am) am.addEventListener("click", addMilestone);
    }
    function saveBasics() {
      if (!text(draft.title).trim()) { toast(label("title_required")); return; }
      toast(label("saving"));
      emit("save_basics", { id: caseData.id, fields: { ...draft } });
    }
    function saveMilestone(id) {
      const dr = msDrafts[id];
      if (!dr) return;
      if (!text(dr.title).trim()) { toast(label("title_required")); return; }
      toast(label("saving"));
      emit("save_milestone", { id: caseData.id, milestone_id: id, fields: { ...dr } });
    }
    function addMilestone() {
      const n = newMs || {};
      if (!text(n.title).trim()) { toast(label("title_required")); return; }
      toast(label("saving"));
      emit("add_milestone", { id: caseData.id, fields: { ...n } });
    }
    window.addEventListener("message", (event) => {
      const data = event.data || {};
      if (data.type !== RENDER) return;
      args = data.args || {};
      labels = asObj(args.labels);
      caseData = asObj(args.case);
      milestones = asArr(args.milestones);
      optionMaps = asObj(args.option_maps);
      draft = { ...caseData };
      REF_FIELDS.forEach((f) => { draft[f] = asArr(caseData[f]).slice(); });
      msDrafts = {};
      milestones.forEach((m) => {
        msDrafts[m.id] = { ...m };
        MS_REF_FIELDS.forEach((f) => { msDrafts[m.id][f] = asArr(m[f]).slice(); });
      });
      newMs = null;
      picker = null;
      render();
    });
    send(READY, { apiVersion: 1 });
    setHeight();
  </script>
</body>
</html>
