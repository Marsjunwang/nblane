# 定时任务的参考声明（可选）。定时任务归 OpenClaw 管，直接在 OpenClaw 里建和改即可；
# 提示词只写任务本身，调用 nblane 的规则在 nblane 技能（skills/nblane/SKILL.md）里。
# 想用这份声明维护时，手动跑 nblane openclaw automations sync <profile>
#   （默认 dry-run；--apply 执行 add/edit；--apply --prune 才删除已移除的 nblane: 任务）。
# 只处理 declarationKey 以 `nblane:` 开头的任务；系统任务与手工任务不触碰。
# `${VAR}` 从本机 .env / 环境注入，未设置即报错，取值永不入库。
version: 1
defaults:
  tz: Asia/Shanghai
  model: qwen/qwen3.7-flash
  fallbacks: [rightcode/gpt-6-astra]
  session: isolated
  timeout_seconds: 300
  deliver:
    channel: openclaw-weixin
    to: ${WEIXIN_OWNER_ID} # 微信 Owner 路由 ID，形态 <id>@im.wechat
automations:
  - key: nblane:daily-plan
    name: 每日计划
    cron: "30 8 * * *"
    prompt: prompts/daily-plan.md
  - key: nblane:daily-review
    name: 每日复盘
    cron: "30 21 * * *"
    prompt: prompts/daily-review.md
  - key: nblane:weekly-maintenance
    name: 每周巩固
    cron: "0 20 * * 0"
    session: main # 覆盖 defaults：周维护需要主会话的记忆上下文
    # main 会话任务在 2026.9 是 system event：model/fallbacks/timeout/deliver 均被网关忽略
    prompt: prompts/weekly-maintenance.md
  - key: nblane:weekly-divination
    name: 每周占卜
    cron: "30 20 * * 0" # 周报（20:00）之后，戏占卦辞推微信
    prompt: prompts/weekly-divination.md
